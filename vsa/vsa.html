<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cuestionario de calidad VSA · IGE</title>
<!--
  [VSA] Cuestionario de calidad VSA (lista «CUESTIONARIO DE CALIDAD VSA», Lists/PARTES VSA, sitio /et/jige/colaborativo).
  Seguimiento del Acuerdo Marco VS-VSA: la BAE valora de 0 a 4 las 24 preguntas sobre la empresa de seguridad y lo envía;
  el Negociado de Seguridad de la SUIGE lo valora (en curso, cerrado, elevado a DIACU) o lo devuelve/rechaza; DIACU cierra lo elevado.
  Formulario y textos tomados de la plantilla InfoPath «cuestionario_vsa.xsn». Una sola página, sin recursos de internet.
-->
<style>
  :root {
    --bg: #f3f5f8; --surface: #fff; --surface-2: #e8eef6; --text: #1b2430; --muted: #5a6575; --line: #d5dce6;
    --brand: #1b3a5c; --on-brand: #fff; --oro: #b8962e;
    --ok: #2e7d32; --ok-bg: #dcefdc; --warn: #9a5b00; --warn-bg: #fdebc8; --bad: #b71c1c; --bad-bg: #fbdada;
    --info: #1d4f91; --info-bg: #dde8f7; --na: #555; --na-bg: #e7e7e7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .oficial { background: #fff; border-bottom: 1px solid var(--line); }
  .oficial > div { max-width: 1180px; margin: 0 auto; padding: 6px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; }
  .oficial .izq { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .oficial .minisdef { height: 46px; }
  .oficial .org { flex: 1; font-size: .78rem; color: #333; letter-spacing: .06em; line-height: 1.3; border-left: 1px solid #bbb; padding-left: 12px; }
  .oficial .org b { font-size: .86rem; letter-spacing: .08em; }
  .oficial .uso { height: 28px; }
  .top { position: sticky; top: 0; z-index: 5; background: linear-gradient(90deg, #102840, var(--brand) 55%, #24507a); color: var(--on-brand); border-bottom: 4px solid var(--oro); box-shadow: 0 2px 6px rgba(0,0,0,.25); }
  .top > div { max-width: 1180px; margin: 0 auto; padding: 8px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .top .tit { flex: 1; min-width: 240px; }
  .top h1 { margin: 0; font-size: 1.25rem; letter-spacing: .05em; font-weight: 800; }
  .top .sub { display: block; font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; color: #e6d9a8; }
  .top .estado { font-size: .8rem; opacity: .9; }
  .top button, .top a.btn { background: rgba(255,255,255,.12); color: inherit; border: 1px solid rgba(232,215,160,.5); }
  .quien { font-size: .85rem; font-weight: 700; background: rgba(255,255,255,.14); border: 1px solid rgba(232,215,160,.5); border-radius: 9px; padding: 5px 10px; }
  @media (max-width: 600px) { .oficial .org { display: none; } .oficial > div { grid-template-columns: auto 1fr; } .oficial .uso { justify-self: end; } .top h1 { font-size: 1rem; } }
  main { max-width: 1180px; margin: 0 auto; padding: 0 16px 60px; }
  nav.tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 12px; margin: 12px 0; flex-wrap: wrap; }
  nav.tabs a { flex: 1; text-align: center; padding: 8px 4px; border-radius: 9px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: .9rem; cursor: pointer; white-space: nowrap; }
  nav.tabs a.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  nav.tabs a i { font-style: normal; background: var(--bad); color: #fff; border-radius: 999px; padding: 0 7px; margin-left: 4px; font-size: .78rem; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .muted { color: var(--muted); } .small { font-size: .85rem; }
  button, .btn { font: inherit; font-size: .9rem; font-weight: 600; padding: 7px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--text); cursor: pointer; text-decoration: none; display: inline-block; text-align: center; }
  button:disabled { opacity: .55; cursor: default; }
  .prim { background: var(--brand); color: #fff; border-color: var(--brand); }
  .peligro { background: var(--bad); color: #fff; border-color: var(--bad); }
  button.verde { background: var(--ok); color: #fff; border-color: var(--ok); }
  input, select, textarea { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff; width: 100%; }
  textarea { min-height: 7em; resize: vertical; }
  label.lbl { display: block; font-size: .82rem; font-weight: 600; color: var(--muted); margin: 10px 0 3px; }
  label.check { display: inline-flex; gap: 6px; align-items: center; margin: 8px 12px 4px 0; font-size: .95rem; }
  label.check input { width: auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px 12px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 8px 0 12px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-top: 5px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; font-size: .82rem; color: var(--muted); cursor: pointer; }
  .kpi b { display: block; font-size: 1.6rem; color: var(--text); }
  .kpi.rojo { background: #fde8e8; border-color: #f1b3b3; border-top-color: var(--bad); } .kpi.rojo b { color: var(--bad); }
  .kpi.ambar { background: #fff4dc; border-color: #f0d08a; border-top-color: #d99a00; } .kpi.ambar b { color: #9a5b00; }
  .kpi.azul { background: #e3ecf8; border-color: #a9c1e3; border-top-color: #1d4f91; } .kpi.azul b { color: #1d4f91; }
  .kpi.morado { background: #efe7f8; border-color: #c9b3e6; border-top-color: #6a3d9a; } .kpi.morado b { color: #6a3d9a; }
  .kpi.verde { background: #e3f2e3; border-color: #a9d3a9; border-top-color: var(--ok); } .kpi.verde b { color: var(--ok); }
  .kpi.gris { background: #f1f1ef; border-color: #c9c9c4; border-top-color: #8a8a84; } .kpi.gris b { color: #55554f; }
  .sec { margin: 18px 0 6px; font-size: .85rem; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; display: flex; justify-content: space-between; font-weight: 700; }
  .inc { cursor: pointer; border-left: 5px solid var(--line); }
  .inc:hover { border-left-color: var(--brand); }
  .inc.alta { border-left-color: var(--bad); }
  .inc .tit { font-weight: 650; }
  .meta { display: flex; flex-wrap: wrap; gap: 5px 10px; margin-top: 4px; font-size: .84rem; align-items: center; }
  .badge { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: .75rem; font-weight: 700; white-space: nowrap; }
  .f0 { background: var(--na-bg); color: var(--na); } .f1 { background: var(--warn-bg); color: var(--warn); } .f2 { background: #ffe0b2; color: #8a3b00; }
  .f3 { background: #efe7f8; color: #5b2f8c; } .f4 { background: var(--info-bg); color: var(--info); } .f5 { background: #2e7d32; color: #fff; } .f6 { background: var(--bad-bg); color: var(--bad); }
  .p1 { background: #e7e7e7; color: #555; } .p2 { background: var(--info-bg); color: var(--info); } .p3 { background: var(--warn-bg); color: var(--warn); } .p4 { background: #ffd8c2; color: #9b3a00; } .p5 { background: var(--bad); color: #fff; }
  .espera { background: var(--na-bg); color: var(--na); } .espera.tarde { background: var(--bad-bg); color: var(--bad); }
  .rol { background: rgba(27,58,92,.08); color: var(--brand); border: 1px solid #a9c1e3; }
  .vacio { padding: 18px; text-align: center; color: var(--muted); }
  .aviso { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
  .error { background: var(--bad-bg); color: var(--bad); border-radius: 10px; padding: 10px 12px; margin: 10px 0; font-weight: 600; }
  .okmsg { background: var(--ok-bg); color: var(--ok); border-radius: 10px; padding: 10px 12px; margin: 10px 0; font-weight: 600; }
  .acciones { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  table.t { width: 100%; border-collapse: collapse; font-size: .85rem; }
  table.t th, table.t td { padding: 5px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  /* Estadísticas: barras de una sola serie (un tono), con el número escrito al lado */
  .barras { display: grid; grid-template-columns: minmax(130px, 48%) 1fr auto; gap: 6px 10px; align-items: center; font-size: .85rem; }
  .barras .et { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .barras .pista { height: 16px; }
  .barras .bar { height: 16px; background: var(--brand); border-radius: 0 4px 4px 0; min-width: 2px; }
  .barras .bar:hover { background: #24507a; }
  .barras .n { font-variant-numeric: tabular-nums; color: var(--text); white-space: nowrap; }
  .estadis { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); }
  @media (max-width: 420px) { .estadis { grid-template-columns: 1fr; } }
  .estadis h3 { margin: 0 0 8px; font-size: 1rem; }
  dialog { width: min(1240px, calc(100vw - 24px)); height: calc(100vh - 24px); max-height: calc(100vh - 24px); border: 0; border-radius: 14px; padding: 0; font-size: 16px; }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog input, dialog select, dialog textarea, dialog button, dialog .btn { font-size: 16px; }
  .dh { position: sticky; top: 0; z-index: 2; background: var(--brand); border-bottom: 3px solid var(--oro); color: #fff; padding: 12px 18px; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  .dh h2 { margin: 0; font-size: 1.15rem; }
  .db { padding: 14px 20px 24px; }
  .ficha { display: grid; gap: 18px; }
  @media (min-width: 1000px) { .ficha { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; } }
  .campo { border-bottom: 1px solid var(--line); padding: 6px 0; }
  .campo b { display: block; font-size: .8rem; color: var(--muted); }
  .campo div { white-space: pre-wrap; overflow-wrap: anywhere; }
  .texto { background: #fafbfc; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin: 4px 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .panel { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
  .panel h3 { margin: 0 0 6px; font-size: 1.02rem; }
  .panel.turno { background: #fff4dc; border: 2px solid #d99a00; }
  .pasos { display: flex; flex-wrap: wrap; align-items: stretch; gap: 4px; margin: 0 0 14px; }
  .pasos i { align-self: center; color: var(--muted); font-style: normal; font-weight: 700; }
  .paso { display: flex; flex-direction: column; padding: 6px 10px; border-radius: 10px; background: #eceff3; color: #6b7480; border: 2px solid transparent; min-width: 110px; }
  .paso small { font-size: .75rem; } .paso.hecho { background: #dcefdc; color: #1f5e22; } .paso.ahora { background: #fff1d6; color: #8a4b00; border-color: #d99a00; }
  .paso.salto { background: #f4f5f7; color: #9aa1aa; text-decoration: line-through; } .paso.mal { background: var(--bad-bg); color: var(--bad); }
  button.pv { background: #fff; border-width: 2px; } button.pv.rojo { color: var(--bad); border-color: var(--bad); } button.pv.verde { color: var(--ok); border-color: var(--ok); }
  button.pv.rojo.on { background: var(--bad); color: #fff; } button.pv.verde.on { background: var(--ok); color: #fff; }
  .sugs { border: 1px solid var(--line); border-radius: 10px; margin-top: 4px; max-height: 240px; overflow: auto; background: #fff; }
  .sugs button { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; padding: 8px 10px; font-weight: 400; }
  .sugs button:hover { background: var(--surface-2); }
  .elegido { font-weight: 600; margin-top: 4px; }
  .req::after { content: ' *'; color: var(--bad); }
  /* Formulario de notificación (mismo orden y textos que el InfoPath) */
  .fsec { background: var(--brand); color: #fff; border-bottom: 3px solid var(--oro); border-radius: 8px 8px 0 0; padding: 6px 12px; font-weight: 800; letter-spacing: .04em; margin: 18px 0 0; text-transform: uppercase; font-size: .9rem; }
  .fcaja { border: 1px solid var(--line); border-top: 0; border-radius: 0 0 10px 10px; padding: 4px 14px 12px; background: #fff; }
  .ayuda { font-size: .82rem; color: var(--muted); margin: 0 0 4px; font-style: italic; }
  .gestorok { display: inline-block; background: #6aa84f; color: #fff; border-radius: 999px; padding: 4px 14px; font-weight: 700; margin-top: 6px; }
  .personas .chip { display: inline-flex; gap: 6px; align-items: center; background: var(--surface-2); border-radius: 999px; padding: 3px 10px; margin: 4px 6px 0 0; font-size: .9rem; }
  .personas .chip a { color: var(--bad); text-decoration: none; font-weight: 800; }
  .cadena { background: var(--surface-2); border-radius: 8px; padding: 6px 10px; margin-top: 8px; font-weight: 600; }
  .acepto { background: #fff8e6; border: 1px solid #f0d08a; border-radius: 10px; padding: 8px 12px; margin-top: 12px; }
  .acepto label { display: flex; gap: 8px; align-items: flex-start; font-size: .9rem; }
  .acepto input { width: auto; margin-top: 4px; }
  .nota { background: #eef3fa; border-left: 4px solid var(--brand); padding: 8px 12px; border-radius: 6px; margin-top: 12px; font-size: .9rem; }
  button.ambar { background: #c09000; color: #fff; border-color: #c09000; }
  button.suige { background: #0b5394; color: #fff; border-color: #0b5394; }
  button.rojo { background: #e00000; color: #fff; border-color: #e00000; }
  button.diacu { background: #6aa84f; color: #fff; border-color: #6aa84f; }
  button.ige { background: #38761d; color: #fff; border-color: #38761d; }
  @media (max-width: 600px) { .barras { grid-template-columns: 40% 1fr auto; } }
  /* Cuestionario */
  .preg { display: grid; grid-template-columns: 2.2em minmax(0, 1fr); gap: 4px 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .preg .pn { font-weight: 800; color: var(--brand); text-align: right; }
  .preg .pt { font-size: .92rem; }
  .preg .pr { grid-column: 2; display: grid; grid-template-columns: minmax(150px, 220px) 1fr; gap: 8px; }
  @media (max-width: 600px) { .preg .pr { grid-template-columns: 1fr; } }
  select.nota.n4 { background: #dcefdc; } select.nota.n3 { background: var(--info-bg); } select.nota.n2 { background: var(--warn-bg); } select.nota.n1 { background: var(--bad-bg); } select.nota.n0 { background: var(--na-bg); }
  .resumenNotas { background: var(--surface-2); border-radius: 8px; padding: 6px 10px; margin-top: 8px; }
  .barras .bar.baja { background: var(--bad); }
  [hidden] { display: none !important; }
  .card.turno { border-left: 5px solid #d99a00; } .txt-bad { color: var(--bad); font-weight: 700; }
  table.cuest td { font-size: .88rem; } table.cuest tr.corte td { border-top: 3px solid var(--oro); }
</style>
</head>

    if (ir) {
      var d = ir.dataset.ir;
      if (d === 'pendientes') { pref.vista = 'pendientes'; pendVista = 'pendientes'; }
      else {
        pref.f = FILTRO_VACIO(); pref.vista = d === 'estadisticas' ? 'estadisticas' : 'consulta';
        if (d.indexOf('fase:') === 0) pref.f.fase = d.slice(5);
        if (d === 'media:baja') pref.f.fase = 'baja';
        if (d.indexOf('nov:') === 0) pref.f.nov = d.slice(4);
        if (d.indexOf('anio:') === 0) pref.f.anio = d.slice(5);
      }
      guardarPref(); render(); return;
    }
    var pv = el.closest('[data-pv]');
    if (pv) { pendVista = pv.dataset.pv; render(); return; }
    if (el.closest('[data-csv]')) { csv(); return; }
    if (el.closest('[data-relimp]')) { imprimirRelacion(); return; }
    if (el.closest('[data-limpiar]')) { pref.f = FILTRO_VACIO(); guardarPref(); render(); return; }
    var fi = el.closest('[data-fichaimp]');
    if (fi) { var tf = items.find(function (x) { return x.id === Number(fi.dataset.fichaimp); }); if (tf) imprimirFicha(tf); return; }
    var ac = el.closest('[data-acc]');
    if (ac) { var ta = items.find(function (x) { return x.id === dlgId; }); if (ta) accion(ta, ac.dataset.acc, ac); return; }
    var s = el.closest('[data-id]');
    if (s && !el.closest('dialog')) abrir(Number(s.dataset.id));
  });
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.id === 'fAgrupar') { pref.agrupar = el.value; guardarPref(); render(); return; }
    var f = { fFase: 'fase', fEmpresa: 'empresa', fSuige: 'suige', fAnio: 'anio', fNov: 'nov', fDesde: 'desde', fHasta: 'hasta' }[el.id];
    if (f) { pref.f[f] = el.value; guardarPref(); render(); return; }
    if (el.id === 'aCorreo' && esAdmin) { pref.correo = el.checked; guardarPref(); return; }
    if ((el.id === 'aSitio' || el.id === 'aLista') && esAdmin) { pref.sitio = $('#aSitio').value.trim() || pref.sitio; pref.lista = $('#aLista').value.trim() || pref.lista; guardarPref(); cargadoEn = null; aux = null; tiposCol = null; cargar(); }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id !== 'fq') return;
    pref.f.q = e.target.value; guardarPref();
    var pos = e.target.selectionStart; render();
    var i = $('#fq'); if (i) { i.focus(); i.setSelectionRange(pos, pos); }
  });
  $('#dlg').addEventListener('close', function () { dlgId = null; });

  render();
  cargar().then(function () { if (esAdmin && cargadoEn) cargarAccesos().then(render); });
})();
</script>
</body>
</html>
