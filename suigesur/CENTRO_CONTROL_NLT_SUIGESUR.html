<title>Centro de Control NLT · SUIGESUR</title>
<!--
  CENTRO DE CONTROL NLT SUIGESUR
  Se sube a una biblioteca del sitio de Colabora (p. ej. /et/SUIGESUR/JSUIGE/aplicaciones) y se abre desde allí.
  Trabaja con cuatro listas del sitio (NLT_MAESTRO, UCO_SUIGESUR, CONTROL_ENTREGAS, SEGUIMIENTO_EVENTOS) usando la
  sesión del usuario y la API REST de SharePoint. No carga nada de internet ni envía datos fuera del servidor.
  Los datos están solo en SharePoint: el navegador guarda únicamente preferencias (pestaña, filtros, columnas).
  Cada alta o modificación se relee del servidor y solo se da por buena si los valores coinciden.
-->
<style>
  :root {

  .top .estado.bad { background: #b71c1c; } .top .estado.warn { background: #9a5b00; } .top .estado.ok { background: rgba(255,255,255,.18); }
  .top button.b { background: rgba(255,255,255,.15); color: inherit; border: 0; }

  .badge.bad { background: var(--bad-bg); color: var(--bad); } .badge.info { background: var(--info-bg); color: var(--info); }
  .badge.none { background: var(--na-bg); color: var(--na); }
  .chip { background: var(--surface-2); color: var(--muted); border-radius: 6px; padding: 1px 7px; font-weight: 600; font-size: .75rem; white-space: nowrap; }
  .tw { overflow-x: auto; }
  table.t { width: 100%; border-collapse: collapse; font-size: .82rem; }
  table.t th { background: var(--brand); color: #fff; text-align: left; padding: 6px; font-weight: 600; position: sticky; top: 0; white-space: nowrap; }

  .fila-bar { display: grid; grid-template-columns: minmax(120px, 1.3fr) 2fr auto; gap: 8px; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--line); font-size: .84rem; cursor: pointer; }
  .fila-bar:last-child { border-bottom: 0; }

  .pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .pills a { padding: 5px 12px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-weight: 600; cursor: pointer; text-decoration: none; font-size: .86rem; }
  .pills a.on { background: var(--brand); color: #fff; }
  .aviso { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
  .error { background: var(--bad-bg); color: var(--bad); border-radius: 10px; padding: 10px 12px; margin: 10px 0; font-weight: 600; white-space: pre-wrap; overflow-wrap: anywhere; }
  .error small, .bien small, .aviso small { display: block; font-weight: 400; margin-top: 4px; }
  .bien { background: var(--ok-bg); color: var(--ok); border-radius: 10px; padding: 10px 12px; margin: 10px 0; font-weight: 600; }
  .info { background: var(--info-bg); color: var(--info); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
  dialog { width: min(820px, calc(100vw - 16px)); max-height: calc(100vh - 16px); border: 0; border-radius: 14px; padding: 0; }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .dh { position: sticky; top: 0; z-index: 2; background: var(--brand); color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  .dh h2 { margin: 0; font-size: 1.05rem; }
  .dh button { background: transparent; color: #fff; border: 0; font-size: 1.3rem; padding: 0 4px; }
  .db { padding: 12px 16px; }
  .df { position: sticky; bottom: 0; background: #fff; border-top: 1px solid var(--line); padding: 10px 16px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }

  .informe h2 { text-align: center; text-transform: uppercase; font-size: 1.1rem; margin: 6px 0; }
  .informe h3 { color: var(--brand); margin: 16px 0 6px; font-size: .95rem; }

  .graf rect.b { fill: var(--brand-2); } .graf rect.b:hover { fill: var(--brand); }

  .apilada i { display: block; height: 100%; }
  .s-ok { background: var(--ok); } .s-fuera { background: #d98c1a; } .s-venc { background: var(--bad); } .s-pend { background: #8aa1c4; } .s-na { background: #bbb; }
  code { background: var(--surface-2); padding: 0 4px; border-radius: 4px; font-size: .85em; }
  @media (max-width: 640px) { .dos { grid-template-columns: 1fr; } .plazo { grid-template-columns: auto 1fr; } .plazo input[type=date] { grid-column: 2; } }
  @media print {
    body.imprimiendo .top, body.imprimiendo nav.tabs, body.imprimiendo #vista > :not(#informeDoc) { display: none !important; }
    body.imprimiendo .informe { border: 0; padding: 0; }
  }
</style>

<dialog id="dlg"></dialog>
<script>
  // Comprobación en sintaxis antigua: si el navegador es Internet Explorer, avisa (el resto del código no se ejecutaría).
  if (document.documentMode || !window.fetch || !window.Promise || !Element.prototype.closest || !window.HTMLDialogElement) {
    document.getElementById('vista').innerHTML = '<div class="error">Tu navegador abre esta página en modo Internet Explorer o es muy antiguo. Ábrela en Microsoft Edge o Chrome.</div>';
    document.getElementById('estado').textContent = 'Navegador no compatible';
    window.NAVEGADOR_ANTIGUO = true;
  }
  // Si el código principal no llega a ejecutarse (archivo alterado al subirlo o error de sintaxis), se avisa en vez de quedarse en «Conectando…»
  window.CCNLT_ERRORES = [];
  window.addEventListener('error', function (e) { window.CCNLT_ERRORES.push((e.message || 'error') + (e.lineno ? ' (línea ' + e.lineno + ')' : '')); });
  window.addEventListener('load', function () {
    if (window.CCNLT_ARRANCADA || window.NAVEGADOR_ANTIGUO) return;
    document.getElementById('estado').textContent = 'La aplicación no ha arrancado';
    document.getElementById('vista').innerHTML = '<div class="error">El código de la página no se ha podido ejecutar. Suele deberse a que el archivo ha llegado modificado al servidor o al navegador. ' +
      'Vuelve a subir el archivo original sin abrirlo ni editarlo y ábrelo desde la biblioteca en Edge o Chrome.<small>' +
      (window.CCNLT_ERRORES.length ? 'Error: ' + window.CCNLT_ERRORES.join(' · ').replace(/[<>&]/g, '') : 'Sin mensaje de error del navegador') + '</small></div>';
  });
</script>
<script>
(function () {
  'use strict';
  if (window.NAVEGADOR_ANTIGUO) return;
  window.CCNLT_ARRANCADA = true;

  // ================= Utilidades =================
  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = n => String(n).padStart(2, '0');
  const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const hoy = () => iso(new Date());
  const aFecha = s => { const p = String(s).slice(0, 10).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
  const diasEntre = (a, b) => Math.round((aFecha(b) - aFecha(a)) / 864e5);
  const sumarDias = (s, n) => { const d = aFecha(s); d.setDate(d.getDate() + n); return iso(d); };
  const sinTildes = s => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const norm = s => sinTildes(s).replace(/[^a-z0-9ñ]+/g, ' ').trim();
  const fCorta = s => s ? aFecha(s).toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '';
  const fHora = d => { const x = new Date(d); return isNaN(x) ? '' : x.toLocaleDateString('es-ES') + ' ' + x.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }); };
  const hora = () => new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
  const MES = ['ENE', 'FEB', 'MAR', 'ABR', 'MAY', 'JUN', 'JUL', 'AGO', 'SEP', 'OCT', 'NOV', 'DIC'];
  const MESL = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
  const lista = v => v == null ? [] : Array.isArray(v) ? v : Array.isArray(v.results) ? v.results : [];
  const vacio = v => v == null || v === '' || (Array.isArray(v) && !v.length);
  const pct = (a, b) => b ? Math.round(a / b * 100) : null;
  const pctTxt = p => p == null ? '—' : p + ' %';
  const unicos = arr => Array.from(new Set(arr.filter(x => x !== '' && x != null)));
  const porNombre = (a, b) => String(a).localeCompare(String(b), 'es', { numeric: true });
  const texto = html => {
    if (!html) return '';
    if (!/[<&]/.test(html)) return String(html).trim();
    const d = new DOMParser().parseFromString(String(html).replace(/<br\s*\/?>/gi, '\n').replace(/<\/(p|div|li)>/gi, '\n'), 'text/html');
    return (d.body.textContent || '').replace(/​/g, '').replace(/\n{3,}/g, '\n\n').trim();
  };
  const fechaSP = v => v ? iso(new Date(v)) : '';
  const opciones = (arr, sel, vacioTxt) => (vacioTxt != null ? '<option value="">' + esc(vacioTxt) + '<\/option>' : '') +
    arr.map(o => { const v = Array.isArray(o) ? o[0] : o, t = Array.isArray(o) ? o[1] : o; return '<option value="' + esc(v) + '"' + (String(v) === String(sel) ? ' selected' : '') + '>' + esc(t) + '<\/option>'; }).join('');

  // ================= Preferencias (solo en este navegador; nunca datos) =================
  const CLAVE = 'centro-control-nlt-suigesur';
  const pref = { vista: 'inicio', sitio: '', mapa: {}, f: {}, sub: 'unidades', organismo: 'SUBINSPECCIÓN GENERAL DEL EJÉRCITO SUR' };
  try { Object.assign(pref, JSON.parse(localStorage.getItem(CLAVE)) || {}); } catch (e) { /* sin memoria local */ }
  const guardarPref = () => { try { localStorage.setItem(CLAVE, JSON.stringify(pref)); } catch (e) { /* sin memoria local */ } };
  const F = Object.assign({ anio: String(new Date().getFullYear()), per: '', uni: '', obl: '', cat: '', tipo: '', sit: '', q: '', est: '',
    oq: '', oper: '', ocat: '', oact: 'activas', uq: '', uamb: '', uact: 'activas', eq: '', esit: 'abiertos', etipo: '', euni: '',
    adesde: '', ahasta: '', gran: 'mensual' }, pref.f || {});
  const guardarF = () => { pref.f = F; guardarPref(); };

  // ================= Estructura de las listas =================

  const DEF = {
    NLT_MAESTRO: { titulo: 'Catálogo de obligaciones', campos: [

    CONTROL_ENTREGAS: { titulo: 'Control de entregas', campos: [
      { k: 'titulo', in: 'Title', t: 'Text', d: 'Título', req: true },

  // ---------- Unidad ----------

      if (!(L.UCO_SUIGESUR.map.activa || []).length) delete d.activa;

        render();

      U().filter(u => u.activa || hab.indexOf(u) >= 0).sort((a, b) => porNombre(a.siglas || a.nombre, b.siglas || b.nombre)).map(u => '<label><input type="checkbox" data-obu="' + u.id + '"' + (!esTodas(o) && hab.indexOf(u) >= 0 ? ' checked' : '') + '> <span><b>' + esc(u.siglas || '') + '<\/b> ' + esc(u.siglas ? '– ' + u.nombre : u.nombre) + (u.activa ? '' : ' <span class="chip">inactiva<\/span>') + '<\/span><\/label>').join('') +
      '<\/div><p class="small muted" id="obUnisN"><\/p><\/div>' +
      avisoFaltan('NLT_MAESTRO', ['codigo', 'periodicidad', 'dia', 'meses', 'regla', 'plazo', 'categoria', 'ambito', 'activa', 'descripcion', 'obs', 'habituales']) + metaElem(o),

    dlg.oninput = ev => { prev(); if (ev.target.name === 'obq') { const q = norm(ev.target.value); $$('#obUnis .lista-u label', dlg).forEach(l => { l.hidden = !!q && norm(l.textContent).indexOf(q) < 0; }); } };
    dlg.onchange = ev => {

    alEnviar = () => {

        dlg.close(); aviso((r.sinCambios ? 'Sin cambios' : 'Obligación guardada y verificada (ID ' + r.id + ')') + (na && na.ok ? ' · ' + na.ok + ' entregas marcadas «No aplicable»' : ''));

  // ---------- Asignación selectiva ----------
  let AS = null;
  const claveDup = (uId, oId, periodo) => uId + '|' + oId + '|' + norm(periodo);
  function existentes() { const s = new Set(); E().forEach(e => { if (e.u && e.ob) s.add(claveDup(e.u.id, e.ob.id, e.periodo)); }); return s; }
  function dlgAsignar(obId) {
    if (!exigirLista('CONTROL_ENTREGAS')) return;
    const obs = O().filter(o => o.activa && o.periodicidad !== 'Por evento');
    if (!obs.length) { abrirDlg('Asignar obligación', '<div class="aviso">No hay obligaciones activas en el catálogo (las «Por evento» se gestionan en Eventos). Crea una en Obligaciones.<\/div>', '<button type="button" data-cerrar>Cerrar<\/button>'); return; }
    if (!U().some(u => u.activa)) { abrirDlg('Asignar obligación', '<div class="aviso">No hay unidades activas. Da de alta al menos una en Unidades.<\/div>', '<button type="button" data-cerrar>Cerrar<\/button>'); return; }
    const ob = obs.find(o => o.id === obId) || obs[0];
    AS = { ob: ob, anio: new Date().getFullYear(), q: '', unis: new Set(unidadesHabituales(ob).filter(u => u.activa).map(u => u.id)) };
    AS.plazos = plazosIniciales();
    const grupos = PERIODICIDADES.filter(p => p !== 'Por evento').map(p => [p, obs.filter(o => o.periodicidad === p)]).concat([['Otras', obs.filter(o => PERIODICIDADES.indexOf(o.periodicidad) < 0)]]).filter(g => g[1].length);
    abrirDlg('Asignar obligación a unidades',
      '<p class="small muted">Crea un registro de seguimiento por cada unidad y plazo que marques. Nada se asigna a unidades que no elijas.<\/p>' +
      '<div class="grid">' + campo('1. Obligación', '<select name="ob">' + grupos.map(g => '<optgroup label="' + esc(g[0]) + '">' + g[1].map(o => '<option value="' + o.id + '"' + (o === ob ? ' selected' : '') + '>' + esc((o.codigo ? o.codigo + ' · ' : '') + o.nombre) + '<\/option>').join('') + '<\/optgroup>').join('') + '<\/select>', 1) +
      campo('Año', '<input name="anio" type="number" min="2000" max="2100" value="' + AS.anio + '">') + '<\/div>' +
      '<p class="small" id="asRegla"><\/p>' +
      '<label class="lbl">2. Periodos y NLT (confirma o corrige la fecha)<\/label><div id="asPlazos"><\/div>' +
      '<label class="lbl">3. Unidades<\/label><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px"><input name="asq" type="search" placeholder="Filtrar unidades…" style="flex:1;min-width:160px">' +
      '<button type="button" data-as="hab">Las obligadas<\/button><button type="button" data-as="todas">Marcar visibles<\/button><button type="button" data-as="ninguna">Ninguna<\/button><\/div><div id="asUnis" class="lista-u"><\/div>' +
      '<label class="check"><input type="checkbox" name="recordar"> Guardar esta selección como unidades obligadas a entregarla<\/label>' +
      '<div id="asResumen" class="info"><\/div><div id="asProg" class="small"><\/div>' + avisoFaltan('CONTROL_ENTREGAS', ['unidadId', 'obligacionId', 'siglas']),
      '<button type="button" data-cerrar>Cancelar<\/button><button type="submit" class="prim" id="asCrear">Crear registros<\/button>');
    pintarAsig();
    alEnviar = crearAsignacion;
  }
  function plazosIniciales() {
    const ps = plazosDe(AS.ob, AS.anio), h = hoy();
    if (!ps.length) return [{ periodo: AS.anio === new Date().getFullYear() ? h.slice(0, 7) : String(AS.anio), nlt: AS.ob.plazo ? sumarDias(h, AS.ob.plazo) : '', on: true, manual: true }];
    const sig = ps.findIndex(p => p.nlt >= h);
    return ps.map((p, i) => Object.assign(p, { on: i === (sig >= 0 ? sig : ps.length - 1) })).concat([{ periodo: '', nlt: '', on: false, manual: true }]);
  }
  function seleccionAsig() {
    const ps = AS.plazos.filter(p => p.on && p.periodo && p.nlt), ex = existentes();
    let nuevos = 0, dup = 0;
    AS.unis.forEach(uid => ps.forEach(p => { if (ex.has(claveDup(uid, AS.ob.id, p.periodo))) dup++; else nuevos++; }));
    return { ps: ps, nuevos: nuevos, dup: dup, ex: ex };
  }
  function pintarAsig() {
    $('#asRegla').innerHTML = '<span class="chip">' + esc(AS.ob.periodicidad) + '<\/span> NLT: ' + esc(reglaTxt(AS.ob)) + (AS.ob.categoria ? ' · ' + esc(AS.ob.categoria) : '');
    $('#asPlazos').innerHTML = AS.plazos.map((p, i) => '<div class="plazo"><input type="checkbox" data-pl="' + i + '"' + (p.on ? ' checked' : '') + '>' +
      (p.manual ? '<input data-plper="' + i + '" value="' + esc(p.periodo) + '" placeholder="Periodo (p. ej. 2026-11, 2026-S2, 2026)">' : '<span><b>' + esc(p.periodo) + '<\/b><\/span>') +
      '<input type="date" data-plnlt="' + i + '" value="' + esc(p.nlt) + '"><\/div>').join('');
    const q = norm(AS.q);
    const us = U().filter(u => u.activa).sort((a, b) => porNombre(a.siglas || a.nombre, b.siglas || b.nombre));
    const hab = new Set(unidadesHabituales(AS.ob).map(u => u.id));
    $('#asUnis').innerHTML = us.map(u => '<label' + (q && norm(u.siglas + ' ' + u.nombre + ' ' + u.ambito).indexOf(q) < 0 ? ' hidden' : '') + '><input type="checkbox" data-asu="' + u.id + '"' + (AS.unis.has(u.id) ? ' checked' : '') + '> <span><b>' + esc(u.siglas || '') + '<\/b> ' + esc(u.siglas ? '– ' + u.nombre : u.nombre) + (hab.has(u.id) ? ' <span class="chip">obligada<\/span>' : '') + '<\/span><\/label>').join('');
    resumenAsig();
  }
  function resumenAsig() {
    const r = seleccionAsig();
    $('#asResumen').innerHTML = '<b>' + AS.unis.size + '<\/b> unidades × <b>' + r.ps.length + '<\/b> periodos → se crearán <b>' + r.nuevos + '<\/b> registros' + (r.dup ? ' (' + r.dup + ' ya existen y se omiten)' : '') + '.' +
      (r.nuevos > 60 ? '<br><b>Atención:<\/b> son muchos registros. Comprueba que realmente todas esas unidades tienen esta obligación.' : '');
    const b = $('#asCrear'); if (b) { b.textContent = 'Crear ' + r.nuevos + ' registros'; b.disabled = !r.nuevos; }
  }
  async function crearAsignacion() {
    const r = seleccionAsig();
    if (!r.nuevos) return msg('<div class="error">No hay registros nuevos que crear: marca al menos una unidad y un periodo con NLT.<\/div>');
    const malos = AS.plazos.filter(p => p.on && (!p.periodo || !p.nlt));
    if (malos.length) return msg('<div class="error">Hay periodos marcados sin nombre o sin NLT.<\/div>');
    if (r.nuevos > 60 && !confirm('Se van a crear ' + r.nuevos + ' registros en CONTROL_ENTREGAS. ¿Continuar?')) return;
    const ob = AS.ob, lote = [];
    U().filter(u => AS.unis.has(u.id)).forEach(u => r.ps.forEach(p => { if (!r.ex.has(claveDup(u.id, ob.id, p.periodo))) lote.push({ u: u, p: p }); }));
    const recordar = vf('recordar');
    msg(''); ocupado(true, 'Creando…');
    const ok = [], err = [];
    for (let i = 0; i < lote.length; i++) {
      const x = lote[i];
      $('#asProg').textContent = 'Creando y verificando ' + (i + 1) + ' de ' + lote.length + '…';
      try {
        await guardar('CONTROL_ENTREGAS', null, datosEntrega(x.u, ob, x.p), 'Asignar obligación');
        ok.push(x);
      } catch (e) {
        err.push({ x: x, e: e });
        if (e.tipo === 'config' || e.status === 403 || e.status === 401) break;   // el resto fallaría igual
      }
    }
    let habMsg = '';
    if (recordar) {
      try { await guardar('NLT_MAESTRO', ob, { habituales: Array.from(AS.unis).join(';') }, 'Guardar unidades habituales'); habMsg = '<div class="bien">Unidades obligadas guardadas en la obligación.<\/div>'; }
      catch (e) { habMsg = htmlError(e, 'No se han guardado las unidades obligadas'); }
    }
    $('#asProg').textContent = '';
    ocupado(false);
    render();
    msg((ok.length ? '<div class="bien">✔ ' + ok.length + ' registros creados y verificados en SharePoint.<\/div>' : '') +
      (err.length ? htmlError(err[0].e, err.length + ' registro(s) no creados (' + err.map(z => (z.x.u.siglas || z.x.u.nombre) + ' ' + z.x.p.periodo).slice(0, 8).join(', ') + ')') : '') +
      (lote.length - ok.length - err.length > 0 ? '<div class="aviso">Se detuvo el proceso: ' + (lote.length - ok.length - err.length) + ' registros no se intentaron.<\/div>' : '') + habMsg);
    pintarAsig();
  }

  // ---------- Generar los plazos de un periodo (solo para las unidades obligadas de cada obligación) ----------
  function dlgGenerar() {
    if (!exigirLista('CONTROL_ENTREGAS')) return;
    const y = new Date().getFullYear(), m = new Date().getMonth() + 1, fuera = new Set();

  function validarEntrega(d) {
    if (!d.periodo || !d.nlt) return 'El periodo y la NLT son obligatorios.';
    if (RECIBIDOS.indexOf(d.estado) >= 0 && !d.recepcion) return 'Indica la fecha de recepción.';
    if (d.estado === 'Pendiente' && d.recepcion) return 'Hay fecha de recepción pero el estado es «Pendiente». Cambia el estado o borra la fecha.';
    if (d.recepcion && d.recepcion > hoy()) return 'La fecha de recepción no puede ser futura.';
    if (d.estado === 'Validado' && !d.validacion) return 'Indica la fecha de validación.';
    if (d.validacion && d.recepcion && d.validacion < d.recepcion) return 'La validación no puede ser anterior a la recepción.';
    return '';

    'RESIDENCIA LOGÍSTICA MILITAR DE MELILLA', 'RESIDENCIA LOGÍSTICA MILITAR GENERAL GALERA', 'RESIDENCIA LOGÍSTICA MILITAR VIRGEN DE ÁFRICA'].map(n => ({ nombre: n, activa: true }));
  function dlgSemilla(n) {
    if (!exigirLista(n)) return;
    const esO = n === 'NLT_MAESTRO', sem = esO ? SEMILLA_OBLIG : SEMILLA_UCO, actuales = esO ? O() : U();
    const existe = s => actuales.find(x => norm(x.nombre) === norm(s.nombre) || (esO && s.codigo && norm(x.codigo) === norm(s.codigo)) || (!esO && norm(x.siglas) === norm(s.nombre)));
    const filas = sem.map((s, i) => { const ex = existe(s); return '<label style="display:flex;gap:6px;padding:3px 0;border-bottom:1px solid var(--line)"><input type="checkbox" data-sem="' + i + '"' + (ex ? ' disabled' : ' checked') + '> <span>' +
      (esO ? '<b>' + esc(s.codigo) + '<\/b> ' : '') + esc(s.nombre) + (esO ? ' <span class="small muted">· ' + esc(s.periodicidad) + ' · ' + esc(reglaTxt(s)) + '<\/span>' : '') + (ex ? ' <span class="badge none">ya existe (ID ' + ex.id + ')<\/span>' : '') + '<\/span><\/label>'; });
    const nuevos = sem.filter(s => !existe(s)).length;
    abrirDlg(esO ? 'Catálogo NLT inicial' : 'Unidades SUIGESUR',
      '<p class="small">' + nuevos + ' de ' + sem.length + ' no existen en ' + n + '. Desmarca lo que no quieras crear. Cada elemento se crea y se verifica por separado; si uno falla, el proceso se detiene.<\/p>' +
      (!esO ? '<div class="aviso small">Esta relación procede de la versión anterior y <b>no lleva siglas<\/b> (no se inventan). Revísala antes: unidades y establecimientos pueden estar repetidos con nombres distintos.<\/div>' : '') +
      '<div style="max-height:50vh;overflow:auto">' + filas.join('') + '<\/div><div id="semProg" class="small"><\/div>',
      '<button type="button" data-cerrar>Cancelar<\/button><button type="submit" class="prim">Crear las marcadas<\/button>');
    alEnviar = async () => {
      const elegidos = $$('[data-sem]:checked', dlg).map(c => sem[Number(c.dataset.sem)]);
      if (!elegidos.length) return msg('<div class="error">No hay nada marcado.<\/div>');
      if (!confirm('Se crearán ' + elegidos.length + ' elementos en ' + n + '. ¿Continuar?')) return;
      ocupado(true, 'Creando…'); let ok = 0, er = null;
      for (const s of elegidos) {
        $('#semProg').textContent = 'Creando y verificando ' + (ok + 1) + ' de ' + elegidos.length + ': ' + s.nombre;
        const d = Object.assign({}, s);
        Object.keys(d).forEach(k => { if (!(L[n].map[k] || []).length && vacio(d[k])) delete d[k]; if (k === 'activa' && !(L[n].map.activa || []).length) delete d[k]; });
        try { await guardar(n, null, d, esO ? 'Alta de obligación (catálogo inicial)' : 'Alta de unidad (catálogo inicial)'); ok++; } catch (e) { er = e; break; }
      }
      $('#semProg').textContent = ''; ocupado(false); render();
      msg('<div class="bien">' + ok + ' creados y verificados.<\/div>' + (er ? htmlError(er, 'Detenido') : ''));
      $$('[data-sem]', dlg).forEach(c => { const s = sem[Number(c.dataset.sem)]; if (existe(s)) { c.checked = false; c.disabled = true; } });
    };
  }
  // ================= Pintado general =================
  function pintarEstado() {
    const el = $('#estado');
    let txt, cls;
    if (preparando) { txt = 'Preparando las listas de SharePoint…'; cls = 'warn'; }
    else if (cargando) { txt = 'Leyendo SharePoint…'; cls = ''; }
    else if (errorGeneral) { txt = errorGeneral.tipo === 'permiso' ? 'Sin permisos' : errorGeneral.tipo === 'config' ? 'Error de configuración' : 'Error de conexión'; cls = 'bad'; }
    else {
      const mal = LISTAS.filter(n => L[n].estado !== 'ok');
      const sinCols = LISTAS.filter(n => L[n].estado === 'ok' && DEF[n].campos.some(c => c.req && !(L[n].map[c.k] || []).length));
      if (mal.some(n => L[n].estado === 'sin permiso')) { txt = 'Sin permiso en ' + mal.filter(n => L[n].estado === 'sin permiso').join(', '); cls = 'bad'; }
      else if (mal.some(n => L[n].estado === 'error de lectura')) { txt = 'Error de lectura'; cls = 'bad'; }
      else if (mal.length || sinCols.length) { txt = 'Conectado · revisar estructura'; cls = 'warn'; }
      else { txt = 'Conectado · lectura correcta · ' + (cargadoEn ? cargadoEn.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }) : ''); cls = 'ok'; }
    }
    el.textContent = txt; el.className = 'estado ' + cls;
    el.title = web ? web.url : '';
  }
  let avisoT = null;
  function aviso(t) {
    const el = $('#escritura'); if (!el) return;
    el.hidden = false; el.textContent = t; el.className = 'estado ok';
    clearTimeout(avisoT); avisoT = setTimeout(() => { if (ultimaEscritura) marcarEscritura(ultimaEscritura.ok, ultimaEscritura.txt); else el.hidden = true; }, 4000);
  }
  function render() {
    $$('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.v === pref.vista));
    const v = VISTAS[pref.vista] || VISTAS.inicio;
    const sc = pref.vista !== 'ajustes' ? sinConexion() : '';
    if (sc) { $('#vista').innerHTML = sc; return; }
    if (!cargadoEn && pref.vista !== 'ajustes') { $('#vista').innerHTML = '<p class="muted">Conectando con SharePoint…<\/p>'; return; }
    $('#vista').innerHTML = v.barra() + '<div id="res">' + v.res() + '<\/div>';
  }
  function renderRes() {
    const v = VISTAS[pref.vista]; const r = $('#res');
    if (v && r) r.innerHTML = v.res(); else render();
  }
  function irA(dest) {
    const p = dest.split(':'), vista = p[0], val = p.slice(1).join(':');
    if (vista === 'uni' || vista === 'obl') { F[vista] = val; pref.vista = 'entregas'; F.sit = 'incumplida'; }
    else {
      pref.vista = vista;
      if (vista === 'entregas' && p.length > 1) F.sit = val;
      if (vista === 'analisis' && val) pref.sub = val;
      if (vista === 'eventos' && p.length > 1) F.esit = 'abiertos';
    }
    guardarF(); render(); window.scrollTo(0, 0);
  }

  // ================= Eventos de la interfaz =================
  document.addEventListener('click', ev => {
    const el = ev.target;
    const tab = el.closest('#tabs a'); if (tab) { pref.vista = tab.dataset.v; guardarPref(); limiteFilas = 300; render(); return; }
    if (el.closest('#recargar')) { cargar(); return; }
    if (el.closest('[data-cerrar]')) { ev.preventDefault(); dlg.close(); return; }
    const ir = el.closest('[data-ir]'); if (ir) { ev.preventDefault(); if (dlg.open) dlg.close(); irA(ir.dataset.ir); return; }
    const sub = el.closest('[data-sub]'); if (sub) { pref.sub = sub.dataset.sub; guardarPref(); render(); return; }
    const ip = el.closest('[data-infper]'); if (ip) { const r = periodoRapido(ip.dataset.infper); $('#infOpts [name=desde]').value = r[0]; $('#infOpts [name=hasta]').value = r[1]; leerInf(); renderRes(); return; }
    const inf = el.closest('[data-inf]'); if (inf) { accionInforme(inf.dataset.inf); return; }
    const as = el.closest('[data-as]');
    if (as && AS) {
      const vis = $$('#asUnis label:not([hidden]) [data-asu]').map(c => Number(c.dataset.asu));
      if (as.dataset.as === 'hab') AS.unis = new Set(unidadesHabituales(AS.ob).filter(u => u.activa).map(u => u.id));
      if (as.dataset.as === 'todas') vis.forEach(id => AS.unis.add(id));
      if (as.dataset.as === 'ninguna') AS.unis.clear();
      pintarAsig(); return;
    }
    if (el.matches('[data-sel]')) { const id = Number(el.dataset.sel); if (el.checked) SEL.add(id); else SEL.delete(id); renderRes(); return; }
    if (el.matches('[data-acc=selTodas]')) { entregasFiltradas().slice(0, limiteFilas).forEach(e => { if (el.checked) SEL.add(e.id); else SEL.delete(e.id); }); renderRes(); return; }
    const acc = el.closest('[data-acc]');
    if (acc) {
      ev.preventDefault();
      const id = Number(acc.dataset.id), a = acc.dataset.acc;
      const e = E().find(x => x.id === id);
      switch (a) {
        case 'asignar': return dlgAsignar(id || null);
        case 'generar': return dlgGenerar();
        case 'nuevoEvento': return dlgEvento(null, id || null);
        case 'nuevaUnidad': return dlgUnidad(null);
        case 'nuevaOblig': return dlgObligacion(null);
        case 'recibir': case 'validar':
          acc.disabled = true; acc.textContent = 'Guardando…';
          accionRapida(e, a).then(r => { renderRes(); aviso((a === 'recibir' ? 'Recepción registrada' : 'Validada') + ' y verificada (ID ' + r.id + ')'); })
            .catch(er => { renderRes(); abrirDlg('No se ha guardado', htmlError(er), '<button type="button" data-cerrar>Cerrar<\/button>'); });
          return;
        case 'cerrarEvento': {
          const v = EV().find(x => x.id === id);
          if (!confirm('¿Finalizar hoy el evento «' + v.titulo + '»?')) return;
          acc.disabled = true;
          guardar('SEGUIMIENTO_EVENTOS', v, { estado: 'Finalizado', cierre: hoy() }, 'Finalizar evento').then(() => { renderRes(); aviso('Evento finalizado y verificado'); })
            .catch(er => { renderRes(); abrirDlg('No se ha guardado', htmlError(er), '<button type="button" data-cerrar>Cerrar<\/button>'); });
          return;
        }
        case 'papelera':
          if (!confirm('¿Enviar a la papelera de reciclaje de SharePoint el registro ID ' + e.id + ' (' + e.uEtq + ' · ' + e.oNom + ' · ' + e.periodo + ')?\n\nSe puede restaurar desde la Papelera de reciclaje del sitio.')) return;
          return ejecutar(async () => { await reciclar('CONTROL_ENTREGAS', e, 'Enviar entrega a la papelera'); dlg.close(); render(); aviso('Registro enviado a la papelera (verificado)'); });
        case 'loteRecibir': return lote('recibir');
        case 'loteValidar': return lote('validar');
        case 'loteNA': return lote('na');
        case 'loteQuitar': SEL.clear(); return renderRes();
        case 'masFilas': limiteFilas += 300; return renderRes();
        case 'csvEntregas': return descargar('CONTROL_ENTREGAS_' + hoy() + '.csv', csvFilas(CAB_CSV_E, entregasFiltradas().map(filaCsvE)), 'text/csv;charset=utf-8');
        case 'csvEventos': return descargar('SEGUIMIENTO_EVENTOS_' + hoy() + '.csv', csvFilas(['ID', 'Tipo', 'Evento', 'Unidad', 'Obligación', 'Activación', 'Límite', 'Estado', 'Vencido', 'Cierre', 'Responsable', 'Observaciones'],
          EV().map(v => [v.id, v.tipo, v.titulo, v.uEtq, v.ob ? v.ob.nombre : '', fCorta(v.activacion), fCorta(v.limite), v.estadoN, v.vencido ? 'Sí' : '', fCorta(v.cierre), v.responsable, v.obs])), 'text/csv;charset=utf-8');
        case 'csvAnalisis': { const r = ultimoAnalisis || analisis(); return descargar('Analisis_' + pref.sub + '_' + hoy() + '.csv', csvFilas(r.cabs, r.filas), 'text/csv;charset=utf-8'); }
        case 'reconectar': pref.sitio = $('#aSitio').value.trim().replace(/\/+$/, ''); guardarPref(); web = null; yo = null; digest = null; return cargar();
        case 'preparar':
          acc.disabled = true; acc.textContent = 'Preparando…';
          return prepararEstructura().then(() => { preparacionVista = true; render(); }).catch(er => { render(); abrirDlg('No se han podido preparar las listas', htmlError(er), '<button type="button" data-cerrar>Cerrar<\/button>'); });
        case 'semillaOblig': return dlgSemilla('NLT_MAESTRO');
        case 'semillaUco': return dlgSemilla('UCO_SUIGESUR');
        case 'copiarDiag': {
          const t = ['CENTRO DE CONTROL NLT SUIGESUR · diagnóstico ' + new Date().toLocaleString('es-ES'), 'Sitio: ' + (web ? web.url : '—'), 'Formato: ' + (verbose ? 'verbose' : 'nometadata'), errorGeneral ? 'Error general: ' + errorGeneral.message : '']
            .concat(LISTAS.map(n => n + ': ' + L[n].estado + ' · ' + L[n].items.length + ' elementos · permisos ' + JSON.stringify(L[n].perm) + ' · columnas: ' + DEF[n].campos.map(c => c.k + '=' + ((L[n].map[c.k] || []).join('+') || 'FALTA')).join(', ')))
            .concat(['', 'Operaciones:']).concat(REG.slice(0, 80).map(r => r.hora.toLocaleTimeString('es-ES') + ' | ' + r.op + ' | ' + r.lista + ' | ' + r.metodo + ' ' + r.url + ' | HTTP ' + r.status + ' | ' + (r.ok ? 'OK' : 'ERROR') + ' | ' + r.msg)).join('\n');
          (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => aviso('Diagnóstico copiado')).catch(() => descargar('diagnostico-nlt-suigesur.txt', t, 'text/plain;charset=utf-8'));
          return;
        }
        case 'exportarJSON': {
          const limpio = arr => arr.map(o => { const c = {}; Object.keys(o).forEach(k => { if (['u', 'ob', 's'].indexOf(k) < 0) c[k] = o[k]; }); return c; });
          return descargar('NLT_SUIGESUR_copia_' + hoy() + '.json', JSON.stringify({ exportado: new Date().toISOString(), sitio: web && web.url, NLT_MAESTRO: limpio(O()), UCO_SUIGESUR: limpio(U()), CONTROL_ENTREGAS: limpio(E()), SEGUIMIENTO_EVENTOS: limpio(EV()) }, null, 1), 'application/json');
        }
      }
      return;
    }
    if (el.closest('a[href="#"]')) ev.preventDefault();
    if (el.closest('input, button, select, a, label')) return;
    const fe = el.closest('[data-entrega]'); if (fe) { const e = E().find(x => x.id === Number(fe.dataset.entrega)); if (e) dlgEntrega(e); return; }
    const fo = el.closest('[data-oblig]'); if (fo) { const o = oPorId.get(Number(fo.dataset.oblig)); if (o) dlgObligacion(o); return; }
    const fu = el.closest('[data-unidad]'); if (fu) { const u = uPorId.get(Number(fu.dataset.unidad)); if (u) dlgUnidad(u); return; }
    const fv = el.closest('[data-evento]'); if (fv) { const v = EV().find(x => x.id === Number(fv.dataset.evento)); if (v) dlgEvento(v); return; }
  });
  document.addEventListener('change', ev => {
    const el = ev.target;
    if (el.dataset.f !== undefined && el.type !== 'search') {
      F[el.dataset.f] = el.value; if (el.dataset.f === 'anio' && !el.value) F.per = '';
      guardarF(); limiteFilas = 300;
      if (el.dataset.f === 'anio' || pref.vista === 'analisis') render(); else renderRes();
      return;
    }
    if (el.closest('#infOpts')) { leerInf(); renderRes(); return; }
    if (el.dataset.mapa) {
      const p = el.dataset.mapa.split('|');
      pref.mapa[p[0]] = pref.mapa[p[0]] || {};
      if (el.value) pref.mapa[p[0]][p[1]] = el.value; else delete pref.mapa[p[0]][p[1]];
      guardarPref(); resolver(p[0]);
      recargarLista(p[0]).then(render);
      return;
    }
    if (AS && dlg.open) {
      if (el.name === 'ob') { AS.ob = oPorId.get(Number(el.value)); AS.unis = new Set(unidadesHabituales(AS.ob).filter(u => u.activa).map(u => u.id)); AS.plazos = plazosIniciales(); pintarAsig(); return; }
      if (el.name === 'anio') { AS.anio = Number(el.value) || new Date().getFullYear(); AS.plazos = plazosIniciales(); pintarAsig(); return; }
      if (el.dataset.pl !== undefined) { AS.plazos[Number(el.dataset.pl)].on = el.checked; resumenAsig(); return; }
      if (el.dataset.plnlt !== undefined) { AS.plazos[Number(el.dataset.plnlt)].nlt = el.value; resumenAsig(); return; }
      if (el.dataset.asu !== undefined) { const id = Number(el.dataset.asu); if (el.checked) AS.unis.add(id); else AS.unis.delete(id); resumenAsig(); return; }
    }
  });
  document.addEventListener('input', ev => {
    const el = ev.target;
    if (el.dataset.f !== undefined && el.type === 'search') {
      F[el.dataset.f] = el.value; guardarF(); limiteFilas = 300;
      renderRes();
      return;
    }
    if (AS && dlg.open) {
      if (el.name === 'asq') { AS.q = el.value; const q = norm(el.value); $$('#asUnis label').forEach(l => { l.hidden = !!q && norm(l.textContent).indexOf(q) < 0; }); return; }
      if (el.dataset.plper !== undefined) { const p = AS.plazos[Number(el.dataset.plper)]; p.periodo = el.value.trim(); if (p.periodo && p.nlt) p.on = true; resumenAsig(); const c = $('[data-pl="' + el.dataset.plper + '"]'); if (c) c.checked = p.on; return; }
    }
  });
  dlg.addEventListener('submit', ev => { ev.preventDefault(); if (alEnviar) alEnviar(); });
  dlg.addEventListener('close', () => { AS = null; alEnviar = null; dlg.oninput = null; dlg.onchange = null; });

  render();
  cargar();
})();
</script>
</body>
</html>
