<style>

  @media (max-width: 560px) { nav.tabs { overflow-x: auto; } nav.tabs a { flex: 1 0 auto; font-size: .8rem; padding: 8px 6px; } }
  main { max-width: 1000px; margin: 0 auto; padding: 0 16px 60px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }

  @media (max-width: 700px) { .flujo .fl { display: none; } .flujo .fp { flex-basis: 40%; } }
  .fp.c-pendiente { background: linear-gradient(135deg, #7d8793, #5f6975); } .fp.c-curso { background: linear-gradient(135deg, #2f6fc0, #1d4f91); }
  .fp.c-espera { background: linear-gradient(135deg, #8a5cc2, #6a3d9a); } .fp.c-hecha { background: linear-gradient(135deg, #43a047, #2e7d32); }

  .barras .n { font-variant-numeric: tabular-nums; white-space: nowrap; font-size: .8rem; color: var(--muted); } .barras .n b { color: var(--text); }

  .columnas { display: flex; gap: 6px; align-items: flex-end; height: 170px; padding: 0 2px; border-bottom: 1px solid var(--line); }

  <noscript><div class="error">Esta página necesita JavaScript.</div></noscript>
  <nav class="tabs" id="tabs">
    <a data-v="nlt" class="on">Tareas</a><a data-v="calendario">Calendario</a><a data-v="estadisticas">Estadísticas</a><a data-v="avisos">Avisos</a><a data-v="informes">Informes</a><a data-v="ajustes">Ajustes</a>
  </nav>
  <div id="vista"><p class="muted">Leyendo la lista «Gestor de Tareas»…</p></div>
</main>
<footer class="autor">© 2026 · Aplicación desarrollada por el <b>Cte. Alfredo Sánchez Sender</b> · Todos los derechos reservados · <span id="verPie"></span></footer>
<dialog id="dlg"></dialog>
<script>
(function () {
  'use strict';
  if (document.documentMode || !window.fetch || !window.Promise || !Element.prototype.closest) {
    document.getElementById('vista').innerHTML = '<div class="error">Tu navegador abre esta página en modo Internet Explorer o es muy antiguo. Ábrela en Microsoft Edge o Chrome.</div>';
    return;
  }
  var $ = function (s, el) { return (el || document).querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var iso = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  var hoy = function () { return iso(new Date()); };
  var aFecha = function (s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
  var diasHasta = function (s) { return Math.round((aFecha(s) - aFecha(hoy())) / 864e5); };
  var sinTildes = function (s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); };
  var fCorta = function (s) { return s ? aFecha(s).toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' }) : ''; };
  var fLarga = function (s) { return aFecha(s).toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' }); };
  var fMedia = function (s) { return s ? aFecha(s).toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' }) : ''; };
  var VERSION = '2026-10-22 · 3';
  $('#verPie').textContent = 'versión ' + VERSION;

  // ---------- Preferencias de este navegador ----------
  var CLAVE = 'tareas-nlt-colabora';
  var pref = { lista: 'Gestor de Tareas', vista: 'nlt', quien: 'mias', q: '', negociado: '', estado: '', prio: '', resp: '', mapaEstados: {}, avisoDias: 3, informe: null,
    modo: 'tarjetas', grupos: { vencidas: true, hoy: true } };
  try { Object.assign(pref, JSON.parse(localStorage.getItem(CLAVE)) || {}); } catch (e) { /* sin memoria local */ }
  var guardarPref = function () { try { localStorage.setItem(CLAVE, JSON.stringify(pref)); } catch (e) { /* sin memoria local */ } };

  // ---------- SharePoint (REST, solo lectura) ----------
  var web = null, yo = null, listaInfo = null, campos = {}, infoCampo = {}, tareas = [], cargadoEn = null;

  function api(url) {
    var pedir = function (accept) {
      return fetch(url, { credentials: 'same-origin', headers: { Accept: accept } }).then(function (r) {
        if (!r.ok) { var e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
        return r.json();
      });
    };
    return pedir('application/json;odata=nometadata').catch(function (e) {
      if ([400, 406, 415].indexOf(e.status) < 0) throw e;
      return pedir('application/json;odata=verbose').then(function (d) {
        d = d.d || d;
        if (d.results) return { value: d.results, 'odata.nextLink': d.__next };
        return d;
      });
    });
  }
  var lista = function (v) { return v == null ? [] : Array.isArray(v) ? v : Array.isArray(v.results) ? v.results : []; };

  function webDe(ruta) {
    var partes = ruta.split('/').filter(Boolean), cands = [];
    for (var i = partes.length; i >= 0; i--) cands.push(location.origin + (i ? '/' + partes.slice(0, i).join('/') : ''));
    var probar = function (n) {
      if (n >= cands.length) return Promise.reject(new Error('No encuentro el sitio de SharePoint'));
      return api(cands[n] + '/_api/web?$select=Url,Title').then(function (w) { return { url: w.Url || cands[n], titulo: w.Title }; })
        .catch(function () { return probar(n + 1); });
    };
    return probar(0);
  }

  var CAMPOS_SEL = ['Id', 'Title', 'ESTADO', 'Prioridad', 'FechaDeInicio', 'FechaVencimiento', 'fECHAFINALIZACION', 'NegociadoAsignado',
    'NegociadosImplicados', 'Descripcion', 'DescripcionDelAsunto', 'Comentarios', 'ControlExpediente', 'REGISTRODEACTIVIDAD',
    'NombreResponsable', 'NombreImplicados', 'Created', 'Modified', 'ResponsableDeLaInformacion/Id', 'ResponsableDeLaInformacion/Title',
    'PersonalImplicado0/Id', 'PersonalImplicado0/Title', 'Author/Title', 'Editor/Title',
    'correoResponsable', 'correoimplicados', 'ResponsableDeLaInformacion/EMail', 'PersonalImplicado0/EMail'];
  var EXPANDIR = 'ResponsableDeLaInformacion,PersonalImplicado0,Author,Editor';

  var urlLista = function () { return web.url + "/_api/web/lists/getbytitle('" + encodeURIComponent(pref.lista.replace(/'/g, "''")) + "')"; };

  // Texto sin formato de un campo enriquecido (DOMParser no ejecuta nada)
  var texto = function (html) {
    if (!html) return '';
    if (!/[<&]/.test(html)) return String(html).trim();
    var d = new DOMParser().parseFromString(String(html).replace(/<br\s*\/?>/gi, '\n').replace(/<\/(p|div|li)>/gi, '\n'), 'text/html');
    return (d.body.textContent || '').replace(/​/g, '').replace(/\n{3,}/g, '\n\n').trim();
  };
  var fechaSP = function (v) { return v ? iso(new Date(v)) : ''; };

  // Estado real → clase de la app. Automática por palabras; se puede corregir en Ajustes.
  function claseEstado(valor) {
    if (pref.mapaEstados[valor]) return pref.mapaEstados[valor];
    var n = sinTildes(valor);
    if (/(finaliz|terminad|cerrad|complet|resuelt|archivad|hecho|realizad|cumplimentad|anulad|cancelad|conclu)/.test(n)) return 'hecha';
    if (/(espera|pausa|parad|bloque|suspend|pendiente de )/.test(n)) return 'espera';
    if (/(curso|tramit|proceso|ejecuci|iniciad|abiert|trabaj)/.test(n)) return 'curso';
    return 'pendiente';
  }
  // Direcciones de correo de un texto («a@x.es; b@x.es»)
  var correos = function (txt) { return String(txt || '').split(/[;,\s]+/).map(function (x) { return x.trim(); }).filter(function (x) { return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x); }); };
  var unico = function (x, i, a) { return x && a.map(function (y) { return String(y).toLowerCase(); }).indexOf(String(x).toLowerCase()) === i; };
  var CLASES = { pendiente: 'Pendiente', curso: 'En curso', espera: 'En espera', hecha: 'Terminada' };
  function clasePrio(valor) {
    var n = sinTildes(valor);
    if (/(muy alta|critic|inmediat|urgent|flash)/.test(n)) return 'critica';
    if (/alta/.test(n)) return 'alta';
    if (/baja/.test(n)) return 'baja';
    return 'media';
  }
  var ORDEN_PRIO = { critica: 0, alta: 1, media: 2, baja: 3 };

  function aTarea(it) {
    var resp = it.ResponsableDeLaInformacion || null;
    var implicados = lista(it.PersonalImplicado0).map(function (u) { return u.Title; });
    var t = {
      id: it.Id, asunto: it.Title || '(sin asunto)', estado: it.ESTADO || '', prioridad: it.Prioridad || '',
      inicio: fechaSP(it.FechaDeInicio), nlt: fechaSP(it.FechaVencimiento), fin: fechaSP(it.fECHAFINALIZACION),
      negociado: it.NegociadoAsignado || '', negociados: lista(it.NegociadosImplicados).length ? lista(it.NegociadosImplicados) : (Array.isArray(it.NegociadosImplicados) ? it.NegociadosImplicados : []),
      descripcion: texto(it.DescripcionDelAsunto) || texto(it.Descripcion), resumenDesc: texto(it.Descripcion),
      observaciones: texto(it.Comentarios), expediente: texto(it.ControlExpediente), registro: texto(it.REGISTRODEACTIVIDAD),
      respId: resp && resp.Id, responsable: (resp && resp.Title) || it.NombreResponsable || '',
      implicadosIds: lista(it.PersonalImplicado0).map(function (u) { return u.Id; }),
      correoResp: correos(it.correoResponsable).concat(resp && resp.EMail ? [resp.EMail] : []).filter(unico),
      correosImpl: correos(it.correoimplicados).concat(lista(it.PersonalImplicado0).map(function (u) { return u.EMail; })).filter(unico),
      usuarios: (resp && resp.Id ? [resp] : []).concat(lista(it.PersonalImplicado0)).map(function (u) { return { Id: u.Id, Title: u.Title, Email: u.EMail || '' }; }),
      implicados: implicados.length ? implicados : String(it.NombreImplicados || '').split(/[;,]/).map(function (s) { return s.trim(); }).filter(Boolean),
      creada: it.Created, modificada: it.Modified, autor: it.Author && it.Author.Title, editor: it.Editor && it.Editor.Title,
    };
    t.clase = claseEstado(t.estado);
    if (t.fin && t.clase !== 'hecha') t.clase = 'hecha';
    t.prio = clasePrio(t.prioridad);
    return t;
  }

  function cargar() {
    $('#estadoCarga').textContent = 'Cargando…';
    var p = web ? Promise.resolve(web) : webDe(location.pathname.replace(/\/[^/]*$/, '')).then(function (w) { web = w; return w; });
    return p.then(function () {
      return Promise.all([
        yo ? yo : api(web.url + '/_api/web/currentuser?$select=Id,Title,Email,LoginName').then(function (u) { yo = u; return u; }),
        api(urlLista() + '?$select=Id,Title,ItemCount,ListItemEntityTypeFullName,RootFolder/ServerRelativeUrl&$expand=RootFolder').then(function (l) { listaInfo = l; }),
        api(urlLista() + "/fields?$select=InternalName,Title,Choices,RichText,Required,TypeAsString&$filter=(InternalName eq 'ESTADO') or (InternalName eq 'PersonalImplicado0') or (InternalName eq 'Prioridad') or (InternalName eq 'NegociadoAsignado')" +
          " or (InternalName eq 'NegociadosImplicados') or (InternalName eq 'DescripcionDelAsunto') or (InternalName eq 'Comentarios') or (InternalName eq 'ControlExpediente') or (InternalName eq 'FechaVencimiento')")
          .then(function (d) { lista(d.value).forEach(function (f) {
            campos[f.InternalName] = lista(f.Choices).length ? lista(f.Choices) : (f.Choices || []);
            infoCampo[f.InternalName] = Object.assign(infoCampo[f.InternalName] || {}, { rico: !!f.RichText, obligatorio: !!f.Required, tipo: f.TypeAsString || '' });
          }); })
          .catch(function () { /* las opciones se deducen de los datos */ }),
      ].concat(['Comentarios', 'REGISTRODEACTIVIDAD'].map(function (k) {
        return api(urlLista() + "/fields/getbyinternalnameortitle('" + k + "')").then(function (f) {
          infoCampo[k] = Object.assign(infoCampo[k] || {}, { anexar: !!f.AppendOnly, rico: !!f.RichText, existe: true });
        }).catch(function () { /* columna inexistente o sin permiso */ });
      })));
    }).then(function () {
      var todos = [];
      var pagina = function (url) {
        return api(url).then(function (d) {
          todos = todos.concat(lista(d.value));
          $('#estadoCarga').textContent = 'Cargando… ' + todos.length;
          var sig = d['odata.nextLink'] || d['@odata.nextLink'];
          return sig ? pagina(sig) : todos;
        });
      };
      return pagina(urlLista() + '/items?$top=500&$select=' + CAMPOS_SEL.join(',') + '&$expand=' + EXPANDIR);
    }).then(function (items) {
      tareas = items.map(aTarea);
      cargadoEn = new Date();
      $('#estadoCarga').textContent = tareas.length + ' asuntos · ' + cargadoEn.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
      $('#estadoCarga').title = 'Versión de la página: ' + VERSION;
      render();
    }).catch(function (e) {
      $('#estadoCarga').textContent = 'Error';
      $('#vista').innerHTML = '<div class="error">No se pudo leer la lista «' + esc(pref.lista) + '»: ' + esc(e.message || e) +
        '.<br><small>Versión de la página: ' + esc(VERSION) + '</small></div><p class="muted">Comprueba en Ajustes el nombre de la lista y que tienes permiso para verla.</p>';
      if (pref.vista === 'ajustes') render();
    });
  }

  // ---------- Reglas de NLT ----------
  function urgencia(t) {
    if (t.clase === 'hecha') {
      var aTiempo = !t.nlt || !t.fin || t.fin <= t.nlt;
      return { cls: 'none', grupo: 'hechas', txt: aTiempo ? 'Terminada' : 'Terminada fuera de NLT' };
    }
    if (!t.nlt) return { cls: 'none', grupo: 'sin', txt: 'Sin NLT' };
    var d = diasHasta(t.nlt);
    if (d < 0) return { cls: 'bad', grupo: 'vencidas', txt: 'Retraso de ' + (-d) + (d === -1 ? ' día' : ' días') };
    if (d === 0) return { cls: 'bad', grupo: 'hoy', txt: 'Vence hoy' };
    var txt = d === 1 ? 'Vence mañana' : 'Faltan ' + d + ' días';
    return { cls: d <= pref.avisoDias ? 'warn' : 'ok', grupo: d <= 7 ? 'semana' : 'despues', txt: txt };
  }
  var ordenar = function (a, b) {
    return (a.nlt || '9999').localeCompare(b.nlt || '9999') || ORDEN_PRIO[a.prio] - ORDEN_PRIO[b.prio] || a.asunto.localeCompare(b.asunto, 'es');
  };
  var esMia = function (t) { return yo && (t.respId === yo.Id || (!t.respId && sinTildes(t.responsable) === sinTildes(yo.Title))); };
  var meImplica = function (t) { return yo && (esMia(t) || t.implicadosIds.indexOf(yo.Id) >= 0 || t.implicados.some(function (n) { return sinTildes(n) === sinTildes(yo.Title); })); };

  function filtrar(ts) {
    var q = sinTildes(pref.q.trim());
    return ts.filter(function (t) {
      if (pref.quien === 'mias' && !esMia(t)) return false;
      if (pref.quien === 'implicado' && !meImplica(t)) return false;
      if (pref.negociado && t.negociado !== pref.negociado && t.negociados.indexOf(pref.negociado) < 0) return false;
      if (pref.estado && t.estado !== pref.estado) return false;
      if (pref.prio && t.prioridad !== pref.prio) return false;
      if (pref.resp && (t.responsable || 'Sin responsable') !== pref.resp) return false;
      if (q && sinTildes([t.asunto, t.descripcion, t.expediente, t.responsable, t.implicados.join(' '), t.negociado, t.estado, t.observaciones].join(' ')).indexOf(q) < 0) return false;
      return true;
    });
  }
  var valores = function (campo, clave) {
    var s = new Set(campos[campo] || []);
    tareas.forEach(function (t) { var v = t[clave]; if (Array.isArray(v)) v.forEach(function (x) { if (x) s.add(x); }); else if (v) s.add(v); });
    return Array.from(s);
  };
  var opciones = function (lista, sel, vacio) {
    return '<option value="">' + esc(vacio) + '</option>' + lista.map(function (v) { return '<option' + (v === sel ? ' selected' : '') + '>' + esc(v) + '</option>'; }).join('');
  };

  var hayFiltros = function () { return !!(pref.q || pref.negociado || pref.estado || pref.prio || pref.resp); };
  function barraFiltros(pie) {
    var negs = valores('NegociadoAsignado', 'negociado');
    tareas.forEach(function (t) { t.negociados.forEach(function (n) { if (negs.indexOf(n) < 0) negs.push(n); }); });
    var resps = Array.from(new Set(tareas.map(function (t) { return t.responsable || 'Sin responsable'; }))).sort(function (a, b) { return a.localeCompare(b, 'es'); });
    return '<div class="card"><div class="filtros">' +
      '<div class="q"><label class="lbl">Buscar</label><input id="fq" type="search" value="' + esc(pref.q) + '" placeholder="Asunto, expediente, persona…"></div>' +
      '<div><label class="lbl">Qué asuntos</label><select id="fquien">' +
        [['mias', 'Soy responsable'], ['implicado', 'Responsable o implicado'], ['todos', 'Todos']].map(function (o) { return '<option value="' + o[0] + '"' + (pref.quien === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></div>' +
      '<div><label class="lbl">Negociado</label><select id="fneg">' + opciones(negs.sort(), pref.negociado, 'Todos') + '</select></div>' +
      '<div><label class="lbl">Responsable</label><select id="fresp">' + opciones(resps, pref.resp, 'Todos') + '</select></div>' +
      '<div><label class="lbl">Estado</label><select id="fest">' + opciones(valores('ESTADO', 'estado'), pref.estado, 'Todos') + '</select></div>' +
      '<div><label class="lbl">Prioridad</label><select id="fprio">' + opciones(valores('Prioridad', 'prioridad'), pref.prio, 'Todas') + '</select></div>' +
      '</div>' + (pie || hayFiltros() ? '<div class="fpie">' + (pie || '') + (hayFiltros() ? '<button data-limpiar="1">✕ Limpiar filtros</button>' : '') + '</div>' : '') + '</div>';
  }

  // Color de la situación: «vence hoy» en naranja para distinguirlo de lo ya vencido
  var colorU = function (t, u) { return t.clase === 'hecha' ? 'hecha' : u.grupo === 'hoy' ? 'hoy' : u.cls; };
  var chipEstado = function (t) { return t.estado ? '<span class="badge st-' + t.clase + '">' + esc(t.estado) + '</span>' : ''; };
  var chipPrio = function (t) { return t.prioridad ? '<span class="badge pr-' + t.prio + '">' + esc(t.prio === 'critica' && t.clase !== 'hecha' ? t.prioridad.toUpperCase() : t.prioridad) + '</span>' : ''; };
  var chipPlazo = function (t, u) { return '<span class="badge ' + (u.grupo === 'hoy' ? 'hoy' : u.cls) + '">' + (u.cls === 'bad' || u.grupo === 'hoy' ? '⏰ ' : '') + esc(u.txt) + '</span>'; };

  function tarjeta(t) {
    var u = urgencia(t);
    return '<div class="card tarea ' + colorU(t, u) + '" data-id="' + t.id + '">' +
      '<div class="t-top"><div>' + (t.expediente ? '<div class="exp">' + esc(t.expediente.split('\n')[0].slice(0, 80)) + '</div>' : '') +
      '<div class="tit">' + esc(t.asunto) + '</div></div>' + chipPlazo(t, u) + '</div><div class="meta">' +
      chipEstado(t) + chipPrio(t) +
      (t.nlt ? '<span class="muted">📅 NLT ' + esc(fMedia(t.nlt)) + '</span>' : '') +
      (t.responsable ? '<span class="muted">👤 ' + esc(t.responsable) + '</span>' : '') +
      (t.negociado ? '<span class="chip">' + esc(t.negociado) + '</span>' : '') + '</div></div>';
  }
  function tablaTareas(ts) {
    return '<div class="tabla-wrap"><table class="tt"><tr><th>Plazo</th><th>Asunto</th><th>Estado</th><th class="opc">Prioridad</th><th class="opc">Responsable</th><th class="opc">Negociado</th></tr>' +
      ts.map(function (t) {
        var u = urgencia(t);
        return '<tr class="tarea ' + colorU(t, u) + '" data-id="' + t.id + '"><td class="nw">' + chipPlazo(t, u) + (t.nlt ? '<div class="small muted">' + esc(fCorta(t.nlt)) + '</div>' : '') + '</td>' +
          '<td>' + (t.expediente ? '<div class="exp">' + esc(t.expediente.split('\n')[0].slice(0, 60)) + '</div>' : '') + '<b>' + esc(t.asunto) + '</b></td>' +
          '<td>' + chipEstado(t) + '</td><td class="opc">' + chipPrio(t) + '</td><td class="opc">' + esc(t.responsable) + '</td><td class="opc">' + esc(t.negociado) + '</td></tr>';
      }).join('') + '</table></div>';
  }
  var TOPE = 300;
  function listaTareas(ts) {
    var vis = ts.slice(0, TOPE);
    return (pref.modo === 'tabla' ? tablaTareas(vis) : vis.map(tarjeta).join('')) +
      (ts.length > TOPE ? '<div class="mas">Se muestran ' + TOPE + ' de ' + ts.length + '. Afina con la búsqueda o los filtros.</div>' : '');
  }
  // Grupo plegable; lo que se abre o cierra se recuerda en este navegador
  function grupo(clave, titulo, ts, forzar) {
    if (!ts.length) return '';
    var abierto = forzar || !!(pref.grupos || {})[clave];
    return '<details class="grupo g-' + clave + '" data-grupo="' + clave + '"' + (abierto ? ' open' : '') + '><summary><span class="fl">▶</span><span>' + titulo + '</span><span class="n">' + ts.length + '</span></summary>' +
      '<div class="cuerpo">' + listaTareas(ts) + '</div></details>';
  }

  // ---------- Vistas ----------
  var kpiSel = '';
  var FASES = [['pendiente', '📝', 'Pendientes'], ['curso', '⚙️', 'En curso'], ['espera', '⏸️', 'En espera'], ['hecha', '✅', 'Terminados']];
  // Valores reales de ESTADO que caen en cada fase (para la ayuda al pasar el ratón)
  var estadosDe = function (c) { return valores('ESTADO', 'estado').filter(function (e) { return claseEstado(e) === c; }); };
  var GRUPOS = [['vencidas', '🔴 Fuera de plazo'], ['hoy', '⏰ Vencen hoy'], ['semana', '📅 Próximos 7 días'], ['despues', '🗂️ Más adelante (con NLT)'], ['sin', '➖ Sin NLT']];
  var terminadaEn = function (t) { return t.fin || (t.modificada ? fechaSP(t.modificada) : ''); };
  function heroTareas() {
    if (!yo) return '';
    var ab = tareas.filter(function (t) { return t.clase !== 'hecha'; });
    var mias = ab.filter(esMia).length, impl = ab.filter(function (t) { return meImplica(t) && !esMia(t); }).length;
    var fecha = new Date().toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    return '<div class="hero"><div class="hola">Gestor de tareas · Jefatura de SUIGESUR</div><div class="nom">👤 ' + esc(yo.Title) + '</div>' +
      '<span class="rolh">Responsable de ' + mias + ' asunto' + (mias === 1 ? '' : 's') + ' abierto' + (mias === 1 ? '' : 's') + '</span>' +
      (impl ? '<span class="rolh">Implicado en ' + impl + ' más</span>' : '') +
      '<span class="rolh">Viendo: ' + { mias: 'mis asuntos', implicado: 'míos y en los que intervengo', todos: 'todos los asuntos' }[pref.quien] + '</span>' +

  function render() {
    document.querySelectorAll('#tabs a').forEach(function (a) { a.classList.toggle('on', a.dataset.v === pref.vista); });
    var v = { nlt: vistaNlt, calendario: vistaCalendario, estadisticas: vistaEstadisticas, avisos: vistaAvisos, informes: vistaInformes, ajustes: vistaAjustes }[pref.vista] || vistaNlt;
    if (!cargadoEn && pref.vista !== 'ajustes') return;
    $('#vista').innerHTML = v();
  }

  document.addEventListener('click', function (e) {
    var el = e.target;
    var tab = el.closest('#tabs a');
    if (tab) { pref.vista = tab.dataset.v; kpiSel = ''; guardarPref(); render(); return; }
    if (el.closest('#recargar')) { cargar(); return; }
    if (el.closest('[data-pruebacorreo]')) { correoPrueba(el.closest('[data-pruebacorreo]')); return; }
    if (el.closest('[data-cerrar]')) { $('#dlg').close(); return; }
    var k = el.closest('[data-kpi]');
    if (k) { kpiSel = kpiSel === k.dataset.kpi ? '' : k.dataset.kpi; render(); return; }
    var md = el.closest('[data-modo]');
    if (md) { pref.modo = md.dataset.modo; guardarPref(); render(); return; }
    if (el.closest('[data-limpiar]')) { pref.q = pref.negociado = pref.estado = pref.prio = pref.resp = ''; kpiSel = ''; guardarPref(); render(); return; }
    var d = el.closest('[data-dia]');
    if (d) { diaSel = d.dataset.dia; render(); return; }
    var m = el.closest('[data-mes]');
    if (m) { var dm = Number(m.dataset.mes), ah = new Date(); mes = dm ? new Date(mes.getFullYear(), mes.getMonth() + dm, 1) : new Date(ah.getFullYear(), ah.getMonth(), 1); if (!dm) diaSel = hoy(); render(); return; }
    var ep = el.closest('[data-estper]');
    if (ep) { pref.estPer = ep.dataset.estper; guardarPref(); render(); return; }
    var ea = el.closest('[data-est]');
    if (ea) { if (ea.dataset.est === 'csv') descargar('estadisticas-asuntos-' + hoy() + '.csv', csvEstadisticas(), 'text/csv;charset=utf-8'); else { document.body.classList.add('imprimiendo'); window.print(); setTimeout(function () { document.body.classList.remove('imprimiendo'); }, 800); } return; }
    var p = el.closest('[data-infper]');
    if (p) { var r = periodo(p.dataset.infper); $('#infOpts [name=desde]').value = r[0]; $('#infOpts [name=hasta]').value = r[1]; actualizarInf(); return; }
    var env = el.closest('[data-enviado]');
    if (env) { pref.enviados = Object.fromEntries(Object.entries(pref.enviados || {}).filter(function (x) { return x[0].indexOf(hoy()) >= 0; })); pref.enviados[claveEnviado(env.dataset.enviado)] = 1; guardarPref(); setTimeout(render, 300); return; }
    var mod = el.closest('[data-modificar]');
    if (mod) { var tm = tareas.find(function (x) { return x.id === Number(mod.dataset.modificar); }); if (tm) formularioNuevo('', tm); return; }
    var com = el.closest('[data-comentar]');
    if (com) {
      var tc = tareas.find(function (x) { return x.id === Number(com.dataset.comentar); });
      var txtc = $('#comTxt').value.trim();
      if (!tc || !txtc) return;
      com.disabled = true; com.textContent = 'Guardando…';
      anadirComentario(tc, txtc).then(function () {
        aviso('Comentario añadido');
        return cargar().then(function () { abrir(tc.id); });
      }).catch(function (er) {
        com.disabled = false; com.textContent = '💬 Añadir comentario';
        $('#comError').hidden = false; $('#comError').textContent = 'No se pudo guardar el comentario: ' + (er.message || er);
      });
      return;
    }
    var asg = el.closest('[data-asignar]');
    if (asg) { var ta = tareas.find(function (x) { return x.id === Number(asg.dataset.asignar); }); if (ta) avisarAsignacion(ta); return; }
    var ab = el.closest('[data-abrir]');
    if (ab) { e.preventDefault(); abrir(Number(ab.dataset.abrir)); return; }
    var ic = el.closest('[data-ics]');
    if (ic) {
      var o = avisoOpc(); o.alarma = Math.max(0, Number($('#alarmaDias').value) || 0); pref.avisos = o; guardarPref();
      var r = icsAsuntos(ic.dataset.ics, o.alarma);
      if (!r.n) { aviso('No hay asuntos abiertos con NLT'); return; }
      descargar('nlt-colabora-' + hoy() + '.ics', r.txt, 'text/calendar;charset=utf-8'); aviso(r.n + ' citas exportadas');
      return;
    }
    if (el.closest('[data-impcal]')) { imprimirCalendario(); return; }
    var inf = el.closest('[data-inf]');
    if (inf) { accionInforme(inf.dataset.inf); return; }
    if (el.closest('#nuevo')) { if (cargadoEn) formularioNuevo(''); return; }
    if (el.closest('#altaRapidaBtn')) { formularioNuevo($('#altaRapida').value.trim()); return; }
    var t = el.closest('.tarea');
    if (t) abrir(Number(t.dataset.id));
  });
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.closest('#infOpts')) { actualizarInf(); return; }
    if (el.closest('#avOpts')) { pref.avisos = leerAvisos(); guardarPref(); render(); return; }
    if (el.id === 'fquien') pref.quien = el.value;
    else if (el.id === 'fneg') pref.negociado = el.value;
    else if (el.id === 'fest') pref.estado = el.value;
    else if (el.id === 'fprio') pref.prio = el.value;
    else if (el.id === 'fresp') pref.resp = el.value;
    else if (el.id === 'aDias') pref.avisoDias = Math.max(1, Number(el.value) || 3);
    else if (el.id === 'aCom') pref.campoComentarios = el.value;
    else if (el.id === 'aEstAlta') pref.estadoAlta = el.value;
    else if (el.id === 'aLista') { pref.lista = el.value.trim() || 'Gestor de Tareas'; guardarPref(); listaInfo = null; cargar(); return; }
    else if (el.dataset.mapa !== undefined) {
      pref.mapaEstados[el.dataset.mapa] = el.value;
      tareas.forEach(function (t) { t.clase = t.fin ? 'hecha' : claseEstado(t.estado); });
    } else return;
    guardarPref(); render();
  });
  // Grupos plegables: «toggle» no burbujea, se escucha en captura
  document.addEventListener('toggle', function (e) {
    var g = e.target.dataset && e.target.dataset.grupo;
    if (!g || kpiSel) return;
    pref.grupos = Object.assign({}, pref.grupos); pref.grupos[g] = e.target.open; guardarPref();
  }, true);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.id === 'altaRapida') { e.preventDefault(); formularioNuevo(e.target.value.trim()); }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id !== 'fq') return;
    pref.q = e.target.value; guardarPref();
    var pos = e.target.selectionStart; render();
    var i = $('#fq'); if (i) { i.focus(); i.setSelectionRange(pos, pos); }
  });

  render();
  cargar();
})();
</script>
</body>
</html>
