<head>

<title>GESTOR DE TAREAS DE LA JEFATURA DE SUIGESUR</title>
<style>
  :root {
    --bg: #f4f5f0; --surface: #fff; --surface-2: #eef1ea; --text: #1f261f; --muted: #5f685f; --line: #d9ddd3;
    --brand: #3b4a2f; --brand-2: #56693f; --on-brand: #fff;
    --ok: #2e7d32; --ok-bg: #dcefdc; --warn: #9a5b00; --warn-bg: #fdebc8; --bad: #b71c1c; --bad-bg: #fbdada;
    --info: #1d4f91; --info-bg: #dde8f7; --na: #555; --na-bg: #e7e7e7;
    --hoy: #c2410c; --hoy-bg: #ffe3cc; --esp: #6b3fa0; --esp-bg: #efe3fb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .top { position: sticky; top: 0; z-index: 5; background: var(--brand); color: var(--on-brand); padding: 10px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .top h1 { margin: 0; font-size: 1.05rem; flex: 1; min-width: 180px; }
  .top .estado { font-size: .8rem; opacity: .9; }
  .top button { background: rgba(255,255,255,.15); color: inherit; border: 0; }
  nav.tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 12px; margin: 12px 0; }
  nav.tabs a { flex: 1; text-align: center; padding: 8px 4px; border-radius: 9px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: .9rem; cursor: pointer; }
  nav.tabs a.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  main { max-width: 1000px; margin: 0 auto; padding: 0 16px 60px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .muted { color: var(--muted); } .small { font-size: .85rem; }
  button, .btn { font: inherit; font-weight: 600; padding: 7px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--text); cursor: pointer; text-decoration: none; display: inline-block; }
  .btn.prim { background: var(--brand); color: #fff; border-color: var(--brand); }
  select, input { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--text); width: 100%; }
  label.lbl { display: block; font-size: .8rem; font-weight: 600; color: var(--muted); margin: 8px 0 3px; }
  label.check { display: inline-flex; gap: 6px; align-items: center; margin: 4px 12px 4px 0; font-size: .9rem; }
  label.check input { width: auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
  
  .hero { background: linear-gradient(120deg, #26331d 0%, #3b4a2f 55%, #56693f 100%); color: #fff; border-radius: 16px; padding: 16px 20px; margin: 12px 0; position: relative; overflow: hidden; box-shadow: 0 6px 18px rgba(38,51,29,.2); }
  .hero::after { content: ''; position: absolute; right: -40px; top: -40px; width: 180px; height: 180px; border-radius: 50%; background: radial-gradient(circle, rgba(201,168,76,.35), transparent 70%); }
  .hero .hola { font-size: .78rem; letter-spacing: 1.5px; color: #e6d9a8; text-transform: uppercase; }
  .hero .nom { font-size: 1.3rem; font-weight: 800; margin: 2px 0 8px; }
  .hero .rolh { display: inline-block; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 2px 10px; margin: 0 6px 4px 0; font-size: .78rem; font-weight: 600; }
  .hero p { margin: 6px 0 0; font-size: .82rem; color: #e3ead9; position: relative; z-index: 1; }
  .mini { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin: 10px 0 12px; }
  .mini button { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; text-align: left; font-weight: 400; transition: box-shadow .12s; }
  .mini button:hover { box-shadow: 0 6px 16px rgba(0,0,0,.08); }
  .mini button.on { outline: 2px solid var(--brand-2); outline-offset: 1px; background: var(--surface-2); }
  .mini .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 1.2rem; flex: none; }
  .ic.r { background: var(--bad-bg); } .ic.n { background: var(--hoy-bg); } .ic.a { background: var(--warn-bg); } .ic.az { background: var(--info-bg); } .ic.v { background: var(--ok-bg); }
  .mini b { display: block; font-size: 1.45rem; line-height: 1.1; } .mini span { font-size: .76rem; color: var(--muted); }
  .mini .r b { color: var(--bad); } .mini .n b { color: var(--hoy); } .mini .cero b { color: var(--muted); }
  
  .filtros { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
  .filtros > div { flex: 1 1 120px; min-width: 0; } .filtros > .q { flex: 2 1 200px; }
  .filtros label.lbl { margin-top: 0; }
  .modo { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex: none; }
  .modo button { border: 0; border-radius: 0; padding: 8px 11px; background: var(--surface); }
  .modo button.on { background: var(--brand); color: #fff; }
  .fpie { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; font-size: .82rem; color: var(--muted); }
  .fpie button { padding: 3px 10px; font-size: .8rem; }
  
  details.grupo { margin: 10px 0; }
  details.grupo > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--gc, var(--line)); font-weight: 700; user-select: none; }
  details.grupo > summary::-webkit-details-marker { display: none; }
  details.grupo > summary .fl { color: var(--muted); transition: transform .15s; font-size: .8rem; }
  details.grupo[open] > summary .fl { transform: rotate(90deg); }
  details.grupo > summary .n { margin-left: auto; background: var(--gc-bg, var(--surface-2)); color: var(--gc, var(--muted)); border-radius: 999px; padding: 1px 10px; font-size: .85rem; }
  details.grupo > .cuerpo { padding-top: 8px; }
  .g-vencidas { --gc: var(--bad); --gc-bg: var(--bad-bg); } .g-hoy { --gc: var(--hoy); --gc-bg: var(--hoy-bg); } .g-semana { --gc: var(--warn); --gc-bg: var(--warn-bg); }
  .g-despues { --gc: var(--info); --gc-bg: var(--info-bg); } .g-sin { --gc: var(--na); --gc-bg: var(--na-bg); } .g-hechas { --gc: var(--ok); --gc-bg: var(--ok-bg); }
  .mas { text-align: center; font-size: .82rem; color: var(--muted); padding: 6px; }
  .sec { margin: 16px 0 6px; font-size: .85rem; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; display: flex; justify-content: space-between; }
  .tarea { border-left: 5px solid var(--line); cursor: pointer; }
  .tarea.bad { border-left-color: var(--bad); } .tarea.hoy { border-left-color: var(--hoy); } .tarea.warn { border-left-color: var(--warn); } .tarea.ok { border-left-color: var(--ok); } .tarea.hecha { opacity: .7; }
  div.tarea { transition: box-shadow .12s; } div.tarea:hover { box-shadow: 0 4px 12px rgba(0,0,0,.07); }
  .tarea .tit { font-weight: 650; overflow-wrap: anywhere; }
  .t-top { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
  .t-top .badge { flex: none; margin-top: 2px; }
  .exp { font-family: ui-monospace, Consolas, monospace; font-size: .74rem; color: var(--muted); }
  
  .st-pendiente { background: var(--na-bg); color: var(--na); } .st-curso { background: var(--info-bg); color: var(--info); }
  .st-espera { background: var(--esp-bg); color: var(--esp); } .st-hecha { background: var(--ok-bg); color: var(--ok); }
  .pr-critica { background: var(--bad); color: #fff; } .pr-alta { background: var(--hoy-bg); color: var(--hoy); }
  .pr-media { background: var(--surface-2); color: var(--muted); } .pr-baja { background: #edf2f6; color: #5b7184; }
  .badge.hoy { background: var(--hoy-bg); color: var(--hoy); }
  
  .tabla-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  table.tt { width: 100%; border-collapse: collapse; font-size: .84rem; }
  table.tt th { text-align: left; font-size: .7rem; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); padding: 7px 8px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
  table.tt td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.tt tr:last-child td { border-bottom: 0; }
  table.tt tr.tarea:hover td { background: #f8faf5; }
  table.tt .nw { white-space: nowrap; }
  @media (max-width: 640px) { table.tt .opc { display: none; } }
  .meta { display: flex; flex-wrap: wrap; gap: 5px 8px; margin-top: 4px; font-size: .82rem; align-items: center; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .74rem; font-weight: 700; white-space: nowrap; }
  .badge.ok { background: var(--ok-bg); color: var(--ok); } .badge.warn { background: var(--warn-bg); color: var(--warn); }
  .badge.bad { background: var(--bad-bg); color: var(--bad); } .badge.info { background: var(--info-bg); color: var(--info); }
  .badge.none { background: var(--na-bg); color: var(--na); } .badge.crit { background: var(--bad); color: #fff; }
  .chip { background: var(--surface-2); color: var(--muted); border-radius: 6px; padding: 1px 7px; font-weight: 600; font-size: .75rem; }
  .sugs { border: 1px solid var(--line); border-radius: 10px; margin-top: 4px; max-height: 240px; overflow: auto; }
  .sugs button { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; padding: 8px 10px; font: inherit; color: inherit; cursor: pointer; }
  .sugs button:hover, .sugs button:focus { background: var(--surface-2); }
  .sugs .small { padding: 8px 10px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal .dow { text-align: center; font-size: .72rem; color: var(--muted); font-weight: 700; }
  .dia { min-height: 62px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 4px; font-size: .78rem; cursor: pointer; text-align: left; }
  .dia.fuera { opacity: .4; } .dia.hoy { outline: 2px solid var(--brand-2); } .dia.sel { background: var(--surface-2); }
  .dia i { display: block; font-style: normal; font-size: .68rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-radius: 4px; padding: 0 3px; margin-top: 2px; background: var(--info-bg); color: var(--info); }
  .dia i.bad { background: var(--bad-bg); color: var(--bad); }
  dialog { width: min(1280px, calc(100vw - 24px)); height: calc(100vh - 24px); max-height: calc(100vh - 24px); border: 0; border-radius: 14px; padding: 0; font-size: 16px; }
  dialog input, dialog select, dialog textarea, dialog button, dialog .btn { font-size: 16px; }
  dialog textarea { min-height: 7em; resize: vertical; }
  dialog #comTxt { min-height: 9em; }
  dialog label.lbl { font-size: .85rem; }
  .ficha { display: grid; gap: 18px; }
  @media (min-width: 1000px) {
    .ficha { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: start; }
    .ficha-com { position: sticky; top: 64px; max-height: calc(100vh - 110px); overflow: auto; }
  }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .dh { position: sticky; top: 0; background: var(--brand); color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; gap: 10px; }
  .dh h2 { margin: 0; font-size: 1.25rem; }
  .db { padding: 16px 22px; }
  .campo { border-bottom: 1px solid var(--line); padding: 7px 0; }
  .campo b { display: block; font-size: .85rem; color: var(--muted); }
  .campo div { white-space: pre-wrap; overflow-wrap: anywhere; }
  .informe { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; font-size: .88rem; overflow-x: auto; }
  .informe h2 { text-align: center; text-transform: uppercase; font-size: 1.1rem; margin: 6px 0; }
  .informe h3 { color: var(--brand); margin: 16px 0 6px; font-size: .95rem; }
  .informe .c { text-align: center; margin: 2px 0; color: var(--muted); font-size: .85rem; }
  .informe .marca { text-align: center; color: var(--bad); font-weight: 800; }
  table.t { width: 100%; border-collapse: collapse; font-size: .8rem; }
  table.t th { background: var(--brand); color: #fff; text-align: left; padding: 5px 6px; }
  table.t td { border-bottom: 1px solid var(--line); padding: 5px 6px; vertical-align: top; }
  .rojo { color: var(--bad); font-weight: 700; }
  .aviso { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
  .error { background: var(--bad-bg); color: var(--bad); border-radius: 10px; padding: 10px 12px; margin: 10px 0; font-weight: 600; }
  .acciones { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 10px 0; }
  .autor { max-width: 1000px; margin: 0 auto; padding: 12px 16px 24px; text-align: center; font-size: .78rem; color: var(--muted); border-top: 1px solid var(--line); }
  @media print { .autor { display: none; } }
  @media (max-width: 520px) { .mini { grid-template-columns: repeat(2, 1fr); } 
    .mini button { padding: 8px; } .mini button:last-child:nth-child(odd) { grid-column: 1 / -1; } .hero { padding: 14px 16px; } .dia { min-height: 44px; } .dia i { font-size: 0; height: 5px; } }
  @media print {
    body.imprimiendo .top, body.imprimiendo nav.tabs, body.imprimiendo #vista > :not(#informeDoc) { display: none !important; }
    body.imprimiendo .informe { border: 0; padding: 0; }
  }
</style>
