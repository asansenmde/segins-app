<body>
<header class="top">
  <h1>GESTOR DE TAREAS DE LA JEFATURA DE SUIGESUR</h1>

  <button id="nuevo" title="Dar de alta un asunto en Colabora">＋ Nuevo asunto</button>
  <button id="desdeCorreo" title="Crear un asunto a partir de un correo de Outlook (.msg o .eml). También puedes arrastrarlo a la página">✉ Desde correo</button>
  <input type="file" id="ficheroCorreo" accept=".msg,.eml,message/rfc822,application/vnd.ms-outlook" hidden>
  <button id="recargar" title="Volver a leer la lista">↻ Actualizar</button>
</header>
<main>
