  .badge.bad { background: var(--bad-bg); color: var(--bad); } .badge.info { background: var(--info-bg); color: var(--info); }
  .badge.none { background: var(--na-bg); color: var(--na); } .badge.crit { background: var(--bad); color: #fff; }
  .chip { background: var(--surface-2); color: var(--muted); border-radius: 6px; padding: 1px 7px; font-weight: 600; font-size: .75rem; }
  .sugs { border: 1px solid var(--line); border-radius: 10px; margin-top: 4px; max-height: 240px; overflow: auto; }
  .sugs button { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; padding: 8px 10px; font: inherit; color: inherit; cursor: pointer; }
  .sugs button:hover, .sugs button:focus { background: var(--surface-2); }
  .sugs .small { padding: 8px 10px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal .dow { text-align: center; font-size: .72rem; color: var(--muted); font-weight: 700; }
  .dia { min-height: 62px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 4px; font-size: .78rem; cursor: pointer; text-align: left; }
  .dia.fuera { opacity: .4; } .dia.hoy { outline: 2px solid var(--brand-2); } .dia.sel { background: var(--surface-2); }
  .dia i { display: block; font-style: normal; font-size: .68rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-radius: 4px; padding: 0 3px; margin-top: 2px; background: var(--info-bg); color: var(--info); }
  .dia i.bad { background: var(--bad-bg); color: var(--bad); }
  dialog { width: min(1280px, calc(100vw - 24px)); height: calc(100vh - 24px); max-height: calc(100vh - 24px); border: 0; border-radius: 14px; padding: 0; font-size: 16px; }
  dialog input, dialog select, dialog textarea, dialog button, dialog .btn { font-size: 16px; }
  dialog textarea { min-height: 7em; resize: vertical; }
  dialog #comTxt { min-height: 9em; }
  dialog label.lbl { font-size: .85rem; }
  .ficha { display: grid; gap: 18px; }
  @media (min-width: 1000px) {
    .ficha { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: start; }
    .ficha-com { position: sticky; top: 64px; max-height: calc(100vh - 110px); overflow: auto; }
  }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  body.soltando main { outline: 3px dashed var(--brand); outline-offset: -6px; }
  body.soltando main::before { content: "Suelta el correo para crear un asunto"; display: block; text-align: center; font-weight: 700; padding: 10px; }
  .dh { position: sticky; top: 0; background: var(--brand); color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; gap: 10px; }
  .dh h2 { margin: 0; font-size: 1.25rem; }
  .db { padding: 16px 22px; }
  .campo { border-bottom: 1px solid var(--line); padding: 7px 0; }
  .campo b { display: block; font-size: .85rem; color: var(--muted); }
  .campo div { white-space: pre-wrap; overflow-wrap: anywhere; }
  .informe { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; font-size: .88rem; overflow-x: auto; }
  .informe h2 { text-align: center; text-transform: uppercase; font-size: 1.1rem; margin: 6px 0; }
  .informe h3 { color: var(--brand); margin: 16px 0 6px; font-size: .95rem; }
  .informe .c { text-align: center; margin: 2px 0; color: var(--muted); font-size: .85rem; }
  .informe .marca { text-align: center; color: var(--bad); font-weight: 800; }
  table.t { width: 100%; border-collapse: collapse; font-size: .8rem; }
  table.t th { background: var(--brand); color: #fff; text-align: left; padding: 5px 6px; }
  table.t td { border-bottom: 1px solid var(--line); padding: 5px 6px; vertical-align: top; }
  .rojo { color: var(--bad); font-weight: 700; }
  .aviso { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
  .bandaPruebas { background: var(--bad); color: #fff; text-align: center; font-weight: 800; letter-spacing: .5px; padding: 6px 10px; font-size: .9rem; }
  @media print { .bandaPruebas { display: none; } }
  .error { background: var(--bad-bg); color: var(--bad); border-radius: 10px; padding: 10px 12px; margin: 10px 0; font-weight: 600; }
  .acciones { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 10px 0; }
  .autor { max-width: 1000px; margin: 0 auto; padding: 12px 16px 24px; text-align: center; font-size: .78rem; color: var(--muted); border-top: 1px solid var(--line); }
  @media print { .autor { display: none; } }
  @media (max-width: 520px) { .mini { grid-template-columns: repeat(2, 1fr); } 
    .mini button { padding: 8px; } .mini button:last-child:nth-child(odd) { grid-column: 1 / -1; } .hero { padding: 14px 16px; } .dia { min-height: 44px; } .dia i { font-size: 0; height: 5px; } }
  @media print {
    body.imprimiendo .top, body.imprimiendo nav.tabs, body.imprimiendo #vista > :not(#informeDoc):not(#estDoc) { display: none !important; }
    body.imprimiendo #estDoc .card { break-inside: avoid; } body.imprimiendo #estDoc * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body.imprimiendo .informe { border: 0; padding: 0; }
  }
