<body>
<header class="top">
  <h1>GESTOR DE TAREAS DE LA JEFATURA DE SUIGESUR</h1>
  <span class="estado" id="estadoCarga">Cargando…</span>
  <button id="nuevo" title="Dar de alta un asunto en Colabora">＋ Nuevo asunto</button>
