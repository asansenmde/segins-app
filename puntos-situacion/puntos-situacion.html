<title>Puntos de Situación · SUIGESUR</title>
<!--
  [PUNTOS] Puntos de situación de SUIGESUR en Colabora (sitio /et/SUIGESUR/JSUIGE).
  Una sola página, sin recursos de internet: trabaja con la sesión y los permisos del usuario.
  Cada negociado aporta sus entradas (texto e imágenes) a un punto de situación; a la hora de cierre el punto se bloquea
  (también en el servidor, con la validación de la lista), PROCOR genera el informe Word oficial, lo archiva en la red y,
  pasado un mes, borra el contenido de Colabora (a la papelera). Los asuntos «⭐ Tratar con el General» de META llegan
  como propuestas. Listas: «PS Puntos», «PS Negociados», «PS Aportaciones» y «PS Solicitudes» (las crea la propia página).
-->
<style>
  :root {
    --bg: #f3f5f8; --surface: #fff; --surface-2: #e8eef6; --text: #1b2430; --muted: #5a6575; --line: #d5dce6;
    --brand: #1b3a5c; --on-brand: #fff; --oro: #b8962e;
    --ok: #2e7d32; --ok-bg: #dcefdc; --warn: #9a5b00; --warn-bg: #fdebc8; --bad: #b71c1c; --bad-bg: #fbdada;
    --info: #1d4f91; --info-bg: #dde8f7; --na: #555; --na-bg: #e7e7e7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .oficial { background: #fff; border-bottom: 1px solid var(--line); }
  .oficial > div { max-width: 1180px; margin: 0 auto; padding: 6px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; }
  .oficial .izq { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .oficial .minisdef { height: 46px; }
  .oficial .org { flex: 1; font-size: .78rem; color: #333; letter-spacing: .06em; line-height: 1.3; border-left: 1px solid #bbb; padding-left: 12px; }
  .oficial .org b { font-size: .86rem; letter-spacing: .08em; }
  .oficial .uso { height: 28px; }
  .top { position: sticky; top: 0; z-index: 5; background: linear-gradient(90deg, #102840, var(--brand) 55%, #24507a); color: var(--on-brand); border-bottom: 4px solid var(--oro); box-shadow: 0 2px 6px rgba(0,0,0,.25); }
  .top > div { max-width: 1180px; margin: 0 auto; padding: 8px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .top .tit { flex: 1; min-width: 220px; }
  .top h1 { margin: 0; font-size: 1.2rem; letter-spacing: .05em; font-weight: 800; }
  .top .sub { display: block; font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: #e6d9a8; }
  .top .estado { font-size: .8rem; opacity: .9; }
  .top button { background: rgba(255,255,255,.12); color: inherit; border: 1px solid rgba(232,215,160,.5); }
  .quien { font-size: .85rem; font-weight: 700; background: rgba(255,255,255,.14); border: 1px solid rgba(232,215,160,.5); border-radius: 9px; padding: 5px 10px; }
  .banda-pruebas { background: #b71c1c; color: #fff; text-align: center; font-weight: 800; padding: 6px; letter-spacing: .04em; }
  @media (max-width: 600px) { .oficial .org { display: none; } .oficial > div { grid-template-columns: auto 1fr; } .oficial .uso { justify-self: end; } .top h1 { font-size: 1rem; } }
  main { max-width: 1180px; margin: 0 auto; padding: 0 16px 60px; }
  nav.tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 12px; margin: 12px 0; flex-wrap: wrap; }
  nav.tabs a { flex: 1; text-align: center; padding: 8px 6px; border-radius: 9px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: .9rem; cursor: pointer; min-width: 110px; }
  nav.tabs a.on { background: var(--surface); color: var(--brand); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .muted { color: var(--muted); } .small { font-size: .85rem; }
  h2.sec, .sec { margin: 16px 0 6px; font-size: .82rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; font-weight: 700; }
  button, .btn { font: inherit; font-weight: 600; padding: 7px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--text); cursor: pointer; text-decoration: none; display: inline-block; }
  button:disabled { opacity: .5; cursor: default; }
  .prim { background: var(--brand) !important; color: #fff !important; border-color: var(--brand) !important; }
  .rojo { color: var(--bad); border-color: var(--bad); }
  select, input, textarea { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--text); width: 100%; }
  label.lbl { display: block; font-size: .8rem; font-weight: 600; color: var(--muted); margin: 8px 0 3px; }
  label.check { display: inline-flex; gap: 6px; align-items: center; margin: 4px 14px 4px 0; font-size: .9rem; }
  label.check input { width: auto; }
  .fila { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .fila > .crece { flex: 1; min-width: 200px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
  .grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px; text-align: center; }
  .kpi b { display: block; font-size: 1.6rem; } .kpi.ok b { color: var(--ok); } .kpi.bad b { color: var(--bad); }
  @media (max-width: 560px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
  .badge { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: .75rem; font-weight: 700; white-space: nowrap; }
  .badge.ok { background: var(--ok-bg); color: var(--ok); } .badge.warn { background: var(--warn-bg); color: var(--warn); }
  .badge.bad { background: var(--bad-bg); color: var(--bad); } .badge.info { background: var(--info-bg); color: var(--info); }
  .badge.none { background: var(--na-bg); color: var(--na); } .badge.oro { background: #f6eed2; color: #6d5410; }
  .neg { border-left: 5px solid var(--line); } .neg.v { border-left-color: var(--ok); } .neg.s { border-left-color: #999; } .neg.r { border-left-color: var(--bad); }
  .bar { height: 10px; background: var(--surface-2); border-radius: 9px; overflow: hidden; flex: 1; } .bar i { display: block; height: 100%; background: var(--brand); }
  .ent { border-left: 5px solid var(--info); display: flex; gap: 10px; }
  .ent.alta { border-left-color: var(--bad); } .ent .asa { color: var(--muted); cursor: grab; font-size: 1.2rem; user-select: none; }
  .ent.arrastrando { opacity: .4; } .ent.sobre { outline: 2px dashed var(--brand); }
  .ent .cuerpo { flex: 1; min-width: 0; }
  .texto { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 4px; }
  .texto figure, .editor figure { margin: 8px 0; display: block; }
  .texto figure img { max-width: 100%; border: 1px solid var(--line); border-radius: 6px; display: block; }
  .texto figcaption { font-size: .8rem; font-style: italic; color: var(--muted); }
  .editor { min-height: 160px; border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: #fff; white-space: pre-wrap; overflow-wrap: anywhere; outline: none; }
  .editor:focus { border-color: var(--brand); }
  .editor { resize: vertical; overflow: auto; }
  dialog.grande { width: 100vw; max-width: 100vw; height: 100vh; max-height: 100vh; border-radius: 0; }
  dialog.grande .editor { min-height: calc(100vh - 330px); font-size: 1.05rem; }
  .editor.sobre { background: var(--info-bg); }
  .editor figure { border: 1px dashed var(--line); border-radius: 8px; padding: 6px; background: #fafbfc; }
  .editor figure img { max-width: 100%; display: block; border-radius: 6px; }
  .editor figcaption { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
  .editor figcaption input { flex: 1; min-width: 160px; padding: 5px 8px; font-size: .85rem; }
  .editor figcaption button { padding: 4px 9px; font-size: .8rem; }
  .barra-ed { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; }
  .aviso { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
  .okmsg { background: var(--ok-bg); color: var(--ok); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
  .error { background: var(--bad-bg); color: var(--bad); border-radius: 10px; padding: 10px 12px; margin: 10px 0; font-weight: 600; }
  .bloqueo { background: #2b2b2b; color: #fff; border-radius: 10px; padding: 10px 14px; margin: 10px 0; }
  .acciones { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  .acciones .sep { flex: 1; }
  .chip { display: inline-flex; gap: 4px; align-items: center; background: var(--surface-2); border-radius: 999px; padding: 2px 4px 2px 10px; margin: 2px; font-size: .82rem; }
  .chip button { border: 0; background: transparent; padding: 0 6px; color: var(--bad); }
  .sugs { border: 1px solid var(--line); border-radius: 10px; margin-top: 4px; max-height: 220px; overflow: auto; background: #fff; }
  .sugs button { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; font-weight: 400; }
  .sugs button:hover { background: var(--surface-2); }
  table.t { width: 100%; border-collapse: collapse; font-size: .88rem; }
  table.t th { background: var(--brand); color: #fff; text-align: left; padding: 6px; }
  table.t td { border-bottom: 1px solid var(--line); padding: 6px; vertical-align: top; }
  .log div { font-size: .88rem; margin: 2px 0; }
  dialog { width: min(820px, calc(100vw - 16px)); max-height: calc(100vh - 16px); border: 0; border-radius: 14px; padding: 0; }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .dh { position: sticky; top: 0; z-index: 2; background: var(--brand); color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; gap: 10px; align-items: center; border-bottom: 3px solid var(--oro); }
  .dh h2 { margin: 0; font-size: 1.05rem; }
  .db { padding: 12px 16px 16px; }
  /* Vista previa del informe (como el Word) */
  .hoja { background: #fff; max-width: 800px; margin: 10px auto; padding: 28px 40px; box-shadow: 0 2px 10px rgba(0,0,0,.15); font-family: Arial, Helvetica, sans-serif; font-size: 13px; color: #111; }
  .hoja .sup { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding-bottom: 4px; }
  .hoja .sup .m { height: 48px; } .hoja .sup .u { height: 26px; } .hoja .sup .r { text-align: right; font-weight: 700; font-size: 12px; }
  .hoja .banda { background: #1b3a5c; color: #fff; border-bottom: 3px solid #b8962e; padding: 6px 10px; }
  .hoja .banda .o { font-size: 10px; letter-spacing: 1.5px; color: #e6d9a8; } .hoja .banda .t { font-size: 17px; font-weight: 700; } .hoja .banda .f { font-size: 12px; }
  .hoja .subt { text-align: center; margin: 6px 0 10px; font-size: 11.5px; color: #333; }
  .hoja h3 { color: #1b3a5c; border-bottom: 1px solid #b8962e; font-size: 14px; margin: 16px 0 6px; padding-bottom: 2px; }
  .hoja .item { margin: 4px 0 10px 18px; } .hoja .item .asunto::before { content: '• '; margin-left: -12px; } .hoja .item .asunto { margin-bottom: 2px; }
  .hoja figure { text-align: center; margin: 8px 0; } .hoja figure img { max-width: 100%; } .hoja figcaption { font-size: 11px; font-style: italic; }
  .hoja .firma { margin: 26px 0 0 auto; width: 50%; border-top: 1px solid #555; padding-top: 4px; text-align: center; font-size: 12px; }
  .hoja .pie { text-align: center; font-size: 10px; color: #555; border-top: 1px solid #ccc; margin-top: 18px; padding-top: 4px; }
  .hoja .pie img { height: 14px; }
  .autor { max-width: 1180px; margin: -40px auto 0; padding: 12px 16px 24px; text-align: center; font-size: .78rem; color: var(--muted); border-top: 1px solid var(--line); }
  @media print { .autor { display: none; } }
</style>
</head>

  // Propuestas: asuntos ⭐ de META abiertos que no están en el punto (por negociado, según «Nombre en el Gestor»)

          '<Override PartName="/word/header1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.header+xml"/><Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/>' +
          '<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/></Types>' },
        { nombre: '_rels/.rels', datos: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="' + R + 'officeDocument" Target="word/document.xml"/>' +
          '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>' },
        { nombre: 'docProps/core.xml', datos: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">' +
          '<dc:title>' + xesc(TITULO_INF + ' · ' + p.ref) + '</dc:title><dc:creator>' + xesc(yo.Title) + '</dc:creator><dcterms:created xsi:type="dcterms:W3CDTF">' + new Date().toISOString().replace(/\.\d+Z$/, 'Z') + '</dcterms:created></cp:coreProperties>' },
        { nombre: 'word/document.xml', datos: doc }, { nombre: 'word/styles.xml', datos: estilos }, { nombre: 'word/header1.xml', datos: cab }, { nombre: 'word/footer1.xml', datos: pie },
        { nombre: 'word/_rels/document.xml.rels', datos: relsDe('document', '<Relationship Id="rIdS" Type="' + R + 'styles" Target="styles.xml"/><Relationship Id="rIdH" Type="' + R + 'header" Target="header1.xml"/><Relationship Id="rIdF" Type="' + R + 'footer" Target="footer1.xml"/>') },

  }
  function descargarWord(id, boton, soloNeg) {
    var p = puntoPorId(id);
    if (!p) return;
    if (soloNeg && !puedo(soloNeg)) return aviso('Solo puedes descargar la parte de tu negociado');
    var t = boton.textContent; boton.disabled = true; boton.textContent = 'Preparando…';
    docxInforme(p, soloNeg).then(function (b) { descargar(nombreWord(p, soloNeg), b); aviso('Descargado: ' + nombreWord(p, soloNeg)); }, function (e) { alert('No se pudo generar el Word: ' + e.message); })
      .then(function () { boton.disabled = false; boton.textContent = t; });
  }
  // PDF: la misma hoja del informe en un marco oculto y «Imprimir» del navegador (elegir «Guardar como PDF»).
  // Se monta con el DOM, sin escribir etiquetas de página en el código.
  function imprimirPdf(id, boton, soloNeg) {
    var p = puntoPorId(id);
    if (!p) return;
    if (soloNeg && !puedo(soloNeg)) return aviso('Solo puedes descargar la parte de tu negociado');
    var viejo = $('#marcoPdf'); if (viejo) viejo.remove();
    var fr = document.createElement('iframe');
    fr.id = 'marcoPdf'; fr.setAttribute('aria-hidden', 'true');
    fr.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
    document.body.appendChild(fr);
    var d = fr.contentDocument, st = d.createElement('style');
    d.title = (soloNeg ? sinAcentos(soloNeg) + ' · ' : '') + p.ref + ' Punto de Situacion ' + aDia(p.fecha);
    st.textContent = document.querySelector('style').textContent + '@page{size:A4;margin:12mm}body{background:#fff;margin:0}.hoja{box-shadow:none;margin:0;max-width:none;padding:0}' +
      '.hoja .banda{-webkit-print-color-adjust:exact;print-color-adjust:exact}.hoja h3{break-after:avoid}.hoja figure{break-inside:avoid}';
    d.head.appendChild(st);
    d.body.innerHTML = htmlInforme(p, soloNeg);
    var t = boton.textContent; boton.disabled = true; boton.textContent = 'Preparando…';
    var imgs = Array.prototype.slice.call(d.images);
    Promise.all(imgs.map(function (im) { return im.complete ? null : new Promise(function (ok) { im.onload = im.onerror = ok; }); })).then(function () {
      boton.disabled = false; boton.textContent = t;
      aviso('En la ventana de imprimir, elige «Guardar como PDF»');
      fr.contentWindow.focus(); fr.contentWindow.print();

  }
  function descargarZip(id, boton) {
    var p = puntoPorId(id), arch = [];
    var limpio = function (s) { return String(s).replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 60); };
    boton.disabled = true;
    delPunto(p).reduce(function (q, a) {
      return q.then(function () {
        return trozos(a.sit).filter(function (x) { return x.img; }).reduce(function (q2, x, i) {
          return q2.then(function () {
            var u = urlAdj(a, x.img.nombre);
            if (!u) return;
            return fetch(u, { credentials: 'same-origin' }).then(function (r) { return r.ok ? r.arrayBuffer() : null; }).then(function (b) {
              if (b) arch.push({ nombre: limpio(a.neg) + '/' + limpio(a.titulo) + ' ' + (i + 1) + (x.img.pie ? ' - ' + limpio(x.img.pie) : '') + '.' + (x.img.nombre.split('.').pop() || 'jpg'), datos: new Uint8Array(b) });
            });
          });
        }, Promise.resolve());
      });
    }, Promise.resolve()).then(function () {
      boton.disabled = false;
      if (!arch.length) { alert('Este punto no tiene imágenes.'); return; }
      descargar(p.ref + ' imagenes.zip', zip(arch));
    });
  }

  // ---------- Eventos ----------
  document.addEventListener('click', function (e) {
    var el = e.target, b, p = puntoPorId(sel);
    if (el.closest('#recargar')) { cargar(); return; }
    if ((b = el.closest('nav.tabs a'))) { pref.vista = b.dataset.v; guardarPref(); render(); window.scrollTo(0, 0); return; }
    if (el.closest('[data-cerrar]')) { $('#dlg').close(); return; }
    if ((b = el.closest('[data-ampliar]'))) { var dg = $('#dlg'), g = dg.classList.toggle('grande'); pref.editorGrande = g; guardarPref(); b.textContent = g ? '🗗 Reducir' : '⛶ Ampliar'; $('#edSit').focus(); return; }
    if (el.closest('[data-recargar2]')) { cargar(); return; }
    if ((b = el.closest('[data-instalar]'))) { instalar(b); return; }
    if ((b = el.closest('[data-comprobar]'))) {
      var lg = $('#logInst'); lg.innerHTML = ''; b.disabled = true;
      preparar(function (t, ok) { lg.insertAdjacentHTML('beforeend', '<div' + (ok ? '' : ' style="color:var(--bad);font-weight:600"') + '>' + esc(t) + '</div>'); }).then(function () { b.disabled = false; });
      return;
    }
    if (el.closest('[data-nuevo]')) { dialogoPunto(); return; }
    if (el.closest('[data-siguiente]')) { var sg = siguientePeriodico(); if (sg) dialogoPunto(sg.base); return; }
    if ((b = el.closest('[data-crearpunto]'))) { crearPunto(b); return; }
    if (el.closest('[data-modificarpunto]')) { dialogoPunto(null, p); return; }
    if ((b = el.closest('[data-guardarpunto]'))) { guardarPunto(b, puntoPorId(Number(b.dataset.guardarpunto))); return; }
    if ((b = el.closest('[data-eliminarpunto]'))) { eliminarPunto(b, puntoPorId(Number(b.dataset.eliminarpunto))); return; }
    if ((b = el.closest('[data-verpunto]'))) { sel = Number(b.dataset.verpunto); pref.vista = 'seguimiento'; guardarPref(); render(); window.scrollTo(0, 0); return; }
    if ((b = el.closest('[data-irneg]'))) { pref.neg = b.dataset.irneg; pref.vista = 'negociado'; guardarPref(); render(); window.scrollTo(0, 0); return; }
    if (el.closest('[data-recordar]')) { recordar(p); return; }
    if ((b = el.closest('[data-cerrarya]'))) {
      if (!confirm('El punto ' + p.ref + ' se bloqueará dentro de un minuto (Colabora necesita una hora futura para guardarlo). ¿Cerrar ahora?')) return;
      cierreOk(null, p, new Date(ahora() + 70000)); return;
    }
    if (el.closest('[data-cambiarcierre]')) { dialogoCierre(p); return; }
    if ((b = el.closest('[data-cierreok]'))) { cierreOk(b, p); return; }
    if ((b = el.closest('[data-word]'))) { descargarWord(Number(b.dataset.word), b); return; }
    if ((b = el.closest('[data-pdf]'))) { imprimirPdf(Number(b.dataset.pdf), b); return; }
    if ((b = el.closest('[data-wordneg]'))) { descargarWord(Number(b.dataset.wordneg), b, b.dataset.neg || ($('#selParte') && $('#selParte').value)); return; }
    if ((b = el.closest('[data-pdfneg]'))) { imprimirPdf(Number(b.dataset.pdfneg), b, b.dataset.neg || ($('#selParte') && $('#selParte').value)); return; }
    if ((b = el.closest('[data-zip]'))) { descargarZip(Number(b.dataset.zip), b); return; }
    if ((b = el.closest('[data-entregado]'))) {
      var pe = puntoPorId(Number(b.dataset.entregado)); b.disabled = true;
      merge(U('puntos') + '/items(' + pe.id + ')', { __metadata: tipo('puntos'), EstadoPunto: 'Entregado' }, 'Sin permiso').then(function () { return anotar(pe, 'entregado'); }).then(function () { cargar(); }, function (er) { alert(er.message); b.disabled = false; });
      return;
    }
    if ((b = el.closest('[data-archivar]'))) { dialogoArchivar(puntoPorId(Number(b.dataset.archivar))); return; }
    if ((b = el.closest('[data-archivarok]'))) { archivarOk(b, puntoPorId(Number(b.dataset.archivarok))); return; }
    if ((b = el.closest('[data-borrarpunto]'))) { borrarPunto(b, puntoPorId(Number(b.dataset.borrarpunto))); return; }
    // Entradas
    if ((b = el.closest('[data-editar]'))) { var a = aport.find(function (x) { return x.id === Number(b.dataset.editar); }); abrirEditor(p, pref.neg, a || null, a ? null : undefined); return; }
    if ((b = el.closest('[data-guardarent]'))) { guardarEntrada(b); return; }
    if (el.closest('[data-insimg]')) { $('#selImg').value = ''; $('#selImg').click(); return; }
    if ((b = el.closest('[data-tam]'))) { var fg = b.closest('figure'), w = { 100: 75, 75: 50, 50: 100 }[fg.dataset.ancho] || 100; fg.dataset.ancho = w; $('img', fg).style.width = w + '%'; b.textContent = '⇔ ' + w + '%'; return; }
    if ((b = el.closest('[data-quitarimg]'))) { b.closest('figure').remove(); return; }
    if ((b = el.closest('[data-mover]'))) {
      var es = entradas(p, pref.neg).map(function (x) { return x.id; }), i = es.indexOf(Number(b.dataset.mover)), j = i + Number(b.dataset.dir);
      if (j >= 0 && j < es.length) { es.splice(j, 0, es.splice(i, 1)[0]); moverEntrada(p, pref.neg, null, es); }
      return;
    }
    if ((b = el.closest('[data-borrar]'))) {
      var ab = aport.find(function (x) { return x.id === Number(b.dataset.borrar); });
      if (!ab || !esAbierto(p)) return;
      if (b.dataset.seguro !== '1') { b.dataset.seguro = '1'; b.textContent = '¿Quitar? Pulsa otra vez'; return; }
      b.disabled = true;
      quitarAport(ab.id).then(function (r) { aviso(r === 'apartada' ? 'Entrada quitada del punto' : 'Entrada quitada (está en la papelera de Colabora)'); cargar(); }, function (er) { alert(er.message); b.disabled = false; });
      return;
    }
    if ((b = el.closest('[data-sinnovedad]'))) {
      if (!esAbierto(p) || !puedo(pref.neg)) return;
      b.disabled = true;
      enviarSP(U('aport') + '/items', { __metadata: tipo('aport'), Title: 'Sin novedad', PuntoId: p.id, Referencia: p.ref, Negociado: pref.neg, Tipo: 'Sin novedad', Situacion: '', Orden: 0, CierrePunto: p.cierre.toISOString(), Origen: 'Página' }, 'No tienes permiso')
        .then(function () { aviso('Marcado «Sin novedad»'); cargar(); }, function (er) { alert(er.message); b.disabled = false; });
      return;
    }
    if ((b = el.closest('[data-quitarsn]'))) { b.disabled = true; quitarAport(Number(b.dataset.quitarsn)).then(function () { aviso('«Sin novedad» quitado'); cargar(); }, function (er) { alert(er.message); b.disabled = false; }); return; }
    if (el.closest('[data-traer]')) { traerAnterior(p, pref.neg); return; }
    if ((b = el.closest('[data-traerok]'))) { traerOk(b); return; }
    if ((b = el.closest('[data-incluirmeta]'))) { incluirMeta(Number(b.dataset.incluirmeta)); return; }
    // Ajustes
    if ((b = el.closest('[data-guardarneg]'))) { guardarNeg(b, Number(b.dataset.guardarneg)); return; }
    if ((b = el.closest('[data-quitarmiembro]'))) {
      var nid = Number(b.dataset.quitarmiembro), pn = pendientesNeg[nid] = pendientesNeg[nid] || { anadir: [], quitar: [] };
      pn.quitar.push(Number(b.dataset.uid)); b.closest('.chip').style.textDecoration = 'line-through'; b.remove();
      $('[data-negmsg]', document.querySelector('[data-negrow="' + nid + '"]')).innerHTML = '<span class="badge warn">Pendiente de guardar</span>';
      return;
    }
    if ((b = el.closest('[data-negmover]'))) { moverNeg(Number(b.dataset.negmover), Number(b.dataset.dir)); return; }
    if ((b = el.closest('[data-crearneg]'))) {
      var nom = $('#nuevoNeg').value.trim(); if (!nom) return;
      b.disabled = true;
      enviarSP(U('negs') + '/items', { __metadata: tipo('negs'), Title: nom, Orden: negs.length ? Math.max.apply(null, negs.map(function (n) { return n.orden || 0; })) + 1 : 1, NombreGestor: nom, Coordina: false, EnInforme: true }, 'No tienes permiso')
        .then(function () { cargar(); }, function (er) { alert(er.message); b.disabled = false; });
      return;
    }
    if ((b = el.closest('[data-aprobar]'))) { resolverSolicitud(Number(b.dataset.aprobar), true); return; }
    if ((b = el.closest('[data-denegar]'))) { resolverSolicitud(Number(b.dataset.denegar), false); return; }
    if ((b = el.closest('[data-solicitar]'))) { solicitar(b); return; }
    if ((b = el.closest('[data-pruebacorreo]'))) { correoPrueba(b); return; }
  });
  $('#dlg').addEventListener('close', function () { $('#dlg').classList.remove('grande'); });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'selPunto') { sel = Number(e.target.value); render(); return; }
    if (e.target.id === 'selNeg') { pref.neg = e.target.value; guardarPref(); render(); return; }
    if (e.target.id === 'selImg') { var fs = Array.prototype.slice.call(e.target.files || []); if (fs.length) insertarImagenes(fs); }
  });
  // El editor recuerda dónde estaba el cursor para insertar la imagen ahí
  var ultimoRango = null;
  document.addEventListener('selectionchange', function () { var s = getSelection(), c = $('#edSit'); if (c && s.rangeCount && c.contains(s.getRangeAt(0).commonAncestorContainer)) ultimoRango = s.getRangeAt(0).cloneRange(); });
  // La cuenta atrás se refresca sola (sin estropear lo que se esté escribiendo)
  setInterval(function () {
    if (!instalada || $('#dlg').open || ['seguimiento', 'negociado'].indexOf(pref.vista) < 0) return;
    var a = document.activeElement;
    if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
    render();
  }, 60000);
  var q = new URLSearchParams(location.search);
  if (q.get('neg')) { pref.neg = q.get('neg'); pref.vista = 'negociado'; }

  cargar();
