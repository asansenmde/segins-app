<title>Puntos de Situación · SUIGESUR</title>
<style>
  :root {
    --bg: #f3f5f8; --surface: #fff; --surface-2: #e8eef6; --text: #1b2430; --muted: #5a6575; --line: #d5dce6;
    --brand: #1b3a5c; --on-brand: #fff; --oro: #b8962e;
    --ok: #2e7d32; --ok-bg: #dcefdc; --warn: #9a5b00; --warn-bg: #fdebc8; --bad: #b71c1c; --bad-bg: #fbdada;
    --info: #1d4f91; --info-bg: #dde8f7; --na: #555; --na-bg: #e7e7e7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .oficial { background: #fff; border-bottom: 1px solid var(--line); }
  .oficial > div { max-width: 1180px; margin: 0 auto; padding: 6px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; }
  .oficial .izq { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .oficial .minisdef { height: 46px; }
  .oficial .org { flex: 1; font-size: .78rem; color: #333; letter-spacing: .06em; line-height: 1.3; border-left: 1px solid #bbb; padding-left: 12px; }
  .oficial .org b { font-size: .86rem; letter-spacing: .08em; }
  .oficial .uso { height: 28px; }
  .top { position: sticky; top: 0; z-index: 5; background: linear-gradient(90deg, #102840, var(--brand) 55%, #24507a); color: var(--on-brand); border-bottom: 4px solid var(--oro); box-shadow: 0 2px 6px rgba(0,0,0,.25); }
  .top > div { max-width: 1180px; margin: 0 auto; padding: 8px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .top .tit { flex: 1; min-width: 220px; }
  .top h1 { margin: 0; font-size: 1.2rem; letter-spacing: .05em; font-weight: 800; }
  .top .sub { display: block; font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: #e6d9a8; }
  .top .estado { font-size: .8rem; opacity: .9; }
  .top button { background: rgba(255,255,255,.12); color: inherit; border: 1px solid rgba(232,215,160,.5); }
  .quien { font-size: .85rem; font-weight: 700; background: rgba(255,255,255,.14); border: 1px solid rgba(232,215,160,.5); border-radius: 9px; padding: 5px 10px; }
  .banda-pruebas { background: #b71c1c; color: #fff; text-align: center; font-weight: 800; padding: 6px; letter-spacing: .04em; }
  @media (max-width: 600px) { .oficial .org { display: none; } .oficial > div { grid-template-columns: auto 1fr; } .oficial .uso { justify-self: end; } .top h1 { font-size: 1rem; } }
  main { max-width: 1180px; margin: 0 auto; padding: 0 16px 60px; }
  nav.tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 12px; margin: 12px 0; flex-wrap: wrap; }
  nav.tabs a { flex: 1; text-align: center; padding: 8px 6px; border-radius: 9px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: .9rem; cursor: pointer; min-width: 110px; }
  nav.tabs a.on { background: var(--surface); color: var(--brand); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .muted { color: var(--muted); } .small { font-size: .85rem; }
  h2.sec, .sec { margin: 16px 0 6px; font-size: .82rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; font-weight: 700; }
  button, .btn { font: inherit; font-weight: 600; padding: 7px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--text); cursor: pointer; text-decoration: none; display: inline-block; }
  button:disabled { opacity: .5; cursor: default; }
  .prim { background: var(--brand) !important; color: #fff !important; border-color: var(--brand) !important; }
  .rojo { color: var(--bad); border-color: var(--bad); }
  select, input, textarea { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--text); width: 100%; }
  label.lbl { display: block; font-size: .8rem; font-weight: 600; color: var(--muted); margin: 8px 0 3px; }
  label.check { display: inline-flex; gap: 6px; align-items: center; margin: 4px 14px 4px 0; font-size: .9rem; }
  label.check input { width: auto; }
  .fila { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .fila > .crece { flex: 1; min-width: 200px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
  .grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px; text-align: center; }
  .kpi b { display: block; font-size: 1.6rem; } .kpi.ok b { color: var(--ok); } .kpi.bad b { color: var(--bad); }
  @media (max-width: 560px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
  .badge { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: .75rem; font-weight: 700; white-space: nowrap; }
  .badge.ok { background: var(--ok-bg); color: var(--ok); } .badge.warn { background: var(--warn-bg); color: var(--warn); }
  .badge.bad { background: var(--bad-bg); color: var(--bad); } .badge.info { background: var(--info-bg); color: var(--info); }
  .badge.none { background: var(--na-bg); color: var(--na); } .badge.oro { background: #f6eed2; color: #6d5410; }
  .neg { border-left: 5px solid var(--line); } .neg.v { border-left-color: var(--ok); } .neg.s { border-left-color: #999; } .neg.r { border-left-color: var(--bad); }
  .bar { height: 10px; background: var(--surface-2); border-radius: 9px; overflow: hidden; flex: 1; } .bar i { display: block; height: 100%; background: var(--brand); }
  .ent { border-left: 5px solid var(--info); display: flex; gap: 10px; }
  .ent.alta { border-left-color: var(--bad); } .ent .asa { color: var(--muted); cursor: grab; font-size: 1.2rem; user-select: none; }
  .ent.arrastrando { opacity: .4; } .ent.sobre { outline: 2px dashed var(--brand); }
  .ent .cuerpo { flex: 1; min-width: 0; }
  .texto { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 4px; }
  .texto figure, .editor figure { margin: 8px 0; display: block; }
  .texto figure img { max-width: 100%; border: 1px solid var(--line); border-radius: 6px; display: block; }
  .texto figcaption { font-size: .8rem; font-style: italic; color: var(--muted); }
  .editor { min-height: 160px; border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: #fff; white-space: pre-wrap; overflow-wrap: anywhere; outline: none; }
  .editor:focus { border-color: var(--brand); }
  .editor { resize: vertical; overflow: auto; }
  dialog.grande { width: 100vw; max-width: 100vw; height: 100vh; max-height: 100vh; border-radius: 0; }
  dialog.grande .editor { min-height: calc(100vh - 330px); font-size: 1.05rem; }
  .editor.sobre { background: var(--info-bg); }
  .editor figure { border: 1px dashed var(--line); border-radius: 8px; padding: 6px; background: #fafbfc; }
  .editor figure img { max-width: 100%; display: block; border-radius: 6px; }
  .editor figcaption { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
  .editor figcaption input { flex: 1; min-width: 160px; padding: 5px 8px; font-size: .85rem; }
  .editor figcaption button { padding: 4px 9px; font-size: .8rem; }
  .barra-ed { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; }
  .aviso { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
  .okmsg { background: var(--ok-bg); color: var(--ok); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
  .error { background: var(--bad-bg); color: var(--bad); border-radius: 10px; padding: 10px 12px; margin: 10px 0; font-weight: 600; }
  .bloqueo { background: #2b2b2b; color: #fff; border-radius: 10px; padding: 10px 14px; margin: 10px 0; }
  .acciones { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  .acciones .sep { flex: 1; }
  .chip { display: inline-flex; gap: 4px; align-items: center; background: var(--surface-2); border-radius: 999px; padding: 2px 4px 2px 10px; margin: 2px; font-size: .82rem; }
  .chip button { border: 0; background: transparent; padding: 0 6px; color: var(--bad); }
  .sugs { border: 1px solid var(--line); border-radius: 10px; margin-top: 4px; max-height: 220px; overflow: auto; background: #fff; }
  .sugs button { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; font-weight: 400; }
  .sugs button:hover { background: var(--surface-2); }
  table.t { width: 100%; border-collapse: collapse; font-size: .88rem; }
  table.t th { background: var(--brand); color: #fff; text-align: left; padding: 6px; }
  table.t td { border-bottom: 1px solid var(--line); padding: 6px; vertical-align: top; }
  .log div { font-size: .88rem; margin: 2px 0; }
  dialog { width: min(820px, calc(100vw - 16px)); max-height: calc(100vh - 16px); border: 0; border-radius: 14px; padding: 0; }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .dh { position: sticky; top: 0; z-index: 2; background: var(--brand); color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; gap: 10px; align-items: center; border-bottom: 3px solid var(--oro); }
  .dh h2 { margin: 0; font-size: 1.05rem; }
  .db { padding: 12px 16px 16px; }
  
  .hoja { background: #fff; max-width: 800px; margin: 10px auto; padding: 28px 40px; box-shadow: 0 2px 10px rgba(0,0,0,.15); font-family: Arial, Helvetica, sans-serif; font-size: 13px; color: #111; }
  .hoja .sup { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding-bottom: 4px; }
  .hoja .sup .m { height: 48px; } .hoja .sup .u { height: 26px; } .hoja .sup .r { text-align: right; font-weight: 700; font-size: 12px; }
  .hoja .banda { background: #1b3a5c; color: #fff; border-bottom: 3px solid #b8962e; padding: 6px 10px; }
  .hoja .banda .o { font-size: 10px; letter-spacing: 1.5px; color: #e6d9a8; } .hoja .banda .t { font-size: 17px; font-weight: 700; } .hoja .banda .f { font-size: 12px; }
  .hoja .subt { text-align: center; margin: 6px 0 10px; font-size: 11.5px; color: #333; }
  .hoja h3 { color: #1b3a5c; border-bottom: 1px solid #b8962e; font-size: 14px; margin: 16px 0 6px; padding-bottom: 2px; }
  .hoja .item { margin: 4px 0 8px 18px; } .hoja .item > b:first-child::before { content: '• '; margin-left: -12px; }
  .hoja figure { text-align: center; margin: 8px 0; } .hoja figure img { max-width: 100%; } .hoja figcaption { font-size: 11px; font-style: italic; }
  .hoja .firma { margin: 26px 0 0 auto; width: 50%; border-top: 1px solid #555; padding-top: 4px; text-align: center; font-size: 12px; }
  .hoja .pie { text-align: center; font-size: 10px; color: #555; border-top: 1px solid #ccc; margin-top: 18px; padding-top: 4px; }
  .hoja .pie img { height: 14px; }
  .autor { max-width: 1180px; margin: -40px auto 0; padding: 12px 16px 24px; text-align: center; font-size: .78rem; color: var(--muted); border-top: 1px solid var(--line); }
  @media print { .autor { display: none; } }
</style>
</head>
