<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1010" viewBox="0 0 1000 1010"><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3A4452"/></marker><marker id="fi" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 Z" fill="#3A4452"/></marker></defs><rect x="15" y="20" width="170" height="44" rx="6" fill="#5A6270"/><text x="100" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">Usuario</text><line x1="100" y1="64" x2="100" y2="960" stroke="#9AA3AF" stroke-width="1.3" stroke-dasharray="6 5"/><rect x="215" y="20" width="170" height="44" rx="6" fill="#13294B"/><text x="300" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">Visor SENDERO</text><line x1="300" y1="64" x2="300" y2="960" stroke="#9AA3AF" stroke-width="1.3" stroke-dasharray="6 5"/><rect x="415" y="20" width="170" height="44" rx="6" fill="#8A6A12"/><text x="500" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">Página de acceso</text><line x1="500" y1="64" x2="500" y2="960" stroke="#9AA3AF" stroke-width="1.3" stroke-dasharray="6 5"/><rect x="615" y="20" width="170" height="44" rx="6" fill="#2E5A3A"/><text x="700" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">MENSADEF</text><line x1="700" y1="64" x2="700" y2="960" stroke="#9AA3AF" stroke-width="1.3" stroke-dasharray="6 5"/><rect x="815" y="20" width="170" height="44" rx="6" fill="#2E5A3A"/><text x="900" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">mensadefapi</text><line x1="900" y1="64" x2="900" y2="960" stroke="#9AA3AF" stroke-width="1.3" stroke-dasharray="6 5"/><line x1="100" y1="100" x2="294" y2="100" stroke="#3A4452" stroke-width="1.6" marker-end="url(#ff)"/><rect x="104" y="79" width="146.6" height="18" fill="#FFFFFF"/><text x="108" y="93" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A37">1. Pulsar el favorito</text><path d="M300,152 L350,152 L350,174 L304,174" fill="none" stroke="#3A4452" stroke-width="1.6" marker-end="url(#ff)"/><text x="358" y="167" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A37">2. Mira el dominio (Landing / Portafirmas)</text><line x1="300" y1="204" x2="494" y2="204" stroke="#3A4452" stroke-width="1.6" marker-end="url(#ff)"/><rect x="304" y="183" width="258.79999999999995" height="18" fill="#FFFFFF"/><text x="308" y="197" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A37">3. iframe #comprobar (versión, ámbito)</text><path d="M500,256 L550,256 L550,278 L504,278" fill="none" stroke="#3A4452" stroke-width="1.6" marker-end="url(#ff)"/><text x="558" y="271" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A37">4. Lee sus listas</text><line x1="500" y1="308" x2="306" y2="308" stroke="#3A4452" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#ff)"/><rect x="304" y="287" width="423.79999999999995" height="18" fill="#FFFFFF"/><text x="308" y="301" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A37">5. postMessage: ok, regla, versión, caducidad, UrlMeta, UrlPsit</text><line x1="300" y1="360" x2="694" y2="360" stroke="#3A4452" stroke-width="1.6" marker-end="url(#ff)"/><rect x="364.0" y="339" width="272.0" height="18" fill="#FFFFFF"/><text x="500.0" y="353" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A37">6. GET /ambito/X/_api/web (¿hay sesión?)</text><rect x="230" y="390" width="560" height="112" fill="none" stroke="#B8922A" stroke-width="1.5"/><rect x="230" y="390" width="58" height="20" fill="#B8922A"/><text x="238" y="405" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#FFFFFF">alt</text><text x="296" y="405" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#5A6270">[desde la portada]</text><line x1="300" y1="436" x2="694" y2="436" stroke="#3A4452" stroke-width="1.6" marker-end="url(#ff)"/><rect x="340.9" y="415" width="318.2" height="18" fill="#FFFFFF"/><text x="500.0" y="429" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A37">7. Sin sesión: inicio de sesión en marco oculto</text><line x1="300" y1="488" x2="694" y2="488" stroke="#3A4452" stroke-width="1.6" marker-end="url(#ff)"/><rect x="334.3" y="467" width="331.4" height="18" fill="#FFFFFF"/><text x="500.0" y="481" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A37">8. Página del ámbito en marco oculto (hasta 45 s)</text><line x1="700" y1="548" x2="306" y2="548" stroke="#3A4452" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#ff)"/><rect x="317.8" y="527" width="364.4" height="18" fill="#FFFFFF"/><text x="500.0" y="541" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A37">9. Número de usuario, colección y consulta de la clave</text><line x1="300" y1="600" x2="894" y2="600" stroke="#3A4452" stroke-width="1.6" marker-end="url(#ff)"/><rect x="516.8" y="579" width="166.39999999999998" height="18" fill="#FFFFFF"/><text x="600.0" y="593" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A37">10. usuario/ValidateUser</text><line x1="900" y1="652" x2="306" y2="652" stroke="#3A4452" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#ff)"/><rect x="437.6" y="631" width="324.79999999999995" height="18" fill="#FFFFFF"/><text x="600.0" y="645" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A37">11. Cabeceras IdUsuario y User → passcode / user</text><line x1="300" y1="704" x2="894" y2="704" stroke="#3A4452" stroke-width="1.6" marker-end="url(#ff)"/><rect x="513.5" y="683" width="173.0" height="18" fill="#FFFFFF"/><text x="600.0" y="697" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A37">12. ambito/UsuarioCelulas</text><line x1="300" y1="756" x2="894" y2="756" stroke="#3A4452" stroke-width="1.6" marker-end="url(#ff)"/><rect x="394.70000000000005" y="735" width="410.59999999999997" height="18" fill="#FFFFFF"/><text x="600.0" y="749" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A37">13. buzon/ObtenerBuzonCelula × N (6 a la vez, 100 por página)</text><line x1="300" y1="808" x2="106" y2="808" stroke="#3A4452" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#ff)"/><rect x="104" y="787" width="311.59999999999997" height="18" fill="#FFFFFF"/><text x="108" y="801" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A37">14. Lista progresiva (como mucho cada segundo)</text><line x1="100" y1="860" x2="294" y2="860" stroke="#3A4452" stroke-width="1.6" marker-end="url(#ff)"/><rect x="104" y="839" width="140.0" height="18" fill="#FFFFFF"/><text x="108" y="853" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A37">15. Abrir un mensaje</text><line x1="300" y1="912" x2="894" y2="912" stroke="#3A4452" stroke-width="1.6" marker-end="url(#ff)"/><rect x="414.5" y="891" width="371.0" height="18" fill="#FFFFFF"/><text x="600.0" y="905" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A37">16. mensaje/ObtenerCuerpo + PUT BuzonCelulaMensajeLeido</text><rect x="30" y="976" width="28" height="18" rx="3" fill="#E3EAF5" stroke="#13294B" stroke-width="1.4"/><text x="66" y="990" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5A6270">Petición</text><line x1="220" y1="985" x2="248" y2="985" stroke="#3A4452" stroke-width="1.7" stroke-dasharray="7 5"/><text x="256" y="990" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5A6270">Respuesta</text></svg>