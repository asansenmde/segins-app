<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mensajes MENSADEF</title>
<style>
  :root { --bg: #f4f5f0; --card: #fff; --text: #1f261f; --muted: #5f685f; --line: #d9ddd3; --brand: #3b4a2f; --soft: #eef1ea; --ok: #2e7d32; --okbg: #dcefdc; --bad: #b71c1c; --badbg: #fbdada; --sel: #fff8e1; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--brand); color: #fff; padding: 10px 16px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 1.15rem; margin: 0; }
  header .muted { color: #d6dccf; }
  main { max-width: 1400px; margin: 0 auto; padding: 12px 16px 40px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 10px 0; }
  .muted { color: var(--muted); font-size: .88rem; }
  .bad { background: var(--badbg); color: var(--bad); font-weight: 600; padding: 8px 10px; border-radius: 8px; }
  .fila { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
  .fila label { display: flex; flex-direction: column; gap: 2px; font-size: .8rem; color: var(--muted); font-weight: 600; }
  .fila label.check { flex-direction: row; align-items: center; gap: 6px; padding-bottom: 8px; }
  input, select { font: inherit; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--text); min-width: 0; }
  input[type=search] { width: 260px; }
  select { max-width: 220px; }
  button { font: inherit; font-weight: 600; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: #fff; cursor: pointer; color: var(--text); }
  button.prim { background: var(--brand); color: #fff; border-color: var(--brand); }
  button:disabled { opacity: .5; cursor: default; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .chip { font-size: .78rem; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--soft); border: 1px solid var(--line); cursor: pointer; }
  .chip.on { background: var(--brand); color: #fff; border-color: var(--brand); }
  .tabla { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .86rem; }
  th, td { text-align: left; padding: 6px 7px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { background: var(--soft); position: sticky; top: 0; cursor: pointer; white-space: nowrap; user-select: none; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #f7f8f4; }
  tbody tr.sel { background: var(--sel); }
  td.asunto { min-width: 280px; }
  td.fecha, td.nowrap { white-space: nowrap; }
  .tag { display: inline-block; font-size: .72rem; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: #dde8f7; color: #1d4f91; white-space: nowrap; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
  @media (min-width: 1100px) { .layout.detalle-abierto { grid-template-columns: minmax(0, 1fr) 440px; } }
  #detalle { position: sticky; top: 10px; align-self: start; max-height: calc(100vh - 20px); overflow: auto; }
  #detalle h2 { font-size: 1rem; margin: 0 0 8px; }
  dl { display: grid; grid-template-columns: 140px 1fr; gap: 3px 10px; margin: 0; font-size: .86rem; }
  dt { color: var(--muted); font-weight: 600; }
  dd { margin: 0; overflow-wrap: anywhere; }
  .cuerpo { white-space: pre-wrap; background: var(--soft); padding: 10px; border-radius: 8px; font-size: .86rem; margin-top: 8px; overflow-wrap: anywhere; }
  .acciones { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
  a { color: #1d4f91; }
  .barra { height: 4px; background: var(--soft); border-radius: 4px; overflow: hidden; margin-top: 6px; }
  .barra div { height: 100%; width: 0; background: var(--brand); transition: width .2s; }
</style>
</head>
<body>
<header><h1>Mensajes MENSADEF</h1><span class="muted" id="quien"></span></header>
<main>
  <noscript><div class="card bad">El navegador no ejecuta el código de esta página.</div></noscript>
  <div class="card" id="aviso" hidden></div>

  <div class="card">
    <div class="fila">
      <label>Desde<input type="date" id="desde"></label>
      <label>Hasta<input type="date" id="hasta"></label>
      <button type="button" data-dias="0">Hoy</button>
      <button type="button" data-dias="2">3 días</button>
      <button type="button" data-dias="6">7 días</button>
      <button type="button" data-dias="29">30 días</button>
      <label class="check"><input type="checkbox" id="historicas"> Incluir listas históricas (SMDMDMensajes2026…)</label>
      <button type="button" class="prim" id="cargar">Cargar</button>
    </div>
    <div class="muted" id="estado">Preparando…</div>
    <div class="barra"><div id="progreso"></div></div>
  </div>

  <div class="card" id="filtros" hidden>
    <div class="fila">
      <label>Buscar<input type="search" id="buscar" placeholder="Asunto, autoridad, referencia, expediente…"></label>
      <label>Tipo<select id="fTipo"></select></label>
      <label>Estado<select id="fEstado"></select></label>
      <label>Canal<select id="fCanal"></select></label>
      <label>Órgano<select id="fOrgano"></select></label>
      <label>Autoridad<select id="fAutoridad"></select></label>
      <label>Negociado / sitio<select id="fSitio"></select></label>
      <label class="check"><input type="checkbox" id="fAdjuntos"> Con adjuntos</label>
      <label class="check"><input type="checkbox" id="fBorrador"> Ocultar borradores</label>
      <button type="button" id="limpiar">Quitar filtros</button>
      <button type="button" id="csv">Exportar CSV</button>
    </div>
    <div class="fila" id="masFiltros" style="margin-top:8px"></div>
    <div class="chips" id="chips"></div>
    <p class="muted" style="margin:6px 0 0">Columnas de MENSADEF: <span id="nColumnas">—</span> · <a href="#" id="estructura">Ver estructura (sin contenido) para enviársela a quien te ayuda</a></p>
    <div id="cajaEstructura" hidden></div>
  </div>

  <div class="layout" id="layout">
    <div class="card tabla" id="lista" hidden></div>
    <div class="card" id="detalle" hidden></div>
  </div>
</main>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var lista = function (x) { return !x ? [] : Array.isArray(x) ? x : (x.results || x.value || []); };
  // Copia de pruebas (marcador «Mensajes MENSADEF (pruebas)», generado con PRUEBAS = true): guarda aparte su memoria
  // (la dirección de la página de Tareas de pruebas y los mensajes pasados) y lleva una banda roja
  var PRUEBAS = false;
  var MEMORIA = PRUEBAS ? 'visorMensadefPruebas.' : 'visorMensadef.';
  if (PRUEBAS) {
    document.title = 'PRUEBAS · ' + document.title;
    var bandaP = document.createElement('div');
    bandaP.style.cssText = 'background:#b71c1c;color:#fff;text-align:center;font-weight:800;padding:6px 10px';
    bandaP.textContent = '⚠ VERSIÓN DE PRUEBAS · «Crear tarea» abre la página de Tareas de pruebas (tareas-nlt-colabora-pruebas.html)';
    document.body.insertBefore(bandaP, document.body.firstChild);
  }
  var guardar = function (k, v) { try { localStorage.setItem(MEMORIA + k, JSON.stringify(v)); } catch (e) { /* sin memoria */ } };
  var leer = function (k, d) { try { var v = localStorage.getItem(MEMORIA + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };

  if (!window.fetch || !window.Promise || document.documentMode) {
    $('aviso').hidden = false; $('aviso').innerHTML = '<div class="bad">Ábrelo en Microsoft Edge o Chrome normal (no en modo Internet Explorer).</div>'; return;
  }
  if (location.protocol === 'file:' || !location.hostname) {
    $('aviso').hidden = false;
    $('aviso').innerHTML = '<div class="bad">Esta página se ha abierto desde tu ordenador. Úsala con el marcador «Mensajes MENSADEF» estando en MENSADEF.</div>';
    $('estado').textContent = ''; return;
  }

  // Columnas que se leen de cada mensaje (el cuerpo se pide aparte, al abrir uno)
  var CAMPOS = ['ID', 'FileSystemObjectType', 'Title', 'Created', 'Attachments', 'MensajeId', 'MensajeAsunto', 'MensajeFecha', 'MensajeAutoridad', 'MensajeNombre_Autoridad',
    'MensajeCanal', 'MensajeEstado', 'MensajeTipo_es', 'MensajeNivel_1_Organico', 'MensajeNivel_2_Organico', 'MensajeNivel_3_Organico', 'MensajeNivel_4_Organico',
    'MensajeNum_referencia', 'MensajeSu_referencia', 'MensajeNum_expediente', 'MensajeUrlCarpeta', 'MensajeDireccion', 'MensajeCorreoElectronico', 'MensajeCSV'];
  var ETIQUETAS = { MensajeFecha: 'Fecha', MensajeTipo_es: 'Tipo', MensajeEstado: 'Estado', MensajeCanal: 'Canal', MensajeAutoridad: 'Autoridad', MensajeNombre_Autoridad: 'Nombre autoridad',
    MensajeNivel_1_Organico: 'Órgano (nivel 1)', MensajeNivel_2_Organico: 'Órgano (nivel 2)', MensajeNivel_3_Organico: 'Órgano (nivel 3)', MensajeNivel_4_Organico: 'Órgano (nivel 4)',
    MensajeNum_referencia: 'N.º referencia', MensajeSu_referencia: 'Su referencia', MensajeNum_expediente: 'N.º expediente', MensajeId: 'Id. mensaje', MensajeDireccion: 'Dirección',
    MensajeCorreoElectronico: 'Correo electrónico', MensajeCSV: 'CSV', MensajeUrlCarpeta: 'Carpeta de documentos' };

  // REST de SharePoint: JSON ligero y, si el servidor no lo admite, «verbose». Solo GET.
  function pedir(url) {
    var una = function (accept) {
      return fetch(url, { credentials: 'same-origin', headers: { Accept: accept } }).then(function (r) {
        if (!r.ok) { var e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
        return r.json();
      });
    };
    return una('application/json;odata=nometadata').catch(function (e) {
      if ([400, 406, 415].indexOf(e.status) < 0) throw e;
      return una('application/json;odata=verbose').then(function (d) {
        d = d.d || d;
        return d.results ? { value: d.results, 'odata.nextLink': d.__next } : d;
      });
    });
  }
  var api = function (ruta, base) { return pedir(base + '/_api/' + ruta); };
  function todas(url, acumulado) {
    acumulado = acumulado || [];
    return pedir(url).then(function (d) {
      acumulado = acumulado.concat(lista(d.value));
      var sig = d['odata.nextLink'] || d.__next;
      return sig ? todas(sig, acumulado) : acumulado;
    });
  }

  function webDe(ruta) {
    var partes = ruta.split('/').filter(Boolean), cand = [];
    for (var i = partes.length; i >= 0; i--) cand.push(location.origin + (i ? '/' + partes.slice(0, i).join('/') : ''));
    var probar = function (n) {
      if (n >= cand.length) return Promise.reject(new Error('No se encontró el sitio de SharePoint'));
      return api('web?$select=Url,Title', cand[n]).then(function (w) { return { url: w.Url || cand[n], titulo: w.Title }; }).catch(function () { return probar(n + 1); });
    };
    return probar(0);
  }

  var dosCifras = function (n) { return (n < 10 ? '0' : '') + n; };
  var iso = function (d) { return d.getFullYear() + '-' + dosCifras(d.getMonth() + 1) + '-' + dosCifras(d.getDate()); };
  var fechaDe = function (m) { var f = m.MensajeFecha || m.Created; return f ? new Date(f) : null; };
  var verFecha = function (d) { return d ? dosCifras(d.getDate()) + '/' + dosCifras(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + dosCifras(d.getHours()) + ':' + dosCifras(d.getMinutes()) : ''; };
  var organo = function (m) { return [m.MensajeNivel_1_Organico, m.MensajeNivel_2_Organico].filter(Boolean).join(' › '); };
  var autoridad = function (m) { return m.MensajeNombre_Autoridad || m.MensajeAutoridad || ''; };
  var texto = function (html) {
    if (!html) return '';
    if (!/<[a-z][\s\S]*>/i.test(html)) return html;
    var limpio = String(html).replace(/<br\s*\/?>/gi, '\n').replace(/<\/(p|div|li|tr|h\d)>/gi, '\n');
    var d = new DOMParser().parseFromString(limpio, 'text/html');
    return (d.body.textContent || '').replace(/\n{3,}/g, '\n\n').trim();
  };

  var web = null, listasDia = [], listasHist = [], mensajes = [], filtrados = [], orden = { campo: 'fecha', desc: true }, abierto = null, mostrar = 300;
  // Mensajes ya pasados a Tareas Colabora desde este navegador (solo el identificador y la fecha)
  var enviados = leer('enviados', {});
  var claveMensaje = function (m) { return m.MensajeId || (m._lista.titulo + ':' + m.ID); };

  // Fechas por defecto: los últimos 3 días (o lo último que se usó)
  var hoy = new Date();
  $('desde').value = leer('desde', iso(new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() - 2)));
  $('hasta').value = leer('hasta', iso(hoy));
  $('historicas').checked = !!leer('historicas', false);
  Array.prototype.forEach.call(document.querySelectorAll('[data-dias]'), function (b) {
    b.addEventListener('click', function () {
      var n = +b.getAttribute('data-dias'), h = new Date();
      $('hasta').value = iso(h); $('desde').value = iso(new Date(h.getFullYear(), h.getMonth(), h.getDate() - n)); cargar();
    });
  });

  webDe(location.pathname).then(function (w) {
    web = w;
    api('web/currentuser?$select=Title', w.url).then(function (u) { $('quien').textContent = (w.titulo || '') + ' · ' + u.Title; }).catch(function () { $('quien').textContent = w.titulo || ''; });
    $('estado').textContent = 'Buscando las listas de mensajes…';
    return buscarListas(w);
  }).then(function (r) {
    listasDia.sort(function (a, b) { return a.dia < b.dia ? -1 : 1; });
    revisadosTodos = r.revisados;
    if (!listasDia.length && !listasHist.length) {
      var e = new Error('No encuentro listas «SMDMDMensajes…». He revisado ' + r.revisados.length + ' sitio' + (r.revisados.length === 1 ? '' : 's') + ' de MENSADEF (con sus listas ocultas y subsitios): ' +
        r.revisados.map(function (x) { return x.ruta + ' (' + (x.error ? x.error : x.listas + ' listas') + ')'; }).join(', ') + '.');
      e.ayuda = 'Pulsa el favorito «Prueba MENSADEF» en esta misma página y dime lo que resume (solo nombres de listas y recuentos, sin contenido) para localizar dónde guarda los mensajes tu célula.';
      throw e;
    }
    $('estado').textContent = listasDia.length + ' listas diarias de mensajes' + (listasDia.length ? ' (del ' + listasDia[0].dia.split('-').reverse().join('/') + ' al ' + listasDia[listasDia.length - 1].dia.split('-').reverse().join('/') + ')' : '') +
      ' en ' + sitios.length + (sitios.length === 1 ? ' sitio' : ' sitios') + ': ' + sitios.map(function (x) { return x.titulo; }).join(', ') + '.';
    return cargar();
  }).catch(function (e) {
    $('aviso').hidden = false; $('aviso').innerHTML = '<div class="bad">' + esc(e.message || e) + '</div>' + (e.ayuda ? '<p class="muted">' + esc(e.ayuda) + '</p>' : ''); $('estado').textContent = '';
  });

  // Busca TODAS las listas de mensajes a las que tiene acceso el usuario (cada negociado o célula puede tener las suyas):
  // el sitio de la página (también las listas ocultas), el del ámbito (/ambito/XXX), el raíz y sus subsitios (hasta 3
  // niveles y 100 sitios) y, con la búsqueda de SharePoint, los sitios de otras colecciones. Cada lista recuerda su sitio.
  var sitios = [], revisadosTodos = [];
  function buscarListas(w) {
    var revisados = [], vistos = {};
    var ruta = function (u) { return new URL(u, location.origin).pathname.replace(/\/$/, '') || '/'; };
    var revisar = function (url) {
      var k = ruta(url);
      if (vistos[k] || revisados.length >= 100) return Promise.resolve([]);
      vistos[k] = 1;
      var x = { ruta: k, url: url, titulo: '', listas: 0, mensajes: 0, total: 0 }; revisados.push(x);
      return Promise.all([
        todas(url + '/_api/web/lists?$select=Id,Title,ItemCount,RootFolder/ServerRelativeUrl&$expand=RootFolder&$top=5000'),
        api('web?$select=Title', url).catch(function () { return {}; })
      ]).then(function (r) {
        x.listas = r[0].length; x.titulo = r[1].Title || k;
        r[0].forEach(function (l) {
          var m = /^SMDMDMensajes_(\d{4})(\d{2})(\d{2})$/.exec(l.Title), raiz = l.RootFolder && l.RootFolder.ServerRelativeUrl;
          var base = { id: l.Id, web: url, sitio: x, titulo: l.Title, total: l.ItemCount, raiz: raiz };
          if (m) { listasDia.push(Object.assign(base, { dia: m[1] + '-' + m[2] + '-' + m[3] })); x.mensajes++; x.total += l.ItemCount; }
          else if (/^SMDMDMensajes\d{5}(_\d+)?$/.test(l.Title)) { listasHist.push(base); x.mensajes++; x.total += l.ItemCount; }
        });
        return todas(url + '/_api/web/webs?$select=ServerRelativeUrl').then(function (ws) { return ws.map(function (s) { return location.origin + s.ServerRelativeUrl; }); }, function () { return []; });
      }, function (e) { x.error = e.status === 403 ? 'sin permiso' : (e.message || 'error'); return []; });
    };
    var porNiveles = function (inicio, nivel) {
      if (!inicio.length || nivel > 3) return Promise.resolve();
      return Promise.all(inicio.map(revisar)).then(function (subs) {
        return porNiveles([].concat.apply([], subs).filter(function (u) { return !vistos[ruta(u)]; }), nivel + 1);
      });
    };
    // Búsqueda de SharePoint: listas «SMDMDMensajes…» en cualquier sitio que el usuario pueda ver (si está activada)
    var buscador = function () {
      return pedir(w.url + "/_api/search/query?querytext='" + encodeURIComponent('SMDMDMensajes* contentclass:STS_List') + "'&selectproperties='SPWebUrl'&rowlimit=500&trimduplicates=false").then(function (d) {
        var q = d.query || d, filas = lista(q.PrimaryQueryResult && q.PrimaryQueryResult.RelevantResults && q.PrimaryQueryResult.RelevantResults.Table && q.PrimaryQueryResult.RelevantResults.Table.Rows);
        var webs = {};
        filas.forEach(function (f) { lista(f.Cells).forEach(function (c) { if (c.Key === 'SPWebUrl' && c.Value && c.Value.indexOf(location.origin) === 0) webs[c.Value] = 1; }); });
        return Object.keys(webs);
      }).catch(function () { return []; });
    };
    var ambito = /^\/ambito\/[^/]+/i.exec(location.pathname);
    return api('site/rootweb?$select=Url', w.url).then(function (r) { return r.Url; }, function () { return ''; }).then(function (raizSitio) {
      var inicio = [w.url];
      if (ambito) inicio.push(location.origin + ambito[0]);
      if (raizSitio) inicio.push(raizSitio);
      return porNiveles(inicio, 0);
    }).then(buscador).then(function (webs) {
      return porNiveles(webs.filter(function (u) { return !vistos[ruta(u)]; }), 3);
    }).then(function () { sitios = revisados.filter(function (x) { return x.mensajes; }); return { revisados: revisados }; });
  }

  $('cargar').addEventListener('click', function () { cargar(); });

  // Columnas de MENSADEF: además de las conocidas (CAMPOS) se leen todas las propias de cada lista de mensajes (las de
  // MENSADEF, no las de SharePoint), con su nombre visible; las de persona o búsqueda se leen por su nombre (Title).
  // El cuerpo y los textos largos no se piden en la carga masiva.
  var EXTRA = {}, TIPOS_EXTRA = /^(Text|Choice|MultiChoice|Number|Integer|Boolean|DateTime|User|UserMulti|Lookup|LookupMulti|Currency)$/;
  var NO_LEER = { MensajeCuerpo: 1, ContentType: 1, Attachments: 1, _UIVersionString: 1 };
  function camposDe(l) {
    if (l.campos) return Promise.resolve(l.campos);
    return api("web/lists(guid'" + l.id + "')/fields?$select=InternalName,Title,TypeAsString,Hidden,FromBaseType,Sealed", l.web).then(function (d) {
      var hay = {}, select = [], expand = [];
      lista(d.value).forEach(function (f) {
        hay[f.InternalName] = 1;
        if (CAMPOS.indexOf(f.InternalName) >= 0 || NO_LEER[f.InternalName] || f.Hidden || f.FromBaseType || !TIPOS_EXTRA.test(f.TypeAsString || '')) return;
        if (Object.keys(EXTRA).length >= 60 && !EXTRA[f.InternalName]) return;
        EXTRA[f.InternalName] = EXTRA[f.InternalName] || { titulo: f.Title || f.InternalName, tipo: f.TypeAsString };
        if (/^(User|UserMulti|Lookup|LookupMulti)$/.test(f.TypeAsString)) { select.push(f.InternalName + '/Title'); expand.push(f.InternalName); } else select.push(f.InternalName);
      });
      CAMPOS.forEach(function (c) { if (hay[c] || c === 'ID' || c === 'FileSystemObjectType') select.unshift(c); });
      l.campos = { hay: hay, select: select, expand: expand };
      return l.campos;
    }, function () { l.campos = { hay: { MensajeFecha: 1 }, select: CAMPOS.slice(), expand: [] }; return l.campos; });
  }
  // Valor de una columna como texto (persona, búsqueda, elección múltiple, fecha, sí/no)
  var comoTexto = function (v, tipo) {
    if (v == null || v === '') return '';
    if (Array.isArray(v) || v.results) return lista(v).map(function (x) { return comoTexto(x); }).filter(Boolean).join(', ');
    if (typeof v === 'object') return v.Title || '';
    if (tipo === 'Boolean') return v ? 'Sí' : 'No';
    if (tipo === 'DateTime') return verFecha(new Date(v));
    return String(v);
  };

  // Lee los mensajes de las listas del periodo, de 4 en 4
  function leerLista(l, filtro) {
    return camposDe(l).then(function (cf) {
      var fil = filtro && cf.hay.MensajeFecha ? '&$filter=' + encodeURIComponent(filtro) : '';
      var url = l.web + "/_api/web/lists(guid'" + l.id + "')/items?$select=" + cf.select.join(',') + (cf.expand.length ? '&$expand=' + cf.expand.join(',') : '') + '&$top=2000' + fil;

      .concat(revisadosTodos.map(function (x) { return '- ' + x.ruta + ' · ' + (x.error ? x.error : x.listas + ' listas, ' + x.mensajes + ' de mensajes (' + x.total + ' elementos), cargados ' + mensajes.filter(function (m) { return m._lista.sitio === x; }).length); }))
      .concat(['', 'COLUMNAS (nombre interno · nombre visible · tipo · valores distintos · mensajes con valor):'])
      .concat(cols.map(function (c) { var v = {}, n = 0; mensajes.forEach(function (m) { var x = c.f(m); if (x) { v[x] = 1; n++; } }); return '- ' + c.n + ' · ' + c.t + (c.tipo ? ' · ' + c.tipo : '') + ' · ' + Object.keys(v).length + ' · ' + n; }))
      .join('\n');
    $('cajaEstructura').hidden = false;
    $('cajaEstructura').innerHTML = '<textarea readonly style="width:100%;height:220px;font:12px monospace;margin-top:6px"></textarea><p class="muted">Solo rutas, nombres de columnas y recuentos: no incluye asuntos, nombres ni textos. <button type="button" id="copiarEstructura">Copiar</button></p>';
    $('cajaEstructura').querySelector('textarea').value = txt;
    $('copiarEstructura').addEventListener('click', function () { var b = this; (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(function () { b.textContent = 'Copiado ✓'; }, function () { $('cajaEstructura').querySelector('textarea').select(); }); });
  });

  // Exporta lo filtrado a CSV (se guarda en tu ordenador; no sale de él)
  $('csv').addEventListener('click', function () {
    var cols = [['Fecha', function (m) { return verFecha(fechaDe(m)); }], ['Tipo', 'MensajeTipo_es'], ['Estado', 'MensajeEstado'], ['Canal', 'MensajeCanal'], ['Autoridad', autoridad],
      ['Asunto', function (m) { return m._asunto; }], ['Referencia', 'MensajeNum_referencia'], ['Su referencia', 'MensajeSu_referencia'], ['Expediente', 'MensajeNum_expediente'], ['Órgano', organo], ['Adjuntos', function (m) { return m.Attachments ? 'sí' : ''; }],
      ['Pasado a Colabora', function (m) { return enviados[claveMensaje(m)] ? verFecha(new Date(enviados[claveMensaje(m)])) : ''; }], ['Sitio', sitioDe]]
      .concat(Object.keys(EXTRA).map(function (k) { return [EXTRA[k].titulo, function (m) { return m._x[k]; }]; }));
    var celda = function (v) { v = String(v == null ? '' : v); return /[";\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    var csv = '﻿' + cols.map(function (c) { return c[0]; }).join(';') + '\r\n' + filtrados.map(function (m) {
      return cols.map(function (c) { return celda(typeof c[1] === 'function' ? c[1](m) : m[c[1]]); }).join(';');
    }).join('\r\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = 'mensajes-' + $('desde').value + '_' + $('hasta').value + '.csv';
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  });
})();
</script>
