  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: #1c2a3a; font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
  .franja { background: var(--oro); border-bottom: 2px solid var(--oro2); color: var(--azul); text-align: center; padding: 6px 12px; font-weight: 800; letter-spacing: .08em; font-size: .85rem; }

  header.cab small { display: block; color: #c9d8ea; font-size: .78rem; letter-spacing: .04em; }

  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .card { background: #fff; border: 1px solid var(--linea); border-radius: 12px; padding: 14px 16px; margin: 0 0 14px; }

  button.prim { background: var(--azul); border-color: var(--azul); color: #fff; }
  button.verde { background: var(--ok); border-color: var(--ok); color: #fff; }
  button.rojo { background: #fff; border-color: var(--mal); color: var(--mal); }
  button:disabled { opacity: .55; cursor: default; }
  input, select, textarea { font: inherit; padding: 6px 8px; border: 1px solid #c9d4e3; border-radius: 8px; background: #fff; }
  textarea { width: 100%; min-height: 70px; }
  label { display: inline-flex; flex-direction: column; gap: 3px; font-size: .82rem; color: #5a6676; margin: 0 10px 8px 0; }
  .pestanas { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .pestanas button.on { background: var(--azul); color: #fff; border-color: var(--azul); }
  table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  th { text-align: left; font-size: .74rem; letter-spacing: .05em; text-transform: uppercase; color: #3b4a5f; background: #f4f6f1; padding: 7px 8px; }
  td { border-top: 1px solid #eef1f5; padding: 7px 8px; vertical-align: top; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .75rem; font-weight: 800; }
  .chip.Pendiente { background: #fdf0d5; color: #8a5a12; } .chip.Aprobada { background: #e3f1e6; color: var(--ok); } .chip.Denegada { background: #fde7e4; color: var(--mal); }
  .chip.amb { background: #dde8f7; color: var(--azul2); } .chip.per { background: #efe6f8; color: #4a2a78; } .chip.blo { background: #fde7e4; color: var(--mal); } .chip.off { background: #eceff3; color: #6b7280; }
  .fila-prep { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 8px 0; border-top: 1px solid #eef1f5; }
  .fila-prep:first-of-type { border-top: 0; }
  #toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--azul); color: #fff; padding: 9px 16px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.2); display: none; max-width: 90vw; z-index: 9; }
  .grande { font-size: 1.05rem; }
  .autor { text-align: center; font-size: .8rem; color: #5a6676; border-top: 1px solid var(--linea); padding: 12px 16px 22px; }
  @media print { .autor { display: none; } }
