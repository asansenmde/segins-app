<script>
(function () {
  'use strict';
  var VERSION = '2026-11-16 · 7';
  // Solo se contesta a SENDERO, que funciona en MENSADEF (el favorito escribe su página sobre la de MENSADEF)
  var ORIGEN_SENDERO = 'https://mensadef.mdef.es';
  var L_AUT = 'SENDERO Autorizados', L_SOL = 'SENDERO Solicitudes', GRUPO = 'SENDERO Administradores';
  var CAMPOS_AUT = [
    '<Field Type="Choice" Name="Tipo" StaticName="Tipo" DisplayName="Tipo" Format="Dropdown"><Default>Ámbito</Default><CHOICES><CHOICE>Ámbito</CHOICE><CHOICE>Persona</CHOICE><CHOICE>Bloqueo</CHOICE><CHOICE>Versión</CHOICE></CHOICES></Field>',
    '<Field Type="Boolean" Name="Activo" StaticName="Activo" DisplayName="Activo"><Default>1</Default></Field>',
    '<Field Type="Note" Name="Responsables" StaticName="Responsables" DisplayName="Responsables" NumLines="3" RichText="FALSE" />',
    '<Field Type="DateTime" Name="Hasta" StaticName="Hasta" DisplayName="Hasta" Format="DateOnly" />',
    '<Field Type="Note" Name="Nota" StaticName="Nota" DisplayName="Nota" NumLines="3" RichText="FALSE" />',
    '<Field Type="Note" Name="UrlMeta" StaticName="UrlMeta" DisplayName="Dirección de META" NumLines="2" RichText="FALSE" />',
    '<Field Type="Note" Name="UrlPsit" StaticName="UrlPsit" DisplayName="Dirección del Punto de Situación" NumLines="2" RichText="FALSE" />'];
  var urlValida = function (v) { return /^https:\/\/[^/]+\.mdef\.es\/\S+$/i.test(String(v || '').trim()); };
  // Pide las reglas con las direcciones de META y del PSIT; si esas columnas aún no existen (falta «Crear columnas»), sin ellas
  function leerReglas(sel, resto) {
    return todas(urlL(L_AUT) + '/items?$select=' + sel + ',UrlMeta,UrlPsit' + resto).catch(function (e) { if (e.status === 400) return todas(urlL(L_AUT) + '/items?$select=' + sel + resto); throw e; });
  }
  var CAMPOS_SOL = [
    '<Field Type="Text" Name="Correo" StaticName="Correo" DisplayName="Correo" />',
    '<Field Type="Text" Name="Ambito" StaticName="Ambito" DisplayName="Ámbito" />',
    '<Field Type="Note" Name="Motivo" StaticName="Motivo" DisplayName="Motivo" NumLines="4" RichText="FALSE" />',
    '<Field Type="Choice" Name="Estado" StaticName="Estado" DisplayName="Estado" Format="Dropdown"><Default>Pendiente</Default><CHOICES><CHOICE>Pendiente</CHOICE><CHOICE>Aprobada</CHOICE><CHOICE>Denegada</CHOICE></CHOICES></Field>',
    '<Field Type="Note" Name="Respuesta" StaticName="Respuesta" DisplayName="Respuesta" NumLines="3" RichText="FALSE" />',
    '<Field Type="Text" Name="RespondidoPor" StaticName="RespondidoPor" DisplayName="Respondido por" />',
    '<Field Type="Text" Name="VersionSendero" StaticName="VersionSendero" DisplayName="Versión de SENDERO" />',
    '<Field Type="Note" Name="Avisos" StaticName="Avisos" DisplayName="Avisos por correo" NumLines="4" RichText="FALSE" />'];
  // Avisos por correo: a quien administra SENDERO (además de los responsables del ámbito de cada solicitud)
  var AVISAR = ['asansen@et.mde.es'];

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var norm = function (s) { return String(s == null ? '' : s).trim().toLowerCase(); };
  var esCorreo = function (v) { return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(v || '').trim()); };
  var fecha = function (v) { if (!v) return ''; var d = new Date(v); return isNaN(d) ? '' : d.toLocaleDateString('es-ES'); };
  var hoy0 = function () { var d = new Date(); d.setHours(0, 0, 0, 0); return d; };
  try { $('verPie').textContent = 'versión ' + VERSION; } catch (e) { /* sin pie */ }
  function toast(t) { var x = $('toast'); x.textContent = t; x.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { x.style.display = 'none'; }, 4500); }

  // ---------- REST de SharePoint (receta de SHAREPOINT.md) ----------
  function api(url) {
    var pedir = function (accept) {
      return fetch(url, { credentials: 'same-origin', headers: { Accept: accept } }).then(function (r) {
        if (r.ok) return r.json();
        return r.text().then(function (txt) {
          var e = new Error('HTTP ' + r.status); e.status = r.status;
          try { var j = JSON.parse(txt); e.spMsg = (j.error && j.error.message && (j.error.message.value || j.error.message)) || (j['odata.error'] && j['odata.error'].message && j['odata.error'].message.value) || ''; } catch (x) { e.spMsg = ''; }
          if (e.spMsg) e.message += ' (' + e.spMsg + ')';
          throw e;
        });
      });
    };
    return pedir('application/json;odata=nometadata').catch(function (e) {
      if ([400, 406, 415].indexOf(e.status) < 0) throw e;
      return pedir('application/json;odata=verbose').then(function (d) {
        d = d.d || d;
        if (d.results) return { value: d.results, 'odata.nextLink': d.__next };
        return d;
      });
    });
  }
  var lista = function (v) { return v == null ? [] : Array.isArray(v) ? v : Array.isArray(v.results) ? v.results : []; };
  function todas(url) {
    var acc = [];
    var pag = function (u) { return api(u).then(function (d) { acc = acc.concat(lista(d.value)); var s = d['odata.nextLink'] || d['@odata.nextLink']; return s ? pag(s) : acc; }); };
    return pag(url);
  }
  var web = '';
  var urlL = function (t) { return web + "/_api/web/lists/getbytitle('" + encodeURIComponent(t.replace(/'/g, "''")) + "')"; };
  var lit = function (v) { return "'" + String(v).replace(/'/g, "''") + "'"; };
  var digest = null, digestHasta = 0;
  function obtenerDigest() {
    if (digest && Date.now() < digestHasta) return Promise.resolve(digest);
    return fetch(web + '/_api/contextinfo', { method: 'POST', credentials: 'same-origin', headers: { Accept: 'application/json;odata=verbose' } })
      .then(function (r) { if (!r.ok) throw new Error('Colabora no da permiso de escritura (HTTP ' + r.status + ')'); return r.json(); })
      .then(function (d) { var i = d.d ? d.d.GetContextWebInformation : d; digest = i.FormDigestValue; digestHasta = Date.now() + ((i.FormDigestTimeoutSeconds || 1800) - 60) * 1000; return digest; });
  }
  function enviarSP(url, cuerpo, sinPermiso, extra) {
    return obtenerDigest().then(function (dg) {
      return fetch(url, { method: 'POST', credentials: 'same-origin', body: cuerpo == null ? '' : JSON.stringify(cuerpo),
        headers: Object.assign({ Accept: 'application/json;odata=verbose', 'Content-Type': 'application/json;odata=verbose', 'X-RequestDigest': dg }, extra || {}) });
    }).then(function (r) {
      return r.text().then(function (txt) {
        var j = null; try { j = JSON.parse(txt); } catch (e) { /* sin JSON */ }
        if (!r.ok) {
          var m = j && ((j.error && j.error.message && (j.error.message.value || j.error.message)) || (j['odata.error'] && j['odata.error'].message && j['odata.error'].message.value));
          var e = new Error(r.status === 403 ? sinPermiso : (m || 'HTTP ' + r.status)); e.status = r.status; throw e;
        }
        return j && (j.d || j);
      });
    });
  }
  var tipos = {};
  function tipoElemento(t) {
    if (tipos[t]) return Promise.resolve(tipos[t]);
    return api(urlL(t) + '?$select=ListItemEntityTypeFullName').then(function (l) { tipos[t] = l.ListItemEntityTypeFullName; return tipos[t]; });
  }
  function crearElemento(t, datos, sinPermiso) {
    return tipoElemento(t).then(function (ty) { return enviarSP(urlL(t) + '/items', Object.assign({ __metadata: { type: ty } }, datos), sinPermiso); });
  }
  function cambiarElemento(t, id, datos, sinPermiso) {
    return tipoElemento(t).then(function (ty) { return enviarSP(urlL(t) + '/items(' + Number(id) + ')', Object.assign({ __metadata: { type: ty } }, datos), sinPermiso, { 'X-HTTP-Method': 'MERGE', 'IF-MATCH': '*' }); });
  }
  // El sitio: se sube por la ruta de la página hasta que /_api/web responde
  function buscarWeb() {
    var partes = location.pathname.split('/').slice(1, -1).map(decodeURIComponent);
    var probar = function (n) {
      if (n < 0) return Promise.reject(new Error('No encuentro el sitio de Colabora de esta página'));
      var ruta = '/' + partes.slice(0, n).map(encodeURIComponent).join('/');
      if (ruta === '/') ruta = '';
      return api(location.origin + ruta + '/_api/web?$select=Url,Title').then(function (w) { web = w.Url || location.origin + ruta; return w; }, function () { return probar(n - 1); });
    };
    return probar(partes.length);
  }
  var bits = function (p) { return { low: Number(p && (p.Low != null ? p.Low : p.low)) || 0 }; };

  // ---------- Correo con envío robusto (receta «Envío robusto» de SHAREPOINT.md, modelo Permisos) ----------
  var DEST_MAL = /destinatario v|valid recipient|recipient/i;
  var sinTildes = function (t) { return String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); };
  var palabras = function (n) { return sinTildes(n).replace(/[^a-zñ ]/g, ' ').split(/\s+/).filter(function (w) { return w.length >= 3 && ['del', 'las', 'los'].indexOf(w) < 0; }); };
  var mismasPalabras = function (a, b) { var x = palabras(a).sort().join(' '), y = palabras(b).sort().join(' '); return !!x && x === y; };
  function enviarUno(to, c) {
    var pr = { __metadata: { type: 'SP.Utilities.EmailProperties' }, To: { results: to }, Subject: c.asunto, Body: c.html };
    if (c.bcc && c.bcc.length && !c.uno) pr.BCC = { results: c.bcc };
    return enviarSP(web + '/_api/SP.Utilities.Utility.SendEmail', { properties: pr }, 'Colabora no te deja enviar correos desde la página');
  }
  // Cuenta de inicio de sesión de una dirección (si el buzón no figura en el perfil, Colabora acepta la cuenta)
  function loginDe(correo) {
    var cc = norm(correo);
    if (yo && yo.login && cc === yo.email) return Promise.resolve(yo.login);
    return api(web + '/_api/web/siteusers?$select=LoginName,Email&$filter=' + encodeURIComponent('Email eq ' + lit(cc))).then(function (d) {
      var u = lista(d.value).filter(function (x) { return norm(x.Email) === cc && x.LoginName; })[0]; return u ? u.LoginName : null;
    }, function () { return null; });
  }
  // Otras cuentas del sitio con el mismo nombre y correo propio (cuentas antiguas sin buzón)
  function otrasDirecciones(nombre, malo) {
    if (!nombre || palabras(nombre).length < 2) return Promise.resolve([]);
    return api(web + '/_api/web/siteusers?$select=Id,Title,Email&$filter=PrincipalType eq 1&$top=5000').then(function (d) {
      var l = lista(d.value).filter(function (u) { return esCorreo(u.Email) && mismasPalabras(u.Title, nombre) && norm(u.Email) !== norm(malo); }).map(function (u) { return u.Email; });
      return l.filter(function (x, i) { return l.map(norm).indexOf(norm(x)) === i; });
    }, function () { return []; });
  }
  function mailtoDe(c) {
    var u = 'mailto:' + c.to.map(encodeURIComponent).join(';') + '?' + (c.bcc && c.bcc.length ? 'bcc=' + c.bcc.map(encodeURIComponent).join(';') + '&' : '') + 'subject=' + encodeURIComponent(c.asunto) + '&body=', cuerpo = c.texto;
    while ((u + encodeURIComponent(cuerpo)).length > 2000 && cuerpo.length > 200) cuerpo = cuerpo.slice(0, cuerpo.length - 100) + '…';
    return u + encodeURIComponent(cuerpo);
  }
  // Colabora rechaza el correo ENTERO si una dirección no es de un usuario con buzón: entonces uno a uno, por su cuenta y
  // por su nombre, y se dice a quién no llegó
  function enviarCorreo(c) {
    c.to = c.to.filter(function (x, i) { return esCorreo(x) && c.to.map(norm).indexOf(norm(x)) === i; });
    // Copia oculta (avisos a muchos): si Colabora rechaza alguna dirección, se reintenta una a una (cada uno solo ve la suya)
    c.bcc = (c.bcc || []).filter(function (x, i, l) { return esCorreo(x) && l.map(norm).indexOf(norm(x)) === i && c.to.map(norm).indexOf(norm(x)) < 0; });
    var res = function (ok, n, motivo, rech, llegaron, desvios) { return { ok: ok, n: n, motivo: motivo || '', rechazados: rech || [], llegaron: llegaron || [], desvios: desvios || [], mailto: mailtoDe(c) }; };
    if (!c.to.length) return Promise.resolve(res(false, 0, 'sin direcciones de correo'));
    var todos = c.to.concat(c.bcc);
    return enviarUno(c.to, c).then(function () { return res(true, todos.length, '', [], todos.slice()); }, function (e) {
      var m = e.message || String(e);
      if (!DEST_MAL.test(m)) return res(false, 0, m);
      var ok = 0, rech = [], lleg = [], desv = []; c.uno = true;
      return todos.reduce(function (p, d) {
        return p.then(function () {
          return enviarUno([d], c).then(function () { ok++; lleg.push(d); }, function () {
            var porNombre = function () {
              // Nombre de la persona: el que se sepa o el de su cuenta del sitio con esa dirección
              var nombre = (c.nombres || {})[norm(d)] ? Promise.resolve(c.nombres[norm(d)]) : api(web + '/_api/web/siteusers?$select=Title,Email&$filter=' + encodeURIComponent('Email eq ' + lit(norm(d)))).then(function (x) { var u = lista(x.value)[0]; return u ? u.Title : ''; }, function () { return ''; });
              return nombre.then(function (n) { return otrasDirecciones(n, d); }).then(function (alt) {
                return alt.reduce(function (q, a) { return q.then(function (h) { return h || enviarUno([a], c).then(function () { ok++; lleg.push(a); desv.push(d + ' → ' + a); return true; }, function () { return false; }); }); }, Promise.resolve(false))
                  .then(function (h) { if (!h) rech.push(d); });
              });
            };
            return loginDe(d).then(function (lg) { return lg ? enviarUno([lg], c).then(function () { ok++; lleg.push(d + ' (por su cuenta)'); }, porNombre) : porNombre(); });
          });
        });
      }, Promise.resolve()).then(function () { return res(ok > 0, ok, ok ? '' : m, rech, lleg, desv); });
    });
  }
  var msgCorreo = function (r) {
    if (!r) return '';
    var rc = r.rechazados.length ? ' Colabora no acepta estas direcciones y a ellas NO les llega: ' + esc(r.rechazados.join(', ')) + '.' : '';
    var dv = r.desvios.length ? ' Enviado a otra cuenta de la misma persona: ' + esc(r.desvios.join('; ')) + '.' : '';
    var btn = !r.ok || rc ? ' <a href="' + esc(r.mailto) + '"><button type="button">✉ Preparar el correo en Outlook</button></a>' : '';
    return (r.ok ? '✉ Aviso enviado por correo a ' + r.n + ' destinatario' + (r.n === 1 ? '' : 's') + '.' + dv : '✉ No se pudo enviar el aviso desde Colabora (' + esc(r.motivo) + ').') + rc + btn;
  };
  // Se anota en la solicitud a quién llegó el aviso (columna «Avisos»); si no se puede, la solicitud ya está hecha
  function anotarAviso(id, r, que) {
    var txt = new Date().toLocaleString('es-ES') + ' · ' + que + ': ' + (r.ok ? 'enviado a ' + r.llegaron.join(', ') : 'NO ENVIADO (' + r.motivo + ')') + (r.rechazados.length ? '; no aceptó: ' + r.rechazados.join(', ') : '') + (r.desvios.length ? '; a otra cuenta: ' + r.desvios.join('; ') : '');
    return api(urlL(L_SOL) + '/items(' + Number(id) + ')?$select=Id,Avisos').then(function (x) {
      return cambiarElemento(L_SOL, id, { Avisos: ((x.Avisos || '') + '\n' + txt).trim() }, 'sin permiso');
    }).catch(function () { /* columna sin crear o sin permiso */ });
  }
  var enlacePagina = function () { return location.href.split('#')[0]; };
  function cuerpoCorreo(intro, filas, enlace, textoEnlace) {
    var h = '<div style="font-family:Segoe UI,Arial,sans-serif;font-size:14px;color:#1c2a3a"><div style="background:#efc000;color:#12315a;font-weight:bold;padding:6px 10px">SENDERO · Control de acceso</div>' +
      '<p>' + esc(intro) + '</p><table style="border-collapse:collapse">' + filas.map(function (f) { return '<tr><td style="padding:3px 10px 3px 0;color:#5a6676">' + esc(f[0]) + '</td><td style="padding:3px 0"><b>' + esc(f[1]) + '</b></td></tr>'; }).join('') + '</table>' +
      (enlace ? '<p><a href="' + esc(enlace) + '">' + esc(textoEnlace) + '</a></p>' : '') + '<p style="color:#5a6676;font-size:12px">SENDERO · © 2026 Cte. Alfredo Sánchez Sender</p></div>';
    return { html: h, texto: intro + '\n\n' + filas.map(function (f) { return f[0] + ': ' + f[1]; }).join('\n') + (enlace ? '\n\n' + textoEnlace + ': ' + enlace : '') };
  }
  // Aviso de solicitud nueva: al administrador y a los responsables del ámbito
  function avisarSolicitud(sol) {
    var amb = norm(sol.Ambito);
    return (amb ? todas(urlL(L_AUT) + "/items?$select=Id,Title,Tipo,Responsables&$filter=" + encodeURIComponent('Title eq ' + lit(sol.Ambito)) + '&$top=20').catch(function () { return []; }) : Promise.resolve([])).then(function (l) {

        '<div class="fila-prep">✉ Correo de prueba a <input id="pruebaA" size="34" value="' + esc(yo.email) + '"> <button type="button" id="pruebaCorreo">Enviar</button> <span id="pruebaMsg" class="muted"></span></div>' +

      $('pruebaCorreo').addEventListener('click', function () {
        var b = this, to = $('pruebaA').value.split(/[\s,;]+/).filter(esCorreo); if (!to.length) return toast('Escribe una dirección');

        acc[b.getAttribute('data-p')]().then(function () { toast('Hecho'); pintarGestion(); }, function (e) { b.disabled = false; toast('No se pudo: ' + (e.message || e)); pintarGestion(); });
