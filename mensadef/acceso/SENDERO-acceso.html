<html lang="es">
<head>
<meta charset="utf-8">
<meta name="author" content="Cte. Alfredo Sánchez Sender">
<meta name="copyright" content="© 2026 Cte. Alfredo Sánchez Sender">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SENDERO · Control de acceso</title>
<style>
  /* Colores de SENDERO: franja amarilla y azul marino */
  :root { --azul: #12315a; --azul2: #1d4f91; --oro: #efc000; --oro2: #b58f00; --fondo: #f3f5f0; --linea: #d3dce8; --ok: #2e6b45; --mal: #a4261e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: #1c2a3a; font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
  .franja { background: var(--oro); border-bottom: 2px solid var(--oro2); color: var(--azul); text-align: center; padding: 6px 12px; font-weight: 800; letter-spacing: .08em; font-size: .85rem; }
  header.cab { background: linear-gradient(90deg, #0f2547, var(--azul) 60%, #1e4a3a); color: #fff; padding: 12px 18px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  header.cab h1 { margin: 0; font: 800 1.35rem Georgia, serif; letter-spacing: .18em; }
  header.cab small { display: block; color: #c9d8ea; font-size: .78rem; letter-spacing: .04em; }
  header.cab .quien { margin-left: auto; text-align: right; font-size: .82rem; color: #e6edf6; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .card { background: #fff; border: 1px solid var(--linea); border-radius: 12px; padding: 14px 16px; margin: 0 0 14px; }
  h2 { margin: 0 0 10px; font-size: 1.1rem; color: var(--azul); }
  .muted { color: #5a6676; font-size: .88rem; }
  .bien { color: var(--ok); font-weight: 700; } .mal { color: var(--mal); font-weight: 700; }
  button { font: inherit; font-weight: 700; padding: 6px 12px; border-radius: 8px; border: 1px solid #b9c6d8; background: #f7f9fc; color: var(--azul); cursor: pointer; }
  button.prim { background: var(--azul); border-color: var(--azul); color: #fff; }
  button.verde { background: var(--ok); border-color: var(--ok); color: #fff; }
  button.rojo { background: #fff; border-color: var(--mal); color: var(--mal); }
  button:disabled { opacity: .55; cursor: default; }
  input, select, textarea { font: inherit; padding: 6px 8px; border: 1px solid #c9d4e3; border-radius: 8px; background: #fff; }
  textarea { width: 100%; min-height: 70px; }
  label { display: inline-flex; flex-direction: column; gap: 3px; font-size: .82rem; color: #5a6676; margin: 0 10px 8px 0; }
  .pestanas { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .pestanas button.on { background: var(--azul); color: #fff; border-color: var(--azul); }
  table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  th { text-align: left; font-size: .74rem; letter-spacing: .05em; text-transform: uppercase; color: #3b4a5f; background: #f4f6f1; padding: 7px 8px; }
  td { border-top: 1px solid #eef1f5; padding: 7px 8px; vertical-align: top; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .75rem; font-weight: 800; }
  .chip.Pendiente { background: #fdf0d5; color: #8a5a12; } .chip.Aprobada { background: #e3f1e6; color: var(--ok); } .chip.Denegada { background: #fde7e4; color: var(--mal); }
  .chip.amb { background: #dde8f7; color: var(--azul2); } .chip.per { background: #efe6f8; color: #4a2a78; } .chip.blo { background: #fde7e4; color: var(--mal); } .chip.off { background: #eceff3; color: #6b7280; }
  .fila-prep { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 8px 0; border-top: 1px solid #eef1f5; }
  .fila-prep:first-of-type { border-top: 0; }
  #toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--azul); color: #fff; padding: 9px 16px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.2); display: none; max-width: 90vw; z-index: 9; }
  .grande { font-size: 1.05rem; }
  .autor { text-align: center; font-size: .8rem; color: #5a6676; border-top: 1px solid var(--linea); padding: 12px 16px 22px; }
  @media print { .autor { display: none; } }
</style>
</head>
<body>
<div class="franja">MINISTERIO DE DEFENSA · EJÉRCITO DE TIERRA · MENSAJERÍA OFICIAL</div>
<header class="cab"><div><h1>SENDERO</h1><small>Control de acceso · quién puede usar SENDERO</small></div><div class="quien" id="quien"></div></header>
<main id="app"><div class="card">Cargando…</div></main>
<div id="toast"></div>
<footer class="autor">© 2026 · Aplicación desarrollada por el <b>Cte. Alfredo Sánchez Sender</b> · Todos los derechos reservados · <span id="verPie"></span></footer>
<script>
(function () {
  'use strict';
  var VERSION = '2026-11-15 · 3';
  // Solo se contesta a SENDERO, que funciona en MENSADEF (el favorito escribe su página sobre la de MENSADEF)
  var ORIGEN_SENDERO = 'https://mensadef.mdef.es';
  var L_AUT = 'SENDERO Autorizados', L_SOL = 'SENDERO Solicitudes', GRUPO = 'SENDERO Administradores';
  var CAMPOS_AUT = [
    '<Field Type="Choice" Name="Tipo" StaticName="Tipo" DisplayName="Tipo" Format="Dropdown"><Default>Ámbito</Default><CHOICES><CHOICE>Ámbito</CHOICE><CHOICE>Persona</CHOICE><CHOICE>Bloqueo</CHOICE><CHOICE>Versión</CHOICE></CHOICES></Field>',
    '<Field Type="Boolean" Name="Activo" StaticName="Activo" DisplayName="Activo"><Default>1</Default></Field>',
    '<Field Type="Note" Name="Responsables" StaticName="Responsables" DisplayName="Responsables" NumLines="3" RichText="FALSE" />',
    '<Field Type="DateTime" Name="Hasta" StaticName="Hasta" DisplayName="Hasta" Format="DateOnly" />',
    '<Field Type="Note" Name="Nota" StaticName="Nota" DisplayName="Nota" NumLines="3" RichText="FALSE" />'];
  var CAMPOS_SOL = [
    '<Field Type="Text" Name="Correo" StaticName="Correo" DisplayName="Correo" />',
    '<Field Type="Text" Name="Ambito" StaticName="Ambito" DisplayName="Ámbito" />',
    '<Field Type="Note" Name="Motivo" StaticName="Motivo" DisplayName="Motivo" NumLines="4" RichText="FALSE" />',
    '<Field Type="Choice" Name="Estado" StaticName="Estado" DisplayName="Estado" Format="Dropdown"><Default>Pendiente</Default><CHOICES><CHOICE>Pendiente</CHOICE><CHOICE>Aprobada</CHOICE><CHOICE>Denegada</CHOICE></CHOICES></Field>',
    '<Field Type="Note" Name="Respuesta" StaticName="Respuesta" DisplayName="Respuesta" NumLines="3" RichText="FALSE" />',
    '<Field Type="Text" Name="RespondidoPor" StaticName="RespondidoPor" DisplayName="Respondido por" />',
    '<Field Type="Text" Name="VersionSendero" StaticName="VersionSendero" DisplayName="Versión de SENDERO" />'];

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var norm = function (s) { return String(s == null ? '' : s).trim().toLowerCase(); };
  var esCorreo = function (v) { return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(v || '').trim()); };
  var fecha = function (v) { if (!v) return ''; var d = new Date(v); return isNaN(d) ? '' : d.toLocaleDateString('es-ES'); };
  var hoy0 = function () { var d = new Date(); d.setHours(0, 0, 0, 0); return d; };
  try { $('verPie').textContent = 'versión ' + VERSION; } catch (e) { /* sin pie */ }
  function toast(t) { var x = $('toast'); x.textContent = t; x.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { x.style.display = 'none'; }, 4500); }

  // ---------- REST de SharePoint (receta de SHAREPOINT.md) ----------
  function api(url) {
    var pedir = function (accept) {
      return fetch(url, { credentials: 'same-origin', headers: { Accept: accept } }).then(function (r) {
        if (r.ok) return r.json();
        return r.text().then(function (txt) {
          var e = new Error('HTTP ' + r.status); e.status = r.status;
          try { var j = JSON.parse(txt); e.spMsg = (j.error && j.error.message && (j.error.message.value || j.error.message)) || (j['odata.error'] && j['odata.error'].message && j['odata.error'].message.value) || ''; } catch (x) { e.spMsg = ''; }
          if (e.spMsg) e.message += ' (' + e.spMsg + ')';
          throw e;
        });
      });
    };
    return pedir('application/json;odata=nometadata').catch(function (e) {
      if ([400, 406, 415].indexOf(e.status) < 0) throw e;
      return pedir('application/json;odata=verbose').then(function (d) {
        d = d.d || d;
        if (d.results) return { value: d.results, 'odata.nextLink': d.__next };
        return d;
      });
    });
  }
  var lista = function (v) { return v == null ? [] : Array.isArray(v) ? v : Array.isArray(v.results) ? v.results : []; };
  function todas(url) {
    var acc = [];
    var pag = function (u) { return api(u).then(function (d) { acc = acc.concat(lista(d.value)); var s = d['odata.nextLink'] || d['@odata.nextLink']; return s ? pag(s) : acc; }); };
    return pag(url);
  }
  var web = '';
  var urlL = function (t) { return web + "/_api/web/lists/getbytitle('" + encodeURIComponent(t.replace(/'/g, "''")) + "')"; };
  var lit = function (v) { return "'" + String(v).replace(/'/g, "''") + "'"; };
  var digest = null, digestHasta = 0;
  function obtenerDigest() {
    if (digest && Date.now() < digestHasta) return Promise.resolve(digest);
    return fetch(web + '/_api/contextinfo', { method: 'POST', credentials: 'same-origin', headers: { Accept: 'application/json;odata=verbose' } })
      .then(function (r) { if (!r.ok) throw new Error('Colabora no da permiso de escritura (HTTP ' + r.status + ')'); return r.json(); })
      .then(function (d) { var i = d.d ? d.d.GetContextWebInformation : d; digest = i.FormDigestValue; digestHasta = Date.now() + ((i.FormDigestTimeoutSeconds || 1800) - 60) * 1000; return digest; });
  }
  function enviarSP(url, cuerpo, sinPermiso, extra) {
    return obtenerDigest().then(function (dg) {
      return fetch(url, { method: 'POST', credentials: 'same-origin', body: cuerpo == null ? '' : JSON.stringify(cuerpo),
        headers: Object.assign({ Accept: 'application/json;odata=verbose', 'Content-Type': 'application/json;odata=verbose', 'X-RequestDigest': dg }, extra || {}) });
    }).then(function (r) {
      return r.text().then(function (txt) {
        var j = null; try { j = JSON.parse(txt); } catch (e) { /* sin JSON */ }
        if (!r.ok) {
          var m = j && ((j.error && j.error.message && (j.error.message.value || j.error.message)) || (j['odata.error'] && j['odata.error'].message && j['odata.error'].message.value));
          var e = new Error(r.status === 403 ? sinPermiso : (m || 'HTTP ' + r.status)); e.status = r.status; throw e;
        }
        return j && (j.d || j);
      });
    });
  }
  var tipos = {};
  function tipoElemento(t) {
    if (tipos[t]) return Promise.resolve(tipos[t]);
    return api(urlL(t) + '?$select=ListItemEntityTypeFullName').then(function (l) { tipos[t] = l.ListItemEntityTypeFullName; return tipos[t]; });
  }
  function crearElemento(t, datos, sinPermiso) {
    return tipoElemento(t).then(function (ty) { return enviarSP(urlL(t) + '/items', Object.assign({ __metadata: { type: ty } }, datos), sinPermiso); });
  }
  function cambiarElemento(t, id, datos, sinPermiso) {
    return tipoElemento(t).then(function (ty) { return enviarSP(urlL(t) + '/items(' + Number(id) + ')', Object.assign({ __metadata: { type: ty } }, datos), sinPermiso, { 'X-HTTP-Method': 'MERGE', 'IF-MATCH': '*' }); });
  }
  // El sitio: se sube por la ruta de la página hasta que /_api/web responde
  function buscarWeb() {
    var partes = location.pathname.split('/').slice(1, -1).map(decodeURIComponent);
    var probar = function (n) {
      if (n < 0) return Promise.reject(new Error('No encuentro el sitio de Colabora de esta página'));
      var ruta = '/' + partes.slice(0, n).map(encodeURIComponent).join('/');
      if (ruta === '/') ruta = '';
      return api(location.origin + ruta + '/_api/web?$select=Url,Title').then(function (w) { web = w.Url || location.origin + ruta; return w; }, function () { return probar(n - 1); });
    };
    return probar(partes.length);
  }
  var bits = function (p) { return { low: Number(p && (p.Low != null ? p.Low : p.low)) || 0 }; };

  // ---------- Decisión: ¿puede usar SENDERO? ----------
  var activo = function (r) { return r.Activo === true || r.Activo === 1 || r.Activo === '1' || r.Activo === 'true'; };
  var vigente = function (r) { return !r.Hasta || new Date(r.Hasta) >= hoy0(); };
  var yo = null;
  function leerYo() {
    if (yo) return Promise.resolve(yo);
    return api(web + '/_api/web/currentuser?$select=Id,Title,Email,LoginName').then(function (u) {
      yo = { id: u.Id, nombre: u.Title || '', email: norm(u.Email) };
      $('quien').innerHTML = esc(yo.nombre) + (yo.email ? '<br>' + esc(yo.email) : '');
      return yo;
    });
  }
  function versionVigente() {
    return todas(urlL(L_AUT) + "/items?$select=Id,Title,Tipo,Activo,Nota&$filter=" + encodeURIComponent("Tipo eq 'Versión'") + '&$top=50').then(function (l) {
      var v = l.filter(activo).sort(function (a, b) { return b.Id - a.Id; })[0];
      return v ? { version: v.Title || '', url: (v.Nota || '').trim() } : null;
    }, function () { return null; });
  }
  function evaluar(ambito) {
    ambito = String(ambito || '').trim();
    return leerYo().then(function (u) {
      if (!u.email) { var e = new Error('Colabora no tiene el correo de tu cuenta'); e.status = 0; throw e; }
      var valores = [u.email].concat(ambito ? [ambito] : []);
      var filtro = valores.map(function (v) { return 'Title eq ' + lit(v); }).join(' or ');
      return Promise.all([
        todas(urlL(L_AUT) + '/items?$select=Id,Title,Tipo,Activo,Hasta&$filter=' + encodeURIComponent(filtro) + '&$top=100'),
        versionVigente(),
        todas(urlL(L_SOL) + '/items?$select=Id,Estado,Respuesta,Ambito,Created&$filter=' + encodeURIComponent('Correo eq ' + lit(u.email)) + '&$top=50').catch(function () { return []; })
      ]).then(function (r) {
        var reglas = r[0].filter(activo);
        var mia = function (t) { return reglas.filter(function (x) { return x.Tipo === t && norm(x.Title) === u.email; })[0]; };
        var bloq = mia('Bloqueo'), per = mia('Persona');
        if (per && !vigente(per)) per = null;
        var amb = ambito && reglas.filter(function (x) { return x.Tipo === 'Ámbito' && norm(x.Title) === norm(ambito) && vigente(x); })[0];
        var sol = r[2].sort(function (a, b) { return b.Id - a.Id; })[0];
        return { ok: !bloq && !!(per || amb), motivo: bloq ? 'bloqueado' : per || amb ? '' : 'sin_regla', regla: per ? 'persona' : amb ? 'ámbito ' + amb.Title : '',
          email: u.email, nombre: u.nombre, ambito: ambito, vigente: r[1],
          solicitud: sol ? { estado: sol.Estado || 'Pendiente', fecha: sol.Created, respuesta: sol.Respuesta || '', ambito: sol.Ambito || '' } : null };
      });
    });
  }

  // ---------- Arranque según cómo se abre ----------
  var m = /^#(comprobar|solicitar)=(.*)$/.exec(location.hash || ''), modo = m ? m[1] : 'pagina', datos = {};
  if (m) { try { datos = JSON.parse(decodeURIComponent(m[2])) || {}; } catch (e) { datos = {}; } }
  var destino = window.parent !== window ? window.parent : window.opener;
  if (document.documentMode) { $('app').innerHTML = '<div class="card mal">Ábrelo en Microsoft Edge o Chrome (no en modo Internet Explorer).</div>'; return; }

  buscarWeb().then(function () {
    if (modo === 'comprobar') return modoComprobar();
    if (modo === 'solicitar') return leerYo().then(function () { return pintarSolicitud(datos.a || '', datos.v || ''); });
    return modoPagina();
  }).catch(function (e) {
    if (modo === 'comprobar') return responder({ ok: false, error: e.message || String(e), status: e.status || 0 });
    $('app').innerHTML = '<div class="card"><p class="mal">' + esc(e.message || e) + '</p><p class="muted">Versión ' + esc(VERSION) + '</p></div>';
  });

  // SENDERO pregunta (en un marco oculto o en una ventana pequeña) y se le contesta solo a él
  function responder(r) {
    r.tipo = 'sendero-acceso'; r.n = datos.n || ''; r.versionPagina = VERSION;
    if (destino) { try { destino.postMessage(r, ORIGEN_SENDERO); } catch (e) { /* SENDERO cerrado */ } }
    $('app').innerHTML = '<div class="card"><h2>' + (r.ok ? '<span class="bien">✔ Autorizado</span>' : r.error ? '<span class="mal">No he podido comprobarlo</span>' : '<span class="mal">🔒 Sin autorización</span>') + '</h2>' +
      '<p>' + (r.ok ? 'Puedes usar SENDERO (' + esc(r.regla) + ').' : r.error ? esc(r.error) : r.motivo === 'bloqueado' ? 'Tu acceso a SENDERO está retirado.' : 'Tu cuenta no está autorizada para SENDERO.') + '</p>' +
      (window.opener && window.parent === window ? '<p class="muted">Vuelve a SENDERO: esta ventana se cierra sola.</p>' : '') + '</div>';
    if (window.opener && window.parent === window) setTimeout(function () { window.close(); }, 1500);
  }
  function modoComprobar() {
    $('app').innerHTML = '<div class="card">Comprobando tu autorización de SENDERO…</div>';
    return evaluar(datos.a).then(responder, function (e) { responder({ ok: false, error: e.status === 404 ? 'Falta preparar el control de acceso en Colabora' : (e.message || String(e)), status: e.status || 0 }); });
  }

  // ---------- Solicitar acceso ----------
  function pintarSolicitud(ambito, version) {
    return evaluar(ambito).catch(function () { return null; }).then(function (st) {
      var pend = st && st.solicitud && st.solicitud.estado === 'Pendiente';
      $('app').innerHTML = '<div class="card"><h2>Solicitar acceso a SENDERO</h2>' +
        (st && st.ok ? '<p class="bien">✔ Ya estás autorizado (' + esc(st.regla) + '). Vuelve a SENDERO y pulsa «Volver a comprobar».</p>' :
        pend ? '<p class="grande">Ya tienes una solicitud <span class="chip Pendiente">Pendiente</span> del ' + esc(fecha(st.solicitud.fecha)) + '. Te la resolverán lo antes posible.</p>' :
        (st && st.solicitud && st.solicitud.estado === 'Denegada' ? '<p class="mal">Tu última solicitud fue denegada' + (st.solicitud.respuesta ? ': ' + esc(st.solicitud.respuesta) : '') + '.</p>' : '') +
        '<p class="muted">La solicitud la ve el Cte. Alfredo Sánchez Sender o el responsable de tu ámbito de MENSADEF.</p>' +
        '<label>Nombre<input value="' + esc(yo.nombre) + '" disabled size="40"></label><label>Cuenta<input value="' + esc(yo.email) + '" disabled size="34"></label><br>' +
        '<label>Ámbito de MENSADEF<input id="solAmbito" value="' + esc(ambito) + '" size="20" placeholder="p. ej. 2SUIGE"></label><br>' +
        '<label style="display:flex">Motivo (para qué lo necesitas)<textarea id="solMotivo" maxlength="1000"></textarea></label>' +
        '<p><button type="button" class="prim" id="solEnviar">Enviar la solicitud</button> <span id="solMsg" class="muted"></span></p>') + '</div>';
      if (!$('solEnviar')) return;
      $('solEnviar').addEventListener('click', function () {
        var b = this; b.disabled = true; $('solMsg').textContent = 'Enviando…';
        crearElemento(L_SOL, { Title: yo.nombre || yo.email, Correo: yo.email, Ambito: $('solAmbito').value.trim().toUpperCase(), Motivo: $('solMotivo').value.trim(), Estado: 'Pendiente', VersionSendero: String(version || '') },
          'Colabora no te deja enviar la solicitud: avisa al Cte. Alfredo Sánchez Sender')
          .then(function () { $('app').innerHTML = '<div class="card"><h2 class="bien">✔ Solicitud enviada</h2><p>Cuando te autoricen, vuelve a SENDERO y pulsa «Volver a comprobar».</p><p class="muted">Ya puedes cerrar esta ventana.</p></div>'; },
            function (e) { b.disabled = false; $('solMsg').innerHTML = '<span class="mal">' + esc(e.message || e) + '</span>'; });
      });
    });
  }

  // ---------- Página de gestión ----------
  var rol = 'usuario', misAmbitos = [], pestana = 'solicitudes';
  function modoPagina() {
    return Promise.all([leerYo(), api(web + '/_api/web/EffectiveBasePermissions').catch(function () { return {}; }),
      api(urlL(L_AUT) + '/EffectiveBasePermissions').catch(function () { return null; })]).then(function (r) {
      var admin = (bits(r[1]).low & 0x2000000) !== 0, gestor = r[2] && (bits(r[2]).low & 0x4) !== 0;
      rol = admin ? 'admin' : gestor ? 'gestor' : 'usuario';
      if (rol === 'usuario') return pintarSolicitud('', '');
      if (rol === 'admin' && !r[2]) pestana = 'preparacion';
      return (rol === 'gestor' ? todas(urlL(L_AUT) + "/items?$select=Id,Title,Tipo,Activo,Responsables&$filter=" + encodeURIComponent("Tipo eq 'Ámbito'") + '&$top=500').then(function (l) {
        misAmbitos = l.filter(function (x) { return String(x.Responsables || '').toLowerCase().split(/[\s,;]+/).indexOf(yo.email) >= 0; }).map(function (x) { return norm(x.Title); });
      }) : Promise.resolve()).then(pintarGestion);
    });
  }
  function pintarGestion() {
    var ps = [['solicitudes', 'Solicitudes'], ['reglas', 'Autorizados y bloqueos']].concat(rol === 'admin' ? [['version', 'Versión vigente'], ['preparacion', 'Preparación']] : []);
    $('app').innerHTML = '<div class="card"><div class="pestanas">' + ps.map(function (p) { return '<button type="button" data-pest="' + p[0] + '"' + (p[0] === pestana ? ' class="on"' : '') + '>' + p[1] + '</button>'; }).join('') + '</div>' +
      (rol === 'gestor' ? '<p class="muted">Eres responsable de: ' + (misAmbitos.length ? esc(misAmbitos.join(', ').toUpperCase()) : 'ningún ámbito todavía') + '. Ves las solicitudes de esos ámbitos y puedes autorizar o bloquear personas.</p>' : '') +
      '<div id="cont">Cargando…</div></div>';

        '<div class="fila-prep">' + ok(sAbierta && (!g || gEn(s))) + ' «' + esc(L_SOL) + '»: todos pueden solicitar y cada uno ve solo las suyas ' + (s.existe ? '<button type="button" data-p="abrirS">' + (sAbierta ? 'Repetir' : 'Ajustarlo') + '</button>' : '') + porque(s, faltaS) + '</div>' +
        '<div class="fila-prep">' + (s.existe ? '<a href="' + esc(web + '/_layouts/15/SubNew.aspx?List=' + encodeURIComponent('{' + String(s.info.Id).replace(/[{}]/g, '') + '}')) + '" target="_blank" rel="noopener">🔔 Aviso por correo de solicitudes nuevas</a> <span class="muted">(alerta de Colabora: «Se agregan nuevos elementos»)</span>' : '<span class="muted">🔔 Aviso por correo: cuando exista la lista de solicitudes</span>') + '</div>' +
        '<p class="muted">Después: en «Autorizados y bloqueos» añade los ámbitos (p. ej. 2SUIGE) con sus responsables, y mete a esos responsables en el grupo.</p>';
      var acc = {
        crearA: function () { return crearLista(L_AUT, CAMPOS_AUT, 'Quién puede usar SENDERO (ámbitos, personas, bloqueos y versión vigente). Página SENDERO-acceso.'); },
        crearS: function () { return crearLista(L_SOL, CAMPOS_SOL, 'Solicitudes de acceso a SENDERO. Página SENDERO-acceso.'); },
        colA: function () { return crearColumnas(L_AUT, CAMPOS_AUT, a.faltan); },
        colS: function () { return crearColumnas(L_SOL, CAMPOS_SOL, s.faltan); },
        grupo: function () { return enviarSP(web + '/_api/web/sitegroups', { __metadata: { type: 'SP.Group' }, Title: GRUPO, Description: 'Responsables de ámbito de SENDERO: aprueban solicitudes de su ámbito' }, 'No tienes permiso para crear grupos'); },
        protA: function () { return protegerAutorizados(a); },
        abrirS: function () { return abrirSolicitudes(s); }
      };
      Array.prototype.forEach.call($('cont').querySelectorAll('[data-p]'), function (b) { b.addEventListener('click', function () {
        b.disabled = true; toast('Un momento…');
        acc[b.getAttribute('data-p')]().then(function () { toast('Hecho'); pintarGestion(); }, function (e) { b.disabled = false; toast('No se pudo: ' + (e.message || e)); pintarGestion(); });
      }); });
    });
  }
})();
</script>
