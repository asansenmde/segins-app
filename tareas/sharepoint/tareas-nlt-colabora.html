<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tareas NLT · Colabora</title>
<!--
  Tareas NLT para el SharePoint interno (Colabora).
  Se sube a una biblioteca del sitio y trabaja con la lista «Gestor de Tareas» usando la sesión del usuario.
  Lee la lista y solo escribe para dar de alta asuntos nuevos (no modifica ni borra). No se comunica con nada fuera del propio servidor.
-->
<style>
  :root {
    --bg: #f4f5f0; --surface: #fff; --surface-2: #eef1ea; --text: #1f261f; --muted: #5f685f; --line: #d9ddd3;
    --brand: #3b4a2f; --brand-2: #56693f; --on-brand: #fff;
    --ok: #2e7d32; --ok-bg: #dcefdc; --warn: #9a5b00; --warn-bg: #fdebc8; --bad: #b71c1c; --bad-bg: #fbdada;
    --info: #1d4f91; --info-bg: #dde8f7; --na: #555; --na-bg: #e7e7e7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .top { position: sticky; top: 0; z-index: 5; background: var(--brand); color: var(--on-brand); padding: 10px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .top h1 { margin: 0; font-size: 1.05rem; flex: 1; min-width: 180px; }
  .top .estado { font-size: .8rem; opacity: .9; }
  .top button { background: rgba(255,255,255,.15); color: inherit; border: 0; }
  nav.tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 12px; margin: 12px 0; }
  nav.tabs a { flex: 1; text-align: center; padding: 8px 4px; border-radius: 9px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: .9rem; cursor: pointer; }
  nav.tabs a.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  main { max-width: 1000px; margin: 0 auto; padding: 0 16px 60px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .muted { color: var(--muted); } .small { font-size: .85rem; }
  button, .btn { font: inherit; font-weight: 600; padding: 7px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--text); cursor: pointer; text-decoration: none; display: inline-block; }
  .btn.prim { background: var(--brand); color: #fff; border-color: var(--brand); }
  select, input { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--text); width: 100%; }
  label.lbl { display: block; font-size: .8rem; font-weight: 600; color: var(--muted); margin: 8px 0 3px; }
  label.check { display: inline-flex; gap: 6px; align-items: center; margin: 4px 12px 4px 0; font-size: .9rem; }
  label.check input { width: auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px; text-align: center; cursor: pointer; font: inherit; color: inherit; }
  .kpi.on { outline: 2px solid var(--brand-2); }
  .kpi b { display: block; font-size: 1.5rem; }
  .kpi.bad b { color: var(--bad); } .kpi.warn b { color: var(--warn); }
  .sec { margin: 16px 0 6px; font-size: .85rem; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; display: flex; justify-content: space-between; }
  .tarea { border-left: 5px solid var(--line); cursor: pointer; }
  .tarea.bad { border-left-color: var(--bad); } .tarea.warn { border-left-color: var(--warn); } .tarea.ok { border-left-color: var(--ok); } .tarea.hecha { opacity: .7; }
  .tarea .tit { font-weight: 650; }
  .meta { display: flex; flex-wrap: wrap; gap: 5px 8px; margin-top: 4px; font-size: .82rem; align-items: center; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .74rem; font-weight: 700; white-space: nowrap; }
  .badge.ok { background: var(--ok-bg); color: var(--ok); } .badge.warn { background: var(--warn-bg); color: var(--warn); }
  .badge.bad { background: var(--bad-bg); color: var(--bad); } .badge.info { background: var(--info-bg); color: var(--info); }
  .badge.none { background: var(--na-bg); color: var(--na); } .badge.crit { background: var(--bad); color: #fff; }
  .chip { background: var(--surface-2); color: var(--muted); border-radius: 6px; padding: 1px 7px; font-weight: 600; font-size: .75rem; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal .dow { text-align: center; font-size: .72rem; color: var(--muted); font-weight: 700; }
  .dia { min-height: 62px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 4px; font-size: .78rem; cursor: pointer; text-align: left; }
  .dia.fuera { opacity: .4; } .dia.hoy { outline: 2px solid var(--brand-2); } .dia.sel { background: var(--surface-2); }
  .dia i { display: block; font-style: normal; font-size: .68rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-radius: 4px; padding: 0 3px; margin-top: 2px; background: var(--info-bg); color: var(--info); }
  .dia i.bad { background: var(--bad-bg); color: var(--bad); }
  dialog { width: min(760px, calc(100vw - 16px)); max-height: calc(100vh - 16px); border: 0; border-radius: 14px; padding: 0; }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .dh { position: sticky; top: 0; background: var(--brand); color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; gap: 10px; }
  .dh h2 { margin: 0; font-size: 1.05rem; }
  .db { padding: 12px 16px; }
  .campo { border-bottom: 1px solid var(--line); padding: 7px 0; }
  .campo b { display: block; font-size: .78rem; color: var(--muted); }
  .campo div { white-space: pre-wrap; overflow-wrap: anywhere; }
  .informe { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; font-size: .88rem; overflow-x: auto; }
  .informe h2 { text-align: center; text-transform: uppercase; font-size: 1.1rem; margin: 6px 0; }
  .informe h3 { color: var(--brand); margin: 16px 0 6px; font-size: .95rem; }
  .informe .c { text-align: center; margin: 2px 0; color: var(--muted); font-size: .85rem; }
  .informe .marca { text-align: center; color: var(--bad); font-weight: 800; }
  table.t { width: 100%; border-collapse: collapse; font-size: .8rem; }
  table.t th { background: var(--brand); color: #fff; text-align: left; padding: 5px 6px; }
  table.t td { border-bottom: 1px solid var(--line); padding: 5px 6px; vertical-align: top; }
  .rojo { color: var(--bad); font-weight: 700; }
  .aviso { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
  .error { background: var(--bad-bg); color: var(--bad); border-radius: 10px; padding: 10px 12px; margin: 10px 0; font-weight: 600; }
  .acciones { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 10px 0; }
  @media (max-width: 520px) { .kpis { grid-template-columns: repeat(2, 1fr); } .dia { min-height: 44px; } .dia i { font-size: 0; height: 5px; } }
  @media print {
    body.imprimiendo .top, body.imprimiendo nav.tabs, body.imprimiendo #vista > :not(#informeDoc) { display: none !important; }
    body.imprimiendo .informe { border: 0; padding: 0; }
  }
</style>
</head>
<body>
<header class="top">
  <h1>Tareas NLT · Colabora</h1>
  <span class="estado" id="estadoCarga">Cargando…</span>
  <button id="nuevo" title="Dar de alta un asunto en Colabora">＋ Nuevo asunto</button>
  <button id="recargar" title="Volver a leer la lista">↻ Actualizar</button>
</header>
<main>
  <noscript><div class="error">Esta página necesita JavaScript.</div></noscript>
  <nav class="tabs" id="tabs">
    <a data-v="nlt" class="on">Mis NLT</a><a data-v="calendario">Calendario</a><a data-v="avisos">Avisos</a><a data-v="informes">Informes</a><a data-v="ajustes">Ajustes</a>
  </nav>
  <div id="vista"><p class="muted">Leyendo la lista «Gestor de Tareas»…</p></div>
</main>
<dialog id="dlg"></dialog>
<script>
(function () {
  'use strict';
  if (document.documentMode || !window.fetch || !window.Promise || !Element.prototype.closest) {
    document.getElementById('vista').innerHTML = '<div class="error">Tu navegador abre esta página en modo Internet Explorer o es muy antiguo. Ábrela en Microsoft Edge o Chrome.</div>';
    return;
  }
  var $ = function (s, el) { return (el || document).querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var iso = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  var hoy = function () { return iso(new Date()); };
  var aFecha = function (s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
  var diasHasta = function (s) { return Math.round((aFecha(s) - aFecha(hoy())) / 864e5); };
  var sinTildes = function (s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); };
  var fCorta = function (s) { return s ? aFecha(s).toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' }) : ''; };
  var fLarga = function (s) { return aFecha(s).toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' }); };
  var fMedia = function (s) { return s ? aFecha(s).toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' }) : ''; };

  // ---------- Preferencias de este navegador ----------
  var CLAVE = 'tareas-nlt-colabora';
  var pref = { lista: 'Gestor de Tareas', vista: 'nlt', quien: 'mias', q: '', negociado: '', estado: '', prio: '', mapaEstados: {}, avisoDias: 3, informe: null };
  try { Object.assign(pref, JSON.parse(localStorage.getItem(CLAVE)) || {}); } catch (e) { /* sin memoria local */ }
  var guardarPref = function () { try { localStorage.setItem(CLAVE, JSON.stringify(pref)); } catch (e) { /* sin memoria local */ } };

  // ---------- SharePoint (REST, solo lectura) ----------
  var web = null, yo = null, listaInfo = null, campos = {}, infoCampo = {}, tareas = [], cargadoEn = null;

  function api(url) {
    var pedir = function (accept) {
      return fetch(url, { credentials: 'same-origin', headers: { Accept: accept } }).then(function (r) {
        if (!r.ok) { var e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
        return r.json();
      });
    };
    return pedir('application/json;odata=nometadata').catch(function (e) {
      if ([400, 406, 415].indexOf(e.status) < 0) throw e;
      return pedir('application/json;odata=verbose').then(function (d) {
        d = d.d || d;
        if (d.results) return { value: d.results, 'odata.nextLink': d.__next };
        return d;
      });
    });
  }
  var lista = function (v) { return v == null ? [] : Array.isArray(v) ? v : Array.isArray(v.results) ? v.results : []; };

  function webDe(ruta) {
    var partes = ruta.split('/').filter(Boolean), cands = [];
    for (var i = partes.length; i >= 0; i--) cands.push(location.origin + (i ? '/' + partes.slice(0, i).join('/') : ''));
    var probar = function (n) {
      if (n >= cands.length) return Promise.reject(new Error('No encuentro el sitio de SharePoint'));
      return api(cands[n] + '/_api/web?$select=Url,Title').then(function (w) { return { url: w.Url || cands[n], titulo: w.Title }; })
        .catch(function () { return probar(n + 1); });
    };
    return probar(0);
  }

  var CAMPOS_SEL = ['Id', 'Title', 'ESTADO', 'Prioridad', 'FechaDeInicio', 'FechaVencimiento', 'fECHAFINALIZACION', 'NegociadoAsignado',
    'NegociadosImplicados', 'Descripcion', 'DescripcionDelAsunto', 'Comentarios', 'ControlExpediente', 'REGISTRODEACTIVIDAD',
    'NombreResponsable', 'NombreImplicados', 'Created', 'Modified', 'ResponsableDeLaInformacion/Id', 'ResponsableDeLaInformacion/Title',
    'PersonalImplicado0/Id', 'PersonalImplicado0/Title', 'Author/Title', 'Editor/Title',
    'correoResponsable', 'correoimplicados', 'ResponsableDeLaInformacion/EMail', 'PersonalImplicado0/EMail'];
  var EXPANDIR = 'ResponsableDeLaInformacion,PersonalImplicado0,Author,Editor';

  var urlLista = function () { return web.url + "/_api/web/lists/getbytitle('" + encodeURIComponent(pref.lista.replace(/'/g, "''")) + "')"; };

  // Texto sin formato de un campo enriquecido (DOMParser no ejecuta nada)
  var texto = function (html) {
    if (!html) return '';
    if (!/[<&]/.test(html)) return String(html).trim();
    var d = new DOMParser().parseFromString(String(html).replace(/<br\s*\/?>/gi, '\n').replace(/<\/(p|div|li)>/gi, '\n'), 'text/html');
    return (d.body.textContent || '').replace(/​/g, '').replace(/\n{3,}/g, '\n\n').trim();
  };
  var fechaSP = function (v) { return v ? iso(new Date(v)) : ''; };

  // Estado real → clase de la app. Automática por palabras; se puede corregir en Ajustes.
  function claseEstado(valor) {
    if (pref.mapaEstados[valor]) return pref.mapaEstados[valor];
    var n = sinTildes(valor);
    if (/(finaliz|terminad|cerrad|complet|resuelt|archivad|hecho|realizad|cumplimentad|anulad|cancelad|conclu)/.test(n)) return 'hecha';
    if (/(espera|pausa|parad|bloque|suspend|pendiente de )/.test(n)) return 'espera';
    if (/(curso|tramit|proceso|ejecuci|iniciad|abiert|trabaj)/.test(n)) return 'curso';
    return 'pendiente';
  }
  // Direcciones de correo de un texto («a@x.es; b@x.es»)
  var correos = function (txt) { return String(txt || '').split(/[;,\s]+/).map(function (x) { return x.trim(); }).filter(function (x) { return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x); }); };
  var unico = function (x, i, a) { return x && a.map(function (y) { return String(y).toLowerCase(); }).indexOf(String(x).toLowerCase()) === i; };
  var CLASES = { pendiente: 'Pendiente', curso: 'En curso', espera: 'En espera', hecha: 'Terminada' };
  function clasePrio(valor) {
    var n = sinTildes(valor);
    if (/(muy alta|critic|inmediat|urgent|flash)/.test(n)) return 'critica';
    if (/alta/.test(n)) return 'alta';
    if (/baja/.test(n)) return 'baja';
    return 'media';
  }
  var ORDEN_PRIO = { critica: 0, alta: 1, media: 2, baja: 3 };

  function aTarea(it) {
    var resp = it.ResponsableDeLaInformacion || null;
    var implicados = lista(it.PersonalImplicado0).map(function (u) { return u.Title; });
    var t = {
      id: it.Id, asunto: it.Title || '(sin asunto)', estado: it.ESTADO || '', prioridad: it.Prioridad || '',
      inicio: fechaSP(it.FechaDeInicio), nlt: fechaSP(it.FechaVencimiento), fin: fechaSP(it.fECHAFINALIZACION),
      negociado: it.NegociadoAsignado || '', negociados: lista(it.NegociadosImplicados).length ? lista(it.NegociadosImplicados) : (Array.isArray(it.NegociadosImplicados) ? it.NegociadosImplicados : []),
      descripcion: texto(it.DescripcionDelAsunto) || texto(it.Descripcion), resumenDesc: texto(it.Descripcion),
      observaciones: texto(it.Comentarios), expediente: texto(it.ControlExpediente), registro: texto(it.REGISTRODEACTIVIDAD),
      respId: resp && resp.Id, responsable: (resp && resp.Title) || it.NombreResponsable || '',
      implicadosIds: lista(it.PersonalImplicado0).map(function (u) { return u.Id; }),
      correoResp: correos(it.correoResponsable).concat(resp && resp.EMail ? [resp.EMail] : []).filter(unico),
      correosImpl: correos(it.correoimplicados).concat(lista(it.PersonalImplicado0).map(function (u) { return u.EMail; })).filter(unico),
      usuarios: (resp && resp.Id ? [resp] : []).concat(lista(it.PersonalImplicado0)).map(function (u) { return { Id: u.Id, Title: u.Title, Email: u.EMail || '' }; }),
      implicados: implicados.length ? implicados : String(it.NombreImplicados || '').split(/[;,]/).map(function (s) { return s.trim(); }).filter(Boolean),
      creada: it.Created, modificada: it.Modified, autor: it.Author && it.Author.Title, editor: it.Editor && it.Editor.Title,
    };
    t.clase = claseEstado(t.estado);
    if (t.fin && t.clase !== 'hecha') t.clase = 'hecha';
    t.prio = clasePrio(t.prioridad);
    return t;
  }

  function cargar() {
    $('#estadoCarga').textContent = 'Cargando…';
    var p = web ? Promise.resolve(web) : webDe(location.pathname.replace(/\/[^/]*$/, '')).then(function (w) { web = w; return w; });
    return p.then(function () {
      return Promise.all([
        yo ? yo : api(web.url + '/_api/web/currentuser?$select=Id,Title').then(function (u) { yo = u; return u; }),
        api(urlLista() + '?$select=Id,Title,ItemCount,ListItemEntityTypeFullName,RootFolder/ServerRelativeUrl&$expand=RootFolder').then(function (l) { listaInfo = l; }),
        api(urlLista() + "/fields?$select=InternalName,Title,Choices,RichText,Required&$filter=(InternalName eq 'ESTADO') or (InternalName eq 'Prioridad') or (InternalName eq 'NegociadoAsignado')" +
          " or (InternalName eq 'NegociadosImplicados') or (InternalName eq 'DescripcionDelAsunto') or (InternalName eq 'Comentarios') or (InternalName eq 'ControlExpediente') or (InternalName eq 'FechaVencimiento')")
          .then(function (d) { lista(d.value).forEach(function (f) {
            campos[f.InternalName] = lista(f.Choices).length ? lista(f.Choices) : (f.Choices || []);
            infoCampo[f.InternalName] = { rico: !!f.RichText, obligatorio: !!f.Required };
          }); })
          .catch(function () { /* las opciones se deducen de los datos */ }),
      ]);
    }).then(function () {
      var todos = [];
      var pagina = function (url) {
        return api(url).then(function (d) {
          todos = todos.concat(lista(d.value));
          $('#estadoCarga').textContent = 'Cargando… ' + todos.length;
          var sig = d['odata.nextLink'] || d['@odata.nextLink'];
          return sig ? pagina(sig) : todos;
        });
      };
      return pagina(urlLista() + '/items?$top=500&$select=' + CAMPOS_SEL.join(',') + '&$expand=' + EXPANDIR);
    }).then(function (items) {
      tareas = items.map(aTarea);
      cargadoEn = new Date();
      $('#estadoCarga').textContent = tareas.length + ' asuntos · ' + cargadoEn.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
      render();
    }).catch(function (e) {
      $('#estadoCarga').textContent = 'Error';
      $('#vista').innerHTML = '<div class="error">No se pudo leer la lista «' + esc(pref.lista) + '»: ' + esc(e.message || e) +
        '.</div><p class="muted">Comprueba en Ajustes el nombre de la lista y que tienes permiso para verla.</p>';
      if (pref.vista === 'ajustes') render();
    });
  }

  // ---------- Reglas de NLT ----------
  function urgencia(t) {
    if (t.clase === 'hecha') {
      var aTiempo = !t.nlt || !t.fin || t.fin <= t.nlt;
      return { cls: 'none', grupo: 'hechas', txt: aTiempo ? 'Terminada' : 'Terminada fuera de NLT' };
    }
    if (!t.nlt) return { cls: 'none', grupo: 'sin', txt: 'Sin NLT' };
    var d = diasHasta(t.nlt);
    if (d < 0) return { cls: 'bad', grupo: 'vencidas', txt: 'Vencida hace ' + (-d) + ' d' };
    if (d === 0) return { cls: 'bad', grupo: 'hoy', txt: 'Vence hoy' };
    var txt = d === 1 ? 'Vence mañana' : 'Quedan ' + d + ' d';
    return { cls: d <= pref.avisoDias ? 'warn' : 'ok', grupo: d <= 7 ? 'semana' : 'despues', txt: txt };
  }
  var ordenar = function (a, b) {
    return (a.nlt || '9999').localeCompare(b.nlt || '9999') || ORDEN_PRIO[a.prio] - ORDEN_PRIO[b.prio] || a.asunto.localeCompare(b.asunto, 'es');
  };
  var esMia = function (t) { return yo && (t.respId === yo.Id || (!t.respId && sinTildes(t.responsable) === sinTildes(yo.Title))); };
  var meImplica = function (t) { return yo && (esMia(t) || t.implicadosIds.indexOf(yo.Id) >= 0 || t.implicados.some(function (n) { return sinTildes(n) === sinTildes(yo.Title); })); };

  function filtrar(ts) {
    var q = sinTildes(pref.q.trim());
    return ts.filter(function (t) {
      if (pref.quien === 'mias' && !esMia(t)) return false;
      if (pref.quien === 'implicado' && !meImplica(t)) return false;
      if (pref.negociado && t.negociado !== pref.negociado && t.negociados.indexOf(pref.negociado) < 0) return false;
      if (pref.estado && t.estado !== pref.estado) return false;
      if (pref.prio && t.prioridad !== pref.prio) return false;
      if (q && sinTildes([t.asunto, t.descripcion, t.expediente, t.responsable, t.implicados.join(' '), t.negociado, t.estado, t.observaciones].join(' ')).indexOf(q) < 0) return false;
      return true;
    });
  }
  var valores = function (campo, clave) {
    var s = new Set(campos[campo] || []);
    tareas.forEach(function (t) { var v = t[clave]; if (Array.isArray(v)) v.forEach(function (x) { if (x) s.add(x); }); else if (v) s.add(v); });
    return Array.from(s);
  };
  var opciones = function (lista, sel, vacio) {
    return '<option value="">' + esc(vacio) + '</option>' + lista.map(function (v) { return '<option' + (v === sel ? ' selected' : '') + '>' + esc(v) + '</option>'; }).join('');
  };

  function barraFiltros() {

  // Lector de fechas escritas en español (misma lógica que fechas.js de la app)

  const MESES = { enero: 1, ene: 1, febrero: 2, feb: 2, marzo: 3, mar: 3, abril: 4, abr: 4, mayo: 5, may: 5, junio: 6, jun: 6,

  const ENLACE = /(?:\s|^)(?:(?:como\s+(?:muy\s+)?tarde|a\s+m[aá]s\s+tardar|antes\s+de(?:l)?|para(?:\s+el)?|hasta(?:\s+el)?|con\s+fecha|nlt:?|plazo:?|vence|fecha\s+l[ií]mite:?|el|la|del|de|y|,|-|:)\s*)+$/i;

  function fechaValida(y, m, d) {

  }

    if (f && f < hoy) return fechaValida(hoy.getFullYear() + 1, m, d);

  function interpretar(texto, ahora = new Date()) {
    const hoy = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate());
    const res = { titulo: texto.trim(), nlt: '', hora: '', prioridad: '', categoria: '', trozos: [] };
    let t = ` ${texto} `;
    const quitar = (m, desc) => { res.trozos.push(desc); t = t.slice(0, m.index) + ' ' + t.slice(m.index + m[0].length); };
    const mas = n => { const d = new Date(hoy); d.setDate(d.getDate() + n); return d; };
    const buscar = re => re.exec(t);
    let fecha = null, m;

    // Categoría: #Palabra

    // Prioridad

    else if ((m = buscar(/(?:\s!(?=\s)|\b(?:urgente|urgent[ií]simo|prioritari[ao])\b)/i))) { res.prioridad = 'alta'; quitar(m, 'prioridad'); }

    // Hora: «a las 10», «a las 9:30», «10:00», «10h», «10.30 h»
    if ((m = buscar(/\b(?:a\s+las?\s+)(\d{1,2})(?:[:.h](\d{2}))?\s*(?:h(?:oras)?\b)?/i)) || (m = buscar(/\b(\d{1,2}):(\d{2})\b/))
      || (m = buscar(/\b(\d{1,2})(?:\.(\d{2}))?\s*h(?:oras)?\b/i))) {

    }
    if (!fecha && (m = buscar(/\b(\d{1,2})\s*(?:de\s+)?(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre|ene|feb|mar|abr|may|jun|jul|ago|sept|sep|oct|nov|dic)\.?(?:\s+(?:de|del)?\s*(\d{4}))?\b/i))) {
      fecha = conAnio(MESES[m[2].toLowerCase()], +m[1], m[3] ? +m[3] : 0, hoy);
    }
    if (!fecha && (m = buscar(/\bpasado\s+ma[ñn]ana\b/i))) fecha = mas(2);
    if (!fecha && (m = buscar(/(?<!(?:por|de)\s+la\s+)\bma[ñn]ana\b/i))) fecha = mas(1);

    if (!fecha && (m = buscar(/\b(?:(pr[oó]xim[oa]|siguiente|este|esta)\s+)?(lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado|domingo)(\s+(?:que\s+viene|pr[oó]ximo|de\s+la\s+semana\s+que\s+viene))?\b/i))) {

    // Título: sin los trozos reconocidos ni las palabras de enlace que quedan colgando
    let titulo = t.replace(/\s+/g, ' ').trim();
    for (let i = 0; i < 3; i++) titulo = titulo.replace(ENLACE, '').replace(/^[\s,;:\-–]+|[\s,;:\-–]+$/g, '').trim();
    titulo = titulo.replace(/\s+(?:antes\s+de(?:l)?|para\s+el|hasta\s+el|el)\s+(?=,|$)/i, '').trim();
    res.titulo = titulo ? titulo[0].toUpperCase() + titulo.slice(1) : texto.trim();
    return res;
  }

  var digest = null, digestHasta = 0, usuariosSitio = null;
  function obtenerDigest() {
    if (digest && Date.now() < digestHasta) return Promise.resolve(digest);
    return fetch(web.url + '/_api/contextinfo', { method: 'POST', credentials: 'same-origin', headers: { Accept: 'application/json;odata=verbose' } })
      .then(function (r) { if (!r.ok) throw new Error('Colabora no da permiso de escritura (HTTP ' + r.status + ')'); return r.json(); })
      .then(function (d) {
        var i = d.d ? d.d.GetContextWebInformation : d;
        digest = i.FormDigestValue; digestHasta = Date.now() + ((i.FormDigestTimeoutSeconds || 1800) - 60) * 1000;
        return digest;
      });
  }
  function crearElemento(cuerpo) {
    return obtenerDigest().then(function (dg) {
      return fetch(urlLista() + '/items', { method: 'POST', credentials: 'same-origin', body: JSON.stringify(cuerpo),
        headers: { Accept: 'application/json;odata=verbose', 'Content-Type': 'application/json;odata=verbose', 'X-RequestDigest': dg } });
    }).then(function (r) {
      return r.text().then(function (txt) {
        var j = null; try { j = JSON.parse(txt); } catch (e) { /* respuesta sin JSON */ }
        if (!r.ok) {
          var m = j && ((j.error && j.error.message && (j.error.message.value || j.error.message)) || (j['odata.error'] && j['odata.error'].message && j['odata.error'].message.value));
          throw new Error(r.status === 403 ? 'No tienes permiso para añadir elementos a la lista' : (m || 'HTTP ' + r.status));
        }
        return j && (j.d || j);
      });
    });
  }
  function cargarUsuarios() {
    if (usuariosSitio) return Promise.resolve(usuariosSitio);
    var m = new Map();
    var poner = function (u) { if (u && u.Id && u.Title && !m.has(u.Id)) m.set(u.Id, { Id: u.Id, Title: u.Title, Email: u.Email || u.EMail || '' }); };
    if (yo) poner(yo);
    tareas.forEach(function (t) { t.usuarios.forEach(poner); });
    return api(web.url + '/_api/web/siteusers?$select=Id,Title,Email,PrincipalType&$filter=PrincipalType eq 1&$top=5000')
      .then(function (d) { lista(d.value).forEach(poner); }).catch(function () { /* solo los que ya aparecen en la lista */ })
      .then(function () { usuariosSitio = Array.from(m.values()).sort(function (a, b) { return a.Title.localeCompare(b.Title, 'es'); }); return usuariosSitio; });
  }
  var usuarioPorNombre = function (n) { n = sinTildes(String(n || '').trim()); return (usuariosSitio || []).find(function (u) { return sinTildes(u.Title) === n; }); };
  var comoTexto = function (campo, v) { return infoCampo[campo] && infoCampo[campo].rico ? esc(v).replace(/\n/g, '<br>') : v; };
  var AREA = 'style="width:100%;font:inherit;padding:8px;border:1px solid var(--line);border-radius:10px"';

  function formularioNuevo(texto) {
    var r = texto ? interpretar(texto) : { titulo: '', nlt: '', prioridad: '' };
    var ests = valores('ESTADO', 'estado'), prios = valores('Prioridad', 'prioridad');
    var estIni = ests.find(function (e) { return claseEstado(e) === 'pendiente'; }) || ests[0] || '';
    var prioIni = r.prioridad ? (prios.find(function (p) { return clasePrio(p) === r.prioridad; }) || '') : '';
    var negs = valores('NegociadoAsignado', 'negociado').sort();
    var negsImpl = campos.NegociadosImplicados && campos.NegociadosImplicados.length ? campos.NegociadosImplicados : negs;
    var base = listaInfo && listaInfo.RootFolder ? location.origin + listaInfo.RootFolder.ServerRelativeUrl : '';
    var obligNlt = infoCampo.FechaVencimiento && infoCampo.FechaVencimiento.obligatorio;
    var dlg = $('#dlg');
    dlg.innerHTML = '<div class="dh"><h2>Nuevo asunto en «' + esc(pref.lista) + '»</h2><button data-cerrar style="background:transparent;color:#fff;border:0;font-size:1.3rem">✕</button></div><div class="db" id="fNuevo">' +
      '<label class="lbl">Asunto *</label><input name="Title" value="' + esc(r.titulo || texto || '') + '">' +
      '<p class="small muted" id="nDetect"></p>' +
      '<div class="grid"><div><label class="lbl">Fecha vencimiento (NLT)' + (obligNlt ? ' *' : '') + '</label><input type="date" name="nlt" value="' + (r.nlt || '') + '"></div>' +
      '<div><label class="lbl">Fecha de inicio</label><input type="date" name="inicio" value="' + hoy() + '"></div>' +
      '<div><label class="lbl">Estado</label><select name="ESTADO">' + opciones(ests, estIni, '—') + '</select></div>' +
      '<div><label class="lbl">Prioridad</label><select name="Prioridad">' + opciones(prios, prioIni, '—') + '</select></div>' +
      '<div><label class="lbl">Negociado asignado</label><select name="NegociadoAsignado">' + opciones(negs, pref.negociado, '—') + '</select></div>' +
      '<div><label class="lbl">Responsable de la información</label><input name="resp" list="dlUsuarios" value="' + esc(yo ? yo.Title : '') + '" placeholder="Nombre de la persona"></div></div>' +
      '<label class="lbl">Personal implicado</label><div id="nImpl" class="meta"></div>' +
      '<div style="display:flex;gap:6px;margin-top:4px"><input id="nImplTxt" list="dlUsuarios" placeholder="Añadir persona (Intro)"><button type="button" id="nImplAdd">＋</button></div>' +
      (negsImpl.length ? '<label class="lbl">Negociados implicados</label><div>' + negsImpl.map(function (n) { return '<label class="check"><input type="checkbox" name="negImpl" value="' + esc(n) + '"> ' + esc(n) + '</label>'; }).join('') + '</div>' : '') +
      '<label class="lbl">Control expediente</label><input name="ControlExpediente">' +
      '<label class="lbl">Descripción del asunto</label><textarea name="DescripcionDelAsunto" rows="4" ' + AREA + '></textarea>' +
      '<label class="lbl">Observaciones</label><textarea name="Comentarios" rows="2" ' + AREA + '></textarea>' +
      '<datalist id="dlUsuarios"></datalist>' +
      '<p class="small muted">Se creará en la lista compartida de Colabora, igual que si lo dieras de alta allí: los avisos o flujos automáticos de la lista se ejecutarán como siempre.</p>' +
      '<div class="error" id="nError" hidden></div>' +
      '<div class="acciones"><button type="button" data-cerrar>Cancelar</button><button type="button" class="btn prim" id="nCrear">Crear en Colabora</button></div>' +
      (base ? '<p class="small"><a href="' + esc(base + '/NewForm.aspx?Source=' + encodeURIComponent(location.href)) + '">Prefiero el formulario de Colabora</a></p>' : '') + '</div>';
    dlg.showModal();
    var implicados = [];
    var err = function (m) { $('#nError').hidden = false; $('#nError').textContent = m; };
    var pintarImpl = function () {
      $('#nImpl').innerHTML = implicados.map(function (u, i) { return '<span class="chip">' + esc(u.Title) + ' <a href="#" data-quitarimpl="' + i + '">✕</a></span>'; }).join('') || '<span class="small muted">Nadie</span>';
    };
    pintarImpl();
    cargarUsuarios().then(function (us) { var dl = $('#dlUsuarios'); if (dl) dl.innerHTML = us.map(function (u) { return '<option value="' + esc(u.Title) + '">'; }).join(''); });
    var anadirImpl = function () {
      var txt = $('#nImplTxt').value.trim();
      if (!txt) return;
      var u = usuarioPorNombre(txt);
      if (!u) return err('No encuentro a «' + txt + '» entre los usuarios del sitio: elígelo de la lista desplegable.');
      $('#nError').hidden = true;
      if (!implicados.some(function (x) { return x.Id === u.Id; })) implicados.push(u);
      $('#nImplTxt').value = ''; pintarImpl();
    };
    $('#nImplAdd').onclick = anadirImpl;
    $('#nImplTxt').onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); anadirImpl(); } };
    $('#nImpl').onclick = function (e) { var q = e.target.closest('[data-quitarimpl]'); if (q) { e.preventDefault(); implicados.splice(Number(q.dataset.quitarimpl), 1); pintarImpl(); } };
    // Fechas escritas en el asunto («antes del viernes»): se usan como NLT si no se elige otra
    var tit = $('#fNuevo [name=Title]');
    tit.oninput = function () {
      var x = interpretar(tit.value);
      $('#nDetect').textContent = x.nlt && !$('#fNuevo [name=nlt]').value ? 'Fecha detectada en el texto: ' + fLarga(x.nlt) + ' (se usará como NLT)' : '';
    };
    $('#nCrear').onclick = function () {
      var f = $('#fNuevo');
      var v = function (n) { return (f.querySelector('[name=' + n + ']').value || '').trim(); };
      var x = interpretar(v('Title'));
      var nlt = v('nlt') || x.nlt;
      var asunto = v('nlt') ? v('Title') : (x.titulo || v('Title'));
      if (!asunto) return err('Escribe el asunto.');
      if (!nlt && obligNlt) return err('La fecha de vencimiento es obligatoria en esta lista.');
      var resp = v('resp') ? usuarioPorNombre(v('resp')) : null;
      if (v('resp') && !resp) return err('No encuentro al responsable «' + v('resp') + '» entre los usuarios del sitio: elígelo de la lista desplegable.');
      if (!listaInfo || !listaInfo.ListItemEntityTypeFullName) return err('No he podido leer el tipo de la lista; pulsa Actualizar y vuelve a intentarlo.');
      var cuerpo = { __metadata: { type: listaInfo.ListItemEntityTypeFullName }, Title: asunto };
      var fecha = function (s) { return aFecha(s).toISOString(); };
      if (nlt) cuerpo.FechaVencimiento = fecha(nlt);
      if (v('inicio')) cuerpo.FechaDeInicio = fecha(v('inicio'));
      ['ESTADO', 'Prioridad', 'NegociadoAsignado'].forEach(function (k) { if (v(k)) cuerpo[k] = v(k); });
      var negImpl = Array.from(f.querySelectorAll('[name=negImpl]:checked')).map(function (c) { return c.value; });
      if (negImpl.length) cuerpo.NegociadosImplicados = { __metadata: { type: 'Collection(Edm.String)' }, results: negImpl };
      ['ControlExpediente', 'DescripcionDelAsunto', 'Comentarios'].forEach(function (k) { if (v(k)) cuerpo[k] = comoTexto(k, v(k)); });
      if (resp) {
        cuerpo.ResponsableDeLaInformacionId = resp.Id;
        cuerpo.NombreResponsable = resp.Title;
        if (resp.Email) cuerpo.correoResponsable = resp.Email;
      }
      if (implicados.length) {
        cuerpo.PersonalImplicado0Id = { results: implicados.map(function (u) { return u.Id; }) };
        cuerpo.NombreImplicados = implicados.map(function (u) { return u.Title; }).join('; ');
        var mails = implicados.map(function (u) { return u.Email; }).filter(Boolean);
        if (mails.length) cuerpo.correoimplicados = mails.join('; ');
      }
      $('#nCrear').disabled = true; $('#nCrear').textContent = 'Creando…';
      crearElemento(cuerpo).then(function (nuevo) {
        $('#dlg').close();
        if ($('#altaRapida')) $('#altaRapida').value = '';
        aviso('Asunto creado en Colabora');
        return cargar().then(function () { if (nuevo && nuevo.Id) abrir(nuevo.Id); });
      }).catch(function (e) {
        $('#nCrear').disabled = false; $('#nCrear').textContent = 'Crear en Colabora';
        err('No se pudo crear: ' + (e.message || e));
      });
    };
  }

  // ---------- Ajustes ----------
  function vistaAjustes() {
    var ests = valores('ESTADO', 'estado');
    return '<div class="card"><h3 style="margin-top:0">Lista de SharePoint</h3>' +
      '<p class="small muted">Sitio: ' + esc(web ? (web.titulo || '') + ' (' + web.url + ')' : '—') + '<br>Usuario: ' + esc(yo ? yo.Title : '—') +
      (listaInfo ? '<br>Lista: «' + esc(listaInfo.Title) + '», ' + listaInfo.ItemCount + ' elementos' : '') + (cargadoEn ? '<br>Leída a las ' + cargadoEn.toLocaleTimeString('es-ES') : '') + '</p>' +
      '<label class="lbl">Nombre de la lista</label><input id="aLista" value="' + esc(pref.lista) + '">' +
      '<label class="lbl">Marcar en naranja cuando queden (días)</label><input id="aDias" type="number" min="1" max="30" value="' + pref.avisoDias + '"></div>' +
      '<div class="card"><h3 style="margin-top:0">Cómo se interpreta cada ESTADO</h3><p class="small muted">Sirve para saber qué asuntos siguen abiertos. Un asunto con «fecha finalización» cuenta siempre como terminado.</p>' +
      (ests.map(function (e) {
        return '<div class="grid" style="align-items:center;margin:4px 0"><div><b>' + esc(e) + '</b></div><div><select data-mapa="' + esc(e) + '">' +
          Object.keys(CLASES).map(function (k) { return '<option value="' + k + '"' + (claseEstado(e) === k ? ' selected' : '') + '>' + CLASES[k] + '</option>'; }).join('') + '</select></div></div>';
      }).join('') || '<p class="muted">Aún no se han leído los estados.</p>') + '</div>' +
      '<div class="card"><h3 style="margin-top:0">Privacidad</h3><p class="small">Esta página funciona dentro de Colabora con tu sesión. Lee la lista y <b>solo escribe cuando das de alta un asunto nuevo</b> (no modifica ni borra los existentes). No envía nada fuera del servidor. ' +
      'Tus preferencias (filtros, estados, informe) se guardan solo en este navegador.</p></div>';
  }

  // ---------- Detalle de un asunto ----------
  function abrir(id) {
    var t = tareas.find(function (x) { return x.id === id; });
    if (!t) return;
    var base = listaInfo && listaInfo.RootFolder ? location.origin + listaInfo.RootFolder.ServerRelativeUrl : '';
    var volver = encodeURIComponent(location.href);
    var u = urgencia(t);
    var c = [['Estado', t.estado], ['Prioridad', t.prioridad], ['NLT (fecha vencimiento)', t.nlt ? fLarga(t.nlt) + ' · ' + u.txt : '—'], ['Fecha de inicio', t.inicio && fLarga(t.inicio)],
      ['Fecha finalización', t.fin && fLarga(t.fin)], ['Responsable de la información', t.responsable], ['Personal implicado', t.implicados.join(', ')],
      ['Negociado asignado', t.negociado], ['Negociados implicados', t.negociados.join(', ')], ['Control expediente', t.expediente], ['Descripción del asunto', t.descripcion],
      ['Observaciones', t.observaciones], ['Registro de actividad', t.registro],
      ['Creado', new Date(t.creada).toLocaleString('es-ES') + (t.autor ? ' por ' + t.autor : '')], ['Modificado', new Date(t.modificada).toLocaleString('es-ES') + (t.editor ? ' por ' + t.editor : '')]];
    var dlg = $('#dlg');
    dlg.innerHTML = '<div class="dh"><h2>' + esc(t.asunto) + '</h2><button data-cerrar style="background:transparent;color:#fff;border:0;font-size:1.3rem">✕</button></div><div class="db">' +
      c.filter(function (x) { return x[1]; }).map(function (x) { return '<div class="campo"><b>' + esc(x[0]) + '</b><div>' + esc(x[1]) + '</div></div>'; }).join('') +
      (base ? '<div class="acciones"><a class="btn" href="' + esc(base + '/DispForm.aspx?ID=' + t.id + '&Source=' + volver) + '">Ver en Colabora</a>' +
        (t.correoResp.length && t.clase !== 'hecha' ? '<a class="btn" href="' + esc(correoTarea(t)) + '">✉ Recordar por correo</a>' : '') +
        '<a class="btn prim" href="' + esc(base + '/EditForm.aspx?ID=' + t.id + '&Source=' + volver) + '">Editar en Colabora</a></div>' : '') + '</div>';
    dlg.showModal();
  }

  var aviso = function (txt) { $('#estadoCarga').textContent = txt; setTimeout(function () { if (cargadoEn) $('#estadoCarga').textContent = tareas.length + ' asuntos · ' + cargadoEn.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }); }, 2500); };

  // ---------- Navegación y eventos ----------
  function render() {
    document.querySelectorAll('#tabs a').forEach(function (a) { a.classList.toggle('on', a.dataset.v === pref.vista); });
    var v = { nlt: vistaNlt, calendario: vistaCalendario, avisos: vistaAvisos, informes: vistaInformes, ajustes: vistaAjustes }[pref.vista] || vistaNlt;
    if (!cargadoEn && pref.vista !== 'ajustes') return;
    $('#vista').innerHTML = v();
  }

  document.addEventListener('click', function (e) {
    var el = e.target;
    var tab = el.closest('#tabs a');
    if (tab) { pref.vista = tab.dataset.v; kpiSel = ''; guardarPref(); render(); return; }
    if (el.closest('#recargar')) { cargar(); return; }
    if (el.closest('[data-cerrar]')) { $('#dlg').close(); return; }
    var k = el.closest('[data-kpi]');
    if (k) { kpiSel = kpiSel === k.dataset.kpi ? '' : k.dataset.kpi; render(); return; }
    var d = el.closest('[data-dia]');
    if (d) { diaSel = d.dataset.dia; render(); return; }
    var m = el.closest('[data-mes]');
    if (m) { mes = new Date(mes.getFullYear(), mes.getMonth() + Number(m.dataset.mes), 1); render(); return; }
    var p = el.closest('[data-infper]');
    if (p) { var r = periodo(p.dataset.infper); $('#infOpts [name=desde]').value = r[0]; $('#infOpts [name=hasta]').value = r[1]; actualizarInf(); return; }
    var env = el.closest('[data-enviado]');
    if (env) { pref.enviados = Object.fromEntries(Object.entries(pref.enviados || {}).filter(function (x) { return x[0].indexOf(hoy()) >= 0; })); pref.enviados[claveEnviado(env.dataset.enviado)] = 1; guardarPref(); setTimeout(render, 300); return; }
    var ab = el.closest('[data-abrir]');
    if (ab) { e.preventDefault(); abrir(Number(ab.dataset.abrir)); return; }
    var ic = el.closest('[data-ics]');
    if (ic) {
      var o = avisoOpc(); o.alarma = Math.max(0, Number($('#alarmaDias').value) || 0); pref.avisos = o; guardarPref();
      var r = icsAsuntos(ic.dataset.ics, o.alarma);
      if (!r.n) { aviso('No hay asuntos abiertos con NLT'); return; }
      descargar('nlt-colabora-' + hoy() + '.ics', r.txt, 'text/calendar;charset=utf-8'); aviso(r.n + ' citas exportadas');
      return;
    }
    var inf = el.closest('[data-inf]');
    if (inf) { accionInforme(inf.dataset.inf); return; }
    if (el.closest('#nuevo')) { if (cargadoEn) formularioNuevo(''); return; }
    if (el.closest('#altaRapidaBtn')) { formularioNuevo($('#altaRapida').value.trim()); return; }
    var t = el.closest('.tarea');
    if (t) abrir(Number(t.dataset.id));
  });
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.closest('#infOpts')) { actualizarInf(); return; }
    if (el.closest('#avOpts')) { pref.avisos = leerAvisos(); guardarPref(); render(); return; }
    if (el.id === 'fquien') pref.quien = el.value;
    else if (el.id === 'fneg') pref.negociado = el.value;
    else if (el.id === 'fest') pref.estado = el.value;
    else if (el.id === 'fprio') pref.prio = el.value;
    else if (el.id === 'aDias') pref.avisoDias = Math.max(1, Number(el.value) || 3);
    else if (el.id === 'aLista') { pref.lista = el.value.trim() || 'Gestor de Tareas'; guardarPref(); listaInfo = null; cargar(); return; }
    else if (el.dataset.mapa !== undefined) {
      pref.mapaEstados[el.dataset.mapa] = el.value;
      tareas.forEach(function (t) { t.clase = t.fin ? 'hecha' : claseEstado(t.estado); });
    } else return;
    guardarPref(); render();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.id === 'altaRapida') { e.preventDefault(); formularioNuevo(e.target.value.trim()); }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id !== 'fq') return;
    pref.q = e.target.value; guardarPref();
    var pos = e.target.selectionStart; render();
    var i = $('#fq'); if (i) { i.focus(); i.setSelectionRange(pos, pos); }
  });

  render();
  cargar();
})();
</script>
