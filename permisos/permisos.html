<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solicitud de permisos · SUIGESUR</title>
<!--
  [PERMISOS] Solicitud, aprobación, autorización y registro de permisos sobre la lista «Solicitud de Permisos» del sitio
  CALIDAD-VIDA de Colabora, con la sesión del usuario. Reproduce las reglas del formulario InfoPath (ver CIRCUITO.md)
  para que ambos convivan: mismos estados, mismos campos de texto y correo, mismos avisos por correo.
  Escribe solo al guardar o tramitar una solicitud, con los permisos del usuario; nunca borra. No carga ni envía nada
  fuera del servidor.
-->
<style>
  :root {
    --bg: #f3f5f8; --surface: #fff; --surface-2: #e8eef6; --text: #1b2430; --muted: #5a6575; --line: #d5dce6;
    --brand: #1b3a5c; --on-brand: #fff; --oro: #b8962e;
    --ok: #2e7d32; --ok-bg: #dcefdc; --warn: #9a5b00; --warn-bg: #fdebc8; --bad: #b71c1c; --bad-bg: #fbdada;
    --info: #1d4f91; --info-bg: #dde8f7; --na: #555; --na-bg: #e7e7e7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  /* Cabecera oficial: franja blanca con el logo del Ministerio y «USO OFICIAL»; banda azul con el título */
  .oficial { background: #fff; border-bottom: 1px solid var(--line); }
  .oficial > div { max-width: 1100px; margin: 0 auto; padding: 6px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; }
  .oficial .izq { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .oficial .minisdef { height: 46px; }
  .oficial .org { flex: 1; font-size: .78rem; color: #333; letter-spacing: .06em; line-height: 1.3; border-left: 1px solid #bbb; padding-left: 12px; }
  .oficial .org b { font-size: .86rem; letter-spacing: .08em; }
  .oficial .uso { height: 28px; }
  .top { position: sticky; top: 0; z-index: 5; background: linear-gradient(90deg, #102840, var(--brand) 55%, #24507a); color: var(--on-brand); border-bottom: 4px solid var(--oro); box-shadow: 0 2px 6px rgba(0,0,0,.25); }
  .top > div { max-width: 1100px; margin: 0 auto; padding: 8px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .top .tit { flex: 1; min-width: 220px; }
  .top h1 { margin: 0; font-size: 1.25rem; letter-spacing: .05em; font-weight: 800; }
  .top .sub { display: block; font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; color: #e6d9a8; }
  .top .estado { font-size: .8rem; opacity: .9; }
  .top button { background: rgba(255,255,255,.12); color: inherit; border: 1px solid rgba(232,215,160,.5); }
  .top button:hover { background: rgba(255,255,255,.22); }
  @media (max-width: 600px) { .oficial .org { display: none; } .oficial > div { grid-template-columns: auto 1fr; } .oficial .uso { justify-self: end; } .top h1 { font-size: 1rem; } }
  main { max-width: 1100px; margin: 0 auto; padding: 0 16px 60px; }
  nav.tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 12px; margin: 12px 0; flex-wrap: wrap; }
  nav.tabs a { flex: 1; text-align: center; padding: 8px 4px; border-radius: 9px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: .9rem; cursor: pointer; white-space: nowrap; }
  nav.tabs a.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  nav.tabs a i { font-style: normal; background: var(--bad); color: #fff; border-radius: 999px; padding: 0 7px; margin-left: 4px; font-size: .78rem; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .muted { color: var(--muted); } .small { font-size: .85rem; }
  button, .btn { font: inherit; font-size: .9rem; font-weight: 600; padding: 7px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--text); cursor: pointer; text-decoration: none; display: inline-block; text-align: center; }
  button:disabled { opacity: .55; cursor: default; }
  .prim { background: var(--brand); color: #fff; border-color: var(--brand); }
  .peligro { background: var(--bad); color: #fff; border-color: var(--bad); }
  input, select, textarea { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff; width: 100%; }
  textarea { min-height: 6em; resize: vertical; }
  label.lbl { display: block; font-size: .82rem; font-weight: 600; color: var(--muted); margin: 10px 0 3px; }
  label.check { display: inline-flex; gap: 6px; align-items: center; margin: 8px 12px 4px 0; font-size: .95rem; }
  label.check input { width: auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px 12px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 8px 0 12px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; font-size: .82rem; color: var(--muted); }
  .kpi b { display: block; font-size: 1.5rem; color: var(--text); }
  .kpi.borrador { background: #f1f1ef; border-color: #c9c9c4; border-top: 5px solid #8a8a84; } .kpi.borrador b { color: #55554f; }
  .kpi.tramite { background: #fff4dc; border-color: #f0d08a; border-top: 5px solid #d99a00; } .kpi.tramite b { color: #9a5b00; }
  .kpi.concedido { background: #e3f2e3; border-color: #a9d3a9; border-top: 5px solid #2e7d32; } .kpi.concedido b { color: #2e7d32; }
  .kpi.proximo { background: #efe7f8; border-color: #c9b3e6; border-top: 5px solid #6a3d9a; } .kpi.proximo b { color: #6a3d9a; }
  .sec { margin: 18px 0 6px; font-size: .85rem; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; display: flex; justify-content: space-between; font-weight: 700; }
  .sol { cursor: pointer; border-left: 5px solid var(--line); }
  .sol:hover { border-color: var(--brand); }
  .sol .tit { font-weight: 650; }
  .meta { display: flex; flex-wrap: wrap; gap: 5px 10px; margin-top: 4px; font-size: .84rem; align-items: center; }
  .badge { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: .75rem; font-weight: 700; white-space: nowrap; }
  .e0 { background: var(--na-bg); color: var(--na); } .e1 { background: var(--warn-bg); color: var(--warn); } .e2 { background: var(--info-bg); color: var(--info); }
  .e3 { background: var(--ok-bg); color: var(--ok); } .e4 { background: #2e7d32; color: #fff; } .e5 { background: var(--bad-bg); color: var(--bad); }
  .vacio { padding: 18px; text-align: center; color: var(--muted); }
  .aviso { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
  .error { background: var(--bad-bg); color: var(--bad); border-radius: 10px; padding: 10px 12px; margin: 10px 0; font-weight: 600; }
  .okmsg { background: var(--ok-bg); color: var(--ok); border-radius: 10px; padding: 10px 12px; margin: 10px 0; font-weight: 600; }
  .acciones { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
  .cal .dow { text-align: center; font-size: .75rem; color: var(--muted); font-weight: 700; }
  .dia { min-height: 86px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 3px 4px; font-size: .72rem; overflow: hidden; }
  .dia.fuera { opacity: .4; } .dia.hoy { outline: 2px solid var(--brand); }
  .dia b { font-size: .8rem; }
  /* Calendario: azul = mis permisos; morado = los que he aprobado, autorizado o registrado; gris = el resto; naranja = pendientes de aprobar */
  .dia span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: #e6e9ee; color: #3d4654; border-radius: 4px; padding: 0 3px; margin-top: 2px; cursor: pointer; }
  .dia span.m { background: #d6e6fa; color: #12407a; font-weight: 600; } .dia span.t { background: #ece2f8; color: #5b2f8c; }
  .dia span.p { background: var(--warn-bg); color: var(--warn); }
  .leyenda { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .8rem; color: var(--muted); margin: 6px 0; }
  .leyenda i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; }
  .espera { background: var(--na-bg); color: var(--na); } .espera.tarde { background: var(--bad-bg); color: var(--bad); }
  table.t.resumen td:not(:first-child), table.t.resumen th:not(:first-child) { text-align: right; }
  /* Registro SIPERDEF: rojo = pendiente de registro; verde = registrado (estado final) */
  .regpend { background: var(--bad); color: #fff; border-color: var(--bad); line-height: 1.2; font-size: .8rem; padding: 6px 8px; }
  .regconf { background: #d99a00; color: #fff; border-color: #d99a00; }
  .regok { display: inline-block; background: #2e7d32; color: #fff; border-radius: 9px; padding: 6px 8px; font-weight: 700; font-size: .8rem; line-height: 1.2; }
  button.verde { background: #2e7d32; color: #fff; border-color: #2e7d32; }
  .solape { background: #fff4dc; border-left: 4px solid #d99a00; border-radius: 8px; padding: 8px 10px; margin: 8px 0; font-size: .9rem; }
  table.t { width: 100%; border-collapse: collapse; font-size: .85rem; }
  table.t th, table.t td { padding: 5px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  table.t button { white-space: nowrap; }
  dialog { width: min(1200px, calc(100vw - 24px)); height: calc(100vh - 24px); max-height: calc(100vh - 24px); border: 0; border-radius: 14px; padding: 0; font-size: 16px; }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog input, dialog select, dialog textarea, dialog button, dialog .btn { font-size: 16px; }
  .dh { position: sticky; top: 0; z-index: 2; background: var(--brand); border-bottom: 3px solid var(--oro); color: #fff; padding: 12px 18px; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  .dh h2 { margin: 0; font-size: 1.2rem; }
  .db { padding: 14px 20px 24px; }
  .ficha { display: grid; gap: 18px; }
  @media (min-width: 1000px) { .ficha { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; } }
  .campo { border-bottom: 1px solid var(--line); padding: 6px 0; }
  .campo b { display: block; font-size: .8rem; color: var(--muted); }
  .campo div { white-space: pre-wrap; overflow-wrap: anywhere; }
  .panel { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
  .panel h3 { margin: 0 0 6px; font-size: 1.02rem; }
  .sugs { border: 1px solid var(--line); border-radius: 10px; margin-top: 4px; max-height: 240px; overflow: auto; background: #fff; }
  .sugs button { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; padding: 8px 10px; font-weight: 400; }
  .sugs button:hover { background: var(--surface-2); }
  .elegido { font-weight: 600; margin-top: 4px; }
  @media (max-width: 600px) { .kpis { grid-template-columns: repeat(2, 1fr); } .dia { min-height: 54px; } }
</style>
</head>
