<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Permisos · Calidad de Vida</title>
<!--
  [PERMISOS] Solicitud, aprobación, autorización y registro de permisos sobre la lista «Solicitud de Permisos» del sitio
  CALIDAD-VIDA de Colabora, con la sesión del usuario. Reproduce las reglas del formulario InfoPath (ver CIRCUITO.md)
  para que ambos convivan: mismos estados, mismos campos de texto y correo, mismos avisos por correo.
  Escribe solo al guardar o tramitar una solicitud, con los permisos del usuario; nunca borra. No carga ni envía nada
  fuera del servidor.
-->
<style>
  :root {
    --bg: #f4f5f0; --surface: #fff; --surface-2: #eef1ea; --text: #1f261f; --muted: #5f685f; --line: #d9ddd3;
    --brand: #3b4a2f; --on-brand: #fff;
    --ok: #2e7d32; --ok-bg: #dcefdc; --warn: #9a5b00; --warn-bg: #fdebc8; --bad: #b71c1c; --bad-bg: #fbdada;
    --info: #1d4f91; --info-bg: #dde8f7; --na: #555; --na-bg: #e7e7e7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .top { position: sticky; top: 0; z-index: 5; background: var(--brand); color: var(--on-brand); padding: 10px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .top h1 { margin: 0; font-size: 1.05rem; flex: 1; min-width: 180px; }
  .top .estado { font-size: .8rem; opacity: .9; }
  .top button { background: rgba(255,255,255,.15); color: inherit; border: 0; }
  main { max-width: 1100px; margin: 0 auto; padding: 0 16px 60px; }
  nav.tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 12px; margin: 12px 0; flex-wrap: wrap; }
  nav.tabs a { flex: 1; text-align: center; padding: 8px 4px; border-radius: 9px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: .9rem; cursor: pointer; white-space: nowrap; }
  nav.tabs a.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  nav.tabs a i { font-style: normal; background: var(--bad); color: #fff; border-radius: 999px; padding: 0 7px; margin-left: 4px; font-size: .78rem; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .muted { color: var(--muted); } .small { font-size: .85rem; }
  button, .btn { font: inherit; font-size: .9rem; font-weight: 600; padding: 7px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--text); cursor: pointer; text-decoration: none; display: inline-block; text-align: center; }
  button:disabled { opacity: .55; cursor: default; }
  .prim { background: var(--brand); color: #fff; border-color: var(--brand); }
  .peligro { background: var(--bad); color: #fff; border-color: var(--bad); }
  input, select, textarea { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff; width: 100%; }
  textarea { min-height: 6em; resize: vertical; }
  label.lbl { display: block; font-size: .82rem; font-weight: 600; color: var(--muted); margin: 10px 0 3px; }
  label.check { display: inline-flex; gap: 6px; align-items: center; margin: 8px 12px 4px 0; font-size: .95rem; }
  label.check input { width: auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px 12px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 8px 0 12px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; font-size: .82rem; color: var(--muted); }
  .kpi b { display: block; font-size: 1.5rem; color: var(--text); }
  .sec { margin: 18px 0 6px; font-size: .85rem; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; display: flex; justify-content: space-between; font-weight: 700; }
  .sol { cursor: pointer; border-left: 5px solid var(--line); }
  .sol:hover { border-color: var(--brand); }
  .sol .tit { font-weight: 650; }
  .meta { display: flex; flex-wrap: wrap; gap: 5px 10px; margin-top: 4px; font-size: .84rem; align-items: center; }
  .badge { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: .75rem; font-weight: 700; white-space: nowrap; }
  .e0 { background: var(--na-bg); color: var(--na); } .e1 { background: var(--warn-bg); color: var(--warn); } .e2 { background: var(--info-bg); color: var(--info); }
  .e3 { background: var(--ok-bg); color: var(--ok); } .e4 { background: var(--brand); color: #fff; } .e5 { background: var(--bad-bg); color: var(--bad); }
  .vacio { padding: 18px; text-align: center; color: var(--muted); }
  .aviso { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
  .error { background: var(--bad-bg); color: var(--bad); border-radius: 10px; padding: 10px 12px; margin: 10px 0; font-weight: 600; }
  .okmsg { background: var(--ok-bg); color: var(--ok); border-radius: 10px; padding: 10px 12px; margin: 10px 0; font-weight: 600; }
  .acciones { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
  .cal .dow { text-align: center; font-size: .75rem; color: var(--muted); font-weight: 700; }
  .dia { min-height: 86px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 3px 4px; font-size: .72rem; overflow: hidden; }
  .dia.fuera { opacity: .4; } .dia.hoy { outline: 2px solid var(--brand); }
  .dia b { font-size: .8rem; }
  .dia span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--ok-bg); color: var(--ok); border-radius: 4px; padding: 0 3px; margin-top: 2px; }
  .dia span.p { background: var(--warn-bg); color: var(--warn); }
  table.t { width: 100%; border-collapse: collapse; font-size: .85rem; }
  table.t th, table.t td { padding: 5px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  dialog { width: min(1200px, calc(100vw - 24px)); height: calc(100vh - 24px); max-height: calc(100vh - 24px); border: 0; border-radius: 14px; padding: 0; font-size: 16px; }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog input, dialog select, dialog textarea, dialog button, dialog .btn { font-size: 16px; }
  .dh { position: sticky; top: 0; z-index: 2; background: var(--brand); color: #fff; padding: 12px 18px; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  .dh h2 { margin: 0; font-size: 1.2rem; }
  .db { padding: 14px 20px 24px; }
  .ficha { display: grid; gap: 18px; }
  @media (min-width: 1000px) { .ficha { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; } }
  .campo { border-bottom: 1px solid var(--line); padding: 6px 0; }
  .campo b { display: block; font-size: .8rem; color: var(--muted); }
  .campo div { white-space: pre-wrap; overflow-wrap: anywhere; }
  .panel { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
  .panel h3 { margin: 0 0 6px; font-size: 1.02rem; }
  .sugs { border: 1px solid var(--line); border-radius: 10px; margin-top: 4px; max-height: 240px; overflow: auto; background: #fff; }
  .sugs button { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; padding: 8px 10px; font-weight: 400; }
  .sugs button:hover { background: var(--surface-2); }
  .elegido { font-weight: 600; margin-top: 4px; }
  @media (max-width: 600px) { .kpis { grid-template-columns: repeat(2, 1fr); } .dia { min-height: 54px; } }
</style>
</head>
<body>
<header class="top">
  <h1>PERMISOS · CALIDAD DE VIDA</h1>
  <span class="estado" id="estadoCarga">Cargando…</span>
  <button id="nueva" title="Nueva solicitud de permiso">＋ Nueva solicitud</button>
  <button id="recargar" title="Volver a leer la lista">↻ Actualizar</button>
</header>
<main>
  <noscript><div class="error">Esta página necesita JavaScript.</div></noscript>
  <nav class="tabs" id="tabs"></nav>
  <div id="vista"><p class="muted">Leyendo la lista «Solicitud de Permisos»…</p></div>
</main>
<dialog id="dlg"></dialog>
<script>
(function () {
  'use strict';
  if (document.documentMode || !window.fetch || !window.Promise || !Element.prototype.closest) {
    document.getElementById('vista').innerHTML = '<div class="error">Tu navegador abre esta página en modo Internet Explorer o es muy antiguo. Ábrela en Microsoft Edge o Chrome.</div>';
    return;
  }
  var $ = function (s, el) { return (el || document).querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var iso = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  var hoy = function () { return iso(new Date()); };
  var aFecha = function (s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
  var fechaSP = function (v) { return v ? iso(new Date(v)) : ''; };
  var fCorta = function (s) { return s ? aFecha(s).toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' }) : ''; };
  var fLarga = function (s) { return s ? aFecha(s).toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }) : ''; };
  var sinTildes = function (s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); };
  var dias = function (a, b) { return a && b ? Math.round((aFecha(b) - aFecha(a)) / 864e5) + 1 : 0; };
  // Texto sin formato de un campo HTML (DOMParser no ejecuta nada)
  var texto = function (html) {
    if (!html) return '';
    if (!/[<&]/.test(html)) return String(html).trim();
    var d = new DOMParser().parseFromString(String(html).replace(/<br\s*\/?>/gi, '\n').replace(/<\/(p|div|li)>/gi, '\n'), 'text/html');
    return (d.body.textContent || '').replace(/​/g, '').replace(/\n{3,}/g, '\n\n').trim();
  };

  // ---------- Preferencias (solo en este navegador) ----------
  var CLAVE = 'permisos-calidad-vida';
  var pref = { sitio: '/et/SUIGESUR/colaborativo/CALIDAD-VIDA', lista: 'Solicitud de Permisos', vista: 'mias', correo: true,
    f: { q: '', estado: '', tipo: '', dependencia: '', unidad: '', cupo: '' }, cal: { dependencia: '', unidad: '', pendientes: true } };
  try { var g = JSON.parse(localStorage.getItem(CLAVE) || 'null'); if (g) pref = Object.assign(pref, g, { f: Object.assign(pref.f, g.f || {}), cal: Object.assign(pref.cal, g.cal || {}) }); } catch (e) { /* sin memoria local */ }
  var guardarPref = function () { try { localStorage.setItem(CLAVE, JSON.stringify(pref)); } catch (e) { /* sin memoria local */ } };

  // ---------- Estados (los del formulario InfoPath) ----------
  var E = { BS: '0-Borrador de Solicitante', BR: '0-Borrador de Representante', PA: '1-Pendiente de Aprobar', AP: '2-Aprobado',
    AU: '3-Autorizado', RG: '4-Registrado SIPERDEF', RE: '5-Rechazado', AN: '5-Anulado en SIPERDEF', SI: 'Sin Identificar Solicitante' };
  var claseEstado = function (e) { var n = String(e || '').charAt(0); return /[0-5]/.test(n) ? 'e' + n : 'e0'; };
  var esBorrador = function (t) { return t.estado === E.BS || t.estado === E.BR || t.estado === E.SI || !t.estado; };
  var concedido = function (t) { return t.estado === E.AP || t.estado === E.AU || t.estado === E.RG; };

  // ---------- SharePoint ----------
  var web = null, yo = null, misGrupos = [], listaInfo = null, opciones = {}, empleos = [], unidades = [], items = [], cargadoEn = null;
  function api(url) {
    var pedir = function (accept) {
      return fetch(url, { credentials: 'same-origin', headers: { Accept: accept } }).then(function (r) {
        if (!r.ok) { var e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
        return r.json();
      });
    };
    return pedir('application/json;odata=nometadata').catch(function (e) {
      if ([400, 406, 415].indexOf(e.status) < 0) throw e;
      return pedir('application/json;odata=verbose').then(function (d) {
        d = d.d || d;
        if (d.results) return { value: d.results, 'odata.nextLink': d.__next };
        return d;
      });
    });
  }
  var lista = function (v) { return v == null ? [] : Array.isArray(v) ? v : Array.isArray(v.results) ? v.results : []; };
  function todas(url) {
    var acc = [];
    var pag = function (u) { return api(u).then(function (d) { acc = acc.concat(lista(d.value)); var s = d['odata.nextLink'] || d['@odata.nextLink']; return s ? pag(s) : acc; }); };
    return pag(url);
  }
  var urlLista = function () { return web + "/_api/web/lists/getbytitle('" + encodeURIComponent(pref.lista.replace(/'/g, "''")) + "')"; };
  var digest = null, digestHasta = 0;
  function obtenerDigest() {
    if (digest && Date.now() < digestHasta) return Promise.resolve(digest);
    return fetch(web + '/_api/contextinfo', { method: 'POST', credentials: 'same-origin', headers: { Accept: 'application/json;odata=verbose' } })
      .then(function (r) { if (!r.ok) throw new Error('Colabora no da permiso de escritura (HTTP ' + r.status + ')'); return r.json(); })
      .then(function (d) { var i = d.d ? d.d.GetContextWebInformation : d; digest = i.FormDigestValue; digestHasta = Date.now() + ((i.FormDigestTimeoutSeconds || 1800) - 60) * 1000; return digest; });
  }
  var CONFLICTO = 'Otra persona ha cambiado esta solicitud mientras la tenías abierta. Pulsa Actualizar, revísala y repite la acción.';
  function enviarSP(url, cuerpo, sinPermiso, extra) {
    return obtenerDigest().then(function (dg) {
      return fetch(url, { method: 'POST', credentials: 'same-origin', body: JSON.stringify(cuerpo),
        headers: Object.assign({ Accept: 'application/json;odata=verbose', 'Content-Type': 'application/json;odata=verbose', 'X-RequestDigest': dg }, extra || {}) });
    }).then(function (r) {
      return r.text().then(function (txt) {
        var j = null; try { j = JSON.parse(txt); } catch (e) { /* sin JSON */ }
        if (!r.ok) {
          var m = j && ((j.error && j.error.message && (j.error.message.value || j.error.message)) || (j['odata.error'] && j['odata.error'].message && j['odata.error'].message.value));
          throw new Error(r.status === 403 ? sinPermiso : r.status === 412 ? CONFLICTO : (m || 'HTTP ' + r.status));
        }
        return j && (j.d || j);
      });
    });
  }
  function leerElemento(id, sel) {
    return fetch(urlLista() + '/items(' + id + ')?$select=' + ['Id', 'Modified'].concat(sel || []).join(','), { credentials: 'same-origin', headers: { Accept: 'application/json;odata=verbose' } })
      .then(function (r) { if (!r.ok) throw new Error(r.status === 404 ? 'La solicitud ya no existe' : 'HTTP ' + r.status); return r.json(); })
      .then(function (d) { d = d.d || d; return { etag: (d.__metadata && d.__metadata.etag) || '*', datos: d }; });
  }
  var mismaFecha = function (a, b) { return new Date(a).getTime() === new Date(b).getTime(); };

  // ---------- Carga ----------
  var PERSONAS = ['Solicitante', 'RepresentanteDelSolicitante', 'AprobadorDePermiso', 'AutorizadorDelPermiso', 'Registro_x0020_SIPERDEF'];
  var SEL = ['Id', 'Title', 'Estado', 'TipoDePermiso', 'CupoDeA_x00f1_o', 'FechaInicio', 'FechaDeFin', 'DiasFestivos', 'Dependencia', 'Empleo', 'AutorizarDirecto',
    'EstadoDeAprobacion', 'EstadoDeAutorizacion', 'EstadoDeRegistro', 'FechaDeAprobacion', 'FechaDeAutorizacion', 'SolicitanteTexto', 'RepresentanteTexto',
    'AprobadorTexto', 'AutorizadorTexto', 'CorreoDelSolicitante', 'CorreoDeAPROBADOR', 'CorreoDeAUTORIZADOR', 'JEFE', 'Created', 'Modified',
    'Unidad0/Id', 'Unidad0/Title', 'Author/Id', 'Author/Title', 'Editor/Title']
    .concat([].concat.apply([], PERSONAS.map(function (p) { return [p + '/Id', p + '/Title', p + '/EMail']; })));
  var EXPAND = ['Unidad0', 'Author', 'Editor'].concat(PERSONAS).join(',');
  var persona = function (u) { return u && u.Id ? { Id: u.Id, Title: u.Title || '', Email: u.EMail || '' } : null; };
  function aSol(it) {
    var t = {
      id: it.Id, asunto: it.Title || '(sin asunto)', estado: it.Estado || '', tipo: it.TipoDePermiso || '', cupo: it.CupoDeA_x00f1_o || '',
      ini: fechaSP(it.FechaInicio), fin: fechaSP(it.FechaDeFin), festivos: it.DiasFestivos || '', dependencia: it.Dependencia || '', empleo: it.Empleo || '',
      unidad: it.Unidad0 && it.Unidad0.Id ? { Id: it.Unidad0.Id, Title: it.Unidad0.Title || '' } : null, directo: it.AutorizarDirecto === true || it.AutorizarDirecto === 'true',
      eAprob: it.EstadoDeAprobacion || '', eAutor: it.EstadoDeAutorizacion || '', eReg: it.EstadoDeRegistro || '',
      fAprob: it.FechaDeAprobacion || '', fAutor: it.FechaDeAutorizacion || '', jefe: it.JEFE || '',
      sol: persona(it.Solicitante), rep: persona(it.RepresentanteDelSolicitante), apr: persona(it.AprobadorDePermiso),
      aut: persona(it.AutorizadorDelPermiso), reg: persona(it.Registro_x0020_SIPERDEF),
      solTexto: it.SolicitanteTexto || '', aprTexto: it.AprobadorTexto || '', autTexto: it.AutorizadorTexto || '',
      correoSol: it.CorreoDelSolicitante || '', correoApr: it.CorreoDeAPROBADOR || '', correoAut: it.CorreoDeAUTORIZADOR || '',
      creado: it.Created, modificado: it.Modified, autorId: it.Author && it.Author.Id, editor: it.Editor && it.Editor.Title
    };
    t.nombre = (t.sol && t.sol.Title) || t.solTexto || '(sin solicitante)';
    return t;
  }
  function cargar() {
    $('#estadoCarga').textContent = 'Cargando…';
    web = location.origin + pref.sitio.replace(/\/+$/, '');
    return Promise.all([
      api(web + '/_api/web/currentuser?$select=Id,Title,Email,LoginName').then(function (u) { yo = { Id: u.Id, Title: u.Title, Email: u.Email || '', LoginName: u.LoginName }; }),
      api(web + '/_api/web/currentuser/groups?$select=Title').then(function (d) { misGrupos = lista(d.value).map(function (x) { return x.Title; }); }).catch(function () { misGrupos = []; }),
      api(urlLista() + '?$select=Id,Title,ListItemEntityTypeFullName,RootFolder/ServerRelativeUrl&$expand=RootFolder').then(function (l) { listaInfo = l; }),
      api(urlLista() + "/fields?$select=InternalName,Choices&$filter=(InternalName eq 'Estado') or (InternalName eq 'TipoDePermiso') or (InternalName eq 'CupoDeA_x00f1_o') or (InternalName eq 'Dependencia') or (InternalName eq 'JEFE')")
        .then(function (d) { lista(d.value).forEach(function (f) { opciones[f.InternalName] = lista(f.Choices).length ? lista(f.Choices) : (f.Choices || []); }); }).catch(function () { /* se deducen de los datos */ }),
      todas(web + "/_api/web/lists/getbytitle('empleos')/items?$select=Title&$top=500").then(function (l) { empleos = l.map(function (x) { return x.Title; }).filter(Boolean); }).catch(function () { empleos = []; }),
      todas(web + "/_api/web/lists/getbytitle('UNIDADES')/items?$select=Id,Title&$top=500").then(function (l) { unidades = l.map(function (x) { return { Id: x.Id, Title: x.Title || '' }; }).sort(function (a, b) { return a.Title.localeCompare(b.Title, 'es'); }); }).catch(function () { unidades = []; })
    ]).then(function () {
      return todas(urlLista() + '/items?$top=1000&$select=' + SEL.join(',') + '&$expand=' + EXPAND);
    }).then(function (its) {
      items = its.map(aSol);
      cargadoEn = new Date();
      $('#estadoCarga').textContent = items.length + ' solicitudes · ' + cargadoEn.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
      render();
    }).catch(function (e) {
      $('#estadoCarga').textContent = 'Error';
      $('#vista').innerHTML = '<div class="error">No se pudo leer la lista: ' + esc(e.message || e) + '. ¿Tienes permiso para verla? Revisa el sitio y la lista en Ajustes.</div>' + (pref.vista === 'ajustes' ? vistaAjustes() : '');
    });
  }

  // ---------- Roles ----------
  var soy = function (p) { return !!(p && yo && p.Id === yo.Id); };
  var esMia = function (t) { return soy(t.sol) || soy(t.rep) || (!t.sol && t.autorId === (yo && yo.Id)); };
  var enRegistro = function () { return misGrupos.some(function (g) { return /registro/i.test(g); }); };
  var puedeEditar = function (t) { return esBorrador(t) && esMia(t); };
  var puedeAprobar = function (t) { return t.estado === E.PA && soy(t.apr); };
  var puedeAutorizar = function (t) { return t.estado === E.AP && soy(t.aut); };
  var puedeRegistrar = function (t) { return t.estado === E.AU && (soy(t.reg) || enRegistro()); };
  var pendientes = function () {
    return { aprobar: items.filter(puedeAprobar), autorizar: items.filter(puedeAutorizar), registrar: items.filter(puedeRegistrar) };
  };

  // ---------- Vistas ----------
  function tarjeta(t, extra) {
    var d = dias(t.ini, t.fin);
    return '<div class="card sol" data-id="' + t.id + '"><div class="tit">' + esc(t.nombre) + ' · ' + esc(t.tipo || t.asunto) + '</div><div class="meta">' +

              '<div class="aviso">' + txt + ' No se pudo enviar el aviso desde Colabora (' + esc(r.motivo) + ').' + (r.mailto ? ' <a class="btn" href="' + esc(r.mailto) + '">✉ Preparar el correo en Outlook</a>' : '') + '</div>';
            pref.vista = 'mias'; guardarPref(); render();
            if (id) abrir(id, m); else $('#dlg').close();
          });
        });
      }).catch(function (e) { boton.disabled = false; err('No se pudo guardar: ' + (e.message || e)); });
    };
    $('#nBorrador').onclick = function () { guardar(false, this); };
    $('#nEnviar').onclick = function () { guardar(true, this); };
  }

  // ---------- Impresión del calendario ----------
  function descargar(nombre, contenido, tipo) {
    var url = URL.createObjectURL(new Blob([contenido], { type: tipo }));
    var a = document.createElement('a'); a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
  }
  function imprimirCalendario() {
    var y = mes.getFullYear(), m = mes.getMonth(), ts = delCalendario();
    var d = new Date(y, m, 1 - ((mes.getDay() + 6) % 7)), filas = '';
    for (var s = 0; s < 6; s++) {
      if (s && d.getMonth() !== m) break;
      filas += '<tr>';
      for (var i = 0; i < 7; i++) {
        var k = iso(d), dentro = d.getMonth() === m;
        var del = dentro ? ts.filter(function (t) { return t.ini <= k && (t.fin || t.ini) >= k; }).sort(function (a, b) { return a.nombre.localeCompare(b.nombre, 'es'); }) : [];
        filas += '<td class="' + (dentro ? '' : 'fuera') + '"><div class="n">' + d.getDate() + '</div>' + del.slice(0, 10).map(function (t) { return '<div class="t' + (t.estado === E.PA ? ' p' : '') + '">• ' + esc(t.nombre) + '</div>'; }).join('') + (del.length > 10 ? '<div class="t"><i>+' + (del.length - 10) + ' más</i></div>' : '') + '</td>';
        d.setDate(d.getDate() + 1);
      }
      filas += '</tr>';
    }
    var nom = mes.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' }); nom = nom[0].toUpperCase() + nom.slice(1);
    var f = [pref.cal.dependencia, (unidades.find(function (u) { return String(u.Id) === String(pref.cal.unidad); }) || {}).Title].filter(Boolean).join(' · ');
    var doc = '<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Permisos ' + esc(nom) + '</title><style>@page{size:A4 landscape;margin:1cm}body{font-family:Arial,sans-serif;font-size:10pt;margin:0}' +
      '.cal{width:100%;border-collapse:collapse;table-layout:fixed}.cal th{background:#3b4a2f;color:#fff;padding:3px;font-size:9pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}' +
      '.cal td{border:1px solid #bbb;vertical-align:top;height:2.7cm;padding:2px 3px;font-size:7.5pt;overflow:hidden}.fuera{background:#f2f2f2;-webkit-print-color-adjust:exact;print-color-adjust:exact}.n{font-weight:bold;font-size:9pt}.p{color:#9a5b00}' +
      '.aviso{background:#fff4d6;padding:8px;margin:0 0 8px}@media print{.aviso{display:none}}</style></head><body><div class="aviso">Si no se abre el diálogo de impresión, pulsa Ctrl+P. Para PDF, elige «Guardar como PDF».</div>' +
      '<h2 style="text-align:center;margin:0 0 2px">PERMISOS · ' + esc(nom.toUpperCase()) + '</h2><p style="text-align:center;margin:0 0 6px">' + esc(f || 'Todas las dependencias y unidades') + (pref.cal.pendientes ? ' · en naranja, pendientes de aprobar' : '') + '</p>' +
      '<table class="cal"><tr>' + ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'].map(function (x) { return '<th>' + x + '</th>'; }).join('') + '</tr>' + filas + '</table>' +
      '<p style="font-size:8pt">Emitido por ' + esc(yo ? yo.Title : '') + ' el ' + new Date().toLocaleDateString('es-ES') + '.</p><scr' + 'ipt>window.onload=function(){setTimeout(function(){window.print()},400)}</scr' + 'ipt></body></html>';
    var w = null; try { w = window.open('', '_blank'); } catch (e) { w = null; }
    if (w && w.document) { w.document.open(); w.document.write(doc); w.document.close(); return; }
    descargar('permisos-' + iso(mes).slice(0, 7) + '.html', doc, 'text/html;charset=utf-8'); aviso('Descargado: ábrelo y elige Imprimir → Guardar como PDF');
  }
  function csv() {
    var c = function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; };
    var f = [['Id', 'Solicitante', 'Representante', 'Tipo de permiso', 'Cupo', 'Desde', 'Hasta', 'Días', 'Festivos', 'Dependencia', 'Unidad', 'Estado', 'Aprobador', 'Autorizador', 'Registro', 'Creada']];
    filtrarTodas().forEach(function (t) { f.push([t.id, t.nombre, t.rep && t.rep.Title, t.tipo, t.cupo, fCorta(t.ini), fCorta(t.fin), dias(t.ini, t.fin), t.festivos, t.dependencia, t.unidad && t.unidad.Title, t.estado, t.aprTexto, t.autTexto, t.eReg, fechaSP(t.creado)]); });
    descargar('permisos-' + hoy() + '.csv', '﻿' + f.map(function (r) { return r.map(c).join(';'); }).join('\r\n'), 'text/csv;charset=utf-8');
  }

  // ---------- Eventos ----------
  document.addEventListener('click', function (e) {
    var el = e.target;
    var tab = el.closest('#tabs a');
    if (tab) { pref.vista = tab.dataset.v; guardarPref(); render(); return; }
    if (el.closest('#recargar')) { cargar(); return; }
    if (el.closest('#nueva') || el.closest('[data-nueva]')) { if (cargadoEn) formulario(null); return; }
    if (el.closest('[data-cerrar]')) { $('#dlg').close(); return; }
    var m = el.closest('[data-mes]');
    if (m) { mes = new Date(mes.getFullYear(), mes.getMonth() + Number(m.dataset.mes), 1); render(); return; }
    if (el.closest('[data-impcal]')) { imprimirCalendario(); return; }
    if (el.closest('[data-csv]')) { csv(); return; }
    var ed = el.closest('[data-editar]');
    if (ed) { var te = items.find(function (x) { return x.id === Number(ed.dataset.editar); }); if (te) formulario(te); return; }
    var ac = el.closest('[data-acc]');
    if (ac) { var ta = items.find(function (x) { return x.id === dlgId; }); if (ta) accion(ta, ac.dataset.acc, ac); return; }
    var s = el.closest('[data-id]');
    if (s && !el.closest('dialog')) abrir(Number(s.dataset.id));
  });
  document.addEventListener('change', function (e) {
    var el = e.target;
    var f = { fEst: 'estado', fTipo: 'tipo', fDep: 'dependencia', fUni: 'unidad', fCupo: 'cupo' }[el.id];
    if (f) { pref.f[f] = el.value; guardarPref(); render(); return; }
    if (el.id === 'cDep') pref.cal.dependencia = el.value;
    else if (el.id === 'cUni') pref.cal.unidad = el.value;
    else if (el.id === 'cPend') pref.cal.pendientes = el.checked;
    else if (el.id === 'aCorreo') pref.correo = el.checked;
    else if (el.id === 'aSitio' || el.id === 'aLista') { pref.sitio = $('#aSitio').value.trim() || pref.sitio; pref.lista = $('#aLista').value.trim() || pref.lista; guardarPref(); cargadoEn = null; cargar(); return; }
    else return;
    guardarPref(); render();
  });
  document.addEventListener('input', function (e) {
    if (e.target.id !== 'fq') return;
    pref.f.q = e.target.value; guardarPref();
    var pos = e.target.selectionStart; render();
    var i = $('#fq'); if (i) { i.focus(); i.setSelectionRange(pos, pos); }
  });

  render();
  cargar();
})();
</script>
</body>
</html>
